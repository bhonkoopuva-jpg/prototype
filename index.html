<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>EveryWear</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdfbf7; --surface:#ffffff; --ink:#4a4238; --muted:#948a7a; --line:rgba(74,66,56,.10);
    --accent:#d97c4f; --accent-strong:#c1663b; --olive:#8a9878; --navy:#7192a3; --ochre:#e0b46a;
    --stage-studio:#f1eee6; --stage-daylight:#fdf7ea; --stage-pearl:#faf3f0;
    --f-display:'Fraunces', Georgia, serif;
    --f-body:'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  *{box-sizing:border-box;}
  html, body{ height:100%; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--f-body); display:flex; flex-direction:column; overflow:hidden; }
  img{max-width:100%;}
  a{ color:inherit; }
  [hidden]{ display:none !important; }
  .shell{ max-width:1520px; margin:0 auto; padding-inline:1.6rem; width:100%; }
  button{ font-family:inherit; }

  nav.top{ flex:none; z-index:20; background:var(--bg); border-bottom:1px solid var(--line); }
  nav.top .shell{ display:flex; align-items:center; justify-content:space-between; padding-block:.7rem; gap:1rem; flex-wrap:wrap; }
  .brand-block{ display:flex; align-items:center; gap:.6rem; }
  .brand-icon{
    width:38px; height:38px; border-radius:50%; background:var(--olive); color:#fff;
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .brand-icon svg{ width:19px; height:19px; }
  .brand-name{ font-family:var(--f-display); font-weight:700; font-size:1.1rem; line-height:1.15; }
  .brand-sub{ font-size:.66rem; font-weight:700; letter-spacing:.08em; color:var(--muted); text-transform:uppercase; }

  .nav-right{ display:flex; align-items:center; gap:1.3rem; flex-wrap:wrap; }
  .meta-block{ text-align:right; line-height:1.2; }
  .meta-label{ font-size:.62rem; font-weight:700; letter-spacing:.08em; color:var(--muted); text-transform:uppercase; }
  .meta-value{ font-family:ui-monospace,monospace; font-size:.78rem; color:var(--ink); }
  .meta-value.total{ font-family:var(--f-display); font-weight:700; font-size:1.15rem; }

  .btn-outline, .btn-solid{
    font-family:var(--f-body); font-size:.72rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    padding:.6rem 1.1rem; border-radius:999px; cursor:pointer; white-space:nowrap;
    display:inline-flex; align-items:center; gap:.4rem;
  }
  .btn-outline{ border:1px solid var(--line); background:transparent; color:var(--ink); }
  .btn-outline:hover{ border-color:var(--accent); color:var(--accent); }
  .btn-solid{ border:1px solid var(--olive); background:var(--olive); color:#fff; }
  .btn-solid:hover{ background:#73815f; }

  main{ flex:1; min-height:0; display:flex; flex-direction:column; }

  /* ---- Frame Studio configurator: fills the remaining viewport, no page scroll ---- */
  .studio{ flex:1; min-height:0; display:flex; flex-direction:column; gap:.7rem; padding-block:.8rem; }

  /* -- option rows: Montuur / Pootjes / Materiaal always visible, stacked -- */
  .option-rows{ flex:none; display:flex; flex-direction:column; gap:.5rem; }
  .option-row{
    display:flex; align-items:center; gap:1rem; background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:.55rem .8rem;
  }
  .option-row-label{
    flex:none; width:70px; font-size:.68rem; font-weight:700; letter-spacing:.07em; color:var(--muted); text-transform:uppercase;
  }
  .wheel-row{ flex:1; min-width:0; display:flex; align-items:center; gap:.6rem; overflow-x:auto; scroll-snap-type:x proximity; padding:.15rem; }
  .wheel-chip{
    flex:none; scroll-snap-align:start; display:flex; align-items:center; gap:.55rem; cursor:pointer;
    padding:.4rem .8rem .4rem .4rem; border-radius:999px; border:1px solid var(--line); background:var(--bg);
    transition:border-color .15s, background .15s;
  }
  .wheel-chip:hover{ border-color:var(--accent); }
  .wheel-chip.selected{ border-color:var(--olive); background:color-mix(in srgb, var(--olive) 10%, var(--bg)); }
  .wheel-chip .wheel-thumb{
    width:34px; height:34px; border-radius:50%; background:#fff; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; overflow:hidden; flex:none;
  }
  .wheel-chip .wheel-thumb img{ width:100%; height:100%; object-fit:contain; }
  .wheel-chip .wheel-thumb.swatch-dot{ border-radius:50%; }
  .wheel-chip .wheel-label{ font-size:.78rem; font-weight:600; color:var(--ink); white-space:nowrap; }
  .wheel-chip .wheel-price{ font-size:.68rem; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }

  /* -- preview stage -- */
  .stage-card{
    position:relative; background:linear-gradient(180deg, var(--stage-studio), color-mix(in srgb, var(--stage-studio) 70%, var(--olive)));
    border:1px solid var(--line); border-radius:20px; overflow:hidden; flex:1; min-height:0;
    transition:background .25s;
  }
  .stage-mountains{ position:absolute; left:0; right:0; bottom:0; height:38%; opacity:.5; pointer-events:none; }
  .stage-3d{ position:absolute; inset:0; }
  .stage-3d canvas{ width:100%; height:100%; display:block; cursor:grab; touch-action:none; }
  .stage-3d canvas:active{ cursor:grabbing; }
  .drag-hint{
    position:absolute; top:.9rem; left:50%; transform:translateX(-50%); z-index:2;
    font-size:.68rem; font-weight:600; letter-spacing:.04em; color:var(--muted);
    background:color-mix(in srgb, var(--surface) 80%, transparent); padding:.3rem .7rem; border-radius:999px;
    pointer-events:none; transition:opacity .3s; opacity:.9;
  }
  .drag-hint.faded{ opacity:0; }

  .stage-controls{
    position:absolute; left:50%; bottom:1.1rem; transform:translateX(-50%); z-index:3;
    display:flex; align-items:center; gap:.9rem; background:color-mix(in srgb, var(--surface) 88%, transparent);
    border:1px solid var(--line); border-radius:999px; padding:.4rem .6rem .4rem 1rem; backdrop-filter:blur(6px);
  }
  .zoom-group{ display:flex; align-items:center; gap:.55rem; color:var(--muted); }
  .zoom-group svg{ flex:none; width:16px; height:16px; stroke:var(--muted); }
  .zoom-group input[type=range]{ width:110px; accent-color:var(--olive); cursor:pointer; }
  .pill-group{ display:inline-flex; background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:.2rem; gap:.15rem; }
  .pill-group button{ border:none; background:transparent; padding:.4rem .85rem; border-radius:999px; font-size:.72rem; font-weight:700; letter-spacing:.03em; text-transform:uppercase; cursor:pointer; color:var(--muted); }
  .pill-group button.active{ background:var(--olive); color:#fff; }

  /* ---- live try-on modal ---- */
  .tryon-modal{
    position:fixed; inset:0; z-index:40; background:color-mix(in srgb, var(--ink) 45%, transparent);
    display:flex; align-items:center; justify-content:center; padding:1.2rem;
  }
  .tryon-panel{ background:var(--surface); border-radius:18px; padding:1.3rem; width:100%; max-width:560px; max-height:92vh; overflow-y:auto; }
  .tryon-panel-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:.9rem; }
  .tryon-panel-head h2{ font-family:var(--f-display); font-weight:700; font-size:1.2rem; margin:0; }
  .close-btn{ border:none; background:var(--bg); width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:.9rem; color:var(--ink); }
  .live-stage{ position:relative; width:100%; background:#000; border:1px solid var(--line); border-radius:16px; overflow:hidden; aspect-ratio:4/3; }
  video, canvas#liveCanvas{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  video{ transform:scaleX(-1); }
  .overlay-msg{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; color:#fff; background:rgba(0,0,0,.55); font-size:.9rem; padding:1.5rem; line-height:1.5; }
  .overlay-msg button{ margin-top:.8rem; padding:.6rem 1.2rem; border-radius:999px; border:none; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; font-size:.85rem; }
  .controls-row{ display:flex; gap:.7rem; flex-wrap:wrap; margin-top:.9rem; }
  .controls-row button{ flex:1; min-width:130px; padding:.65rem 1rem; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-weight:700; font-size:.85rem; cursor:pointer; }
  .controls-row button.primary{ background:var(--accent); color:#fff; border-color:transparent; }
  a#snapLink{ display:none; }

  .toast{
    position:fixed; left:50%; bottom:1.4rem; transform:translateX(-50%) translateY(120%);
    background:var(--ink); color:var(--bg); padding:.75rem 1.2rem; border-radius:999px; font-size:.85rem; font-weight:600;
    transition:transform .25s ease; z-index:50; white-space:nowrap;
  }
  .toast.show{ transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<nav class="top">
  <div class="shell">
    <div class="brand-block">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20l6-11 4 7 3-5 5 9z"/></svg>
      </div>
      <div>
        <div class="brand-name">EveryWear</div>

      </div>
    </div>
    <div class="nav-right">
      <div class="meta-block">
        <div class="meta-label">Ref</div>
        <div class="meta-value" id="refCode">EW-1A-NBCL00</div>
      </div>
      <div class="meta-block">
        <div class="meta-label">Total</div>
        <div class="meta-value total" id="totalPrice">€55</div>
      </div>
      <button class="btn-outline" id="tryOnBtn" type="button">Probeer Op</button>
      <button class="btn-outline" id="resetBtn" type="button">Reset</button>
      <button class="btn-solid" id="finishBtn" type="button">Finish Design</button>
    </div>
  </div>
</nav>

<main>
  <div class="studio shell">
    <div class="option-rows">
      <div class="option-row">
        <div class="option-row-label">Montuur</div>
        <div class="wheel-row" id="montuurRow"></div>
      </div>
      <div class="option-row">
        <div class="option-row-label">Pootjes</div>
        <div class="wheel-row" id="pootjesRow"></div>
      </div>
      <div class="option-row">
        <div class="option-row-label">Materiaal</div>
        <div class="wheel-row" id="materiaalRow"></div>
      </div>
    </div>

    <div class="stage-card" id="previewStage">
      <div class="stage-3d" id="stage3d">
        <canvas id="previewCanvas3d"></canvas>
        <span class="drag-hint" id="dragHint">Sleep om te draaien · scroll om te zoomen</span>
      </div>
      <div class="stage-controls">
        <div class="pill-group" id="angleToggle">
          <button data-angle="voor" class="active">Voor</button>
          <button data-angle="zij">Zij</button>
          <button data-angle="vrij">Vrij</button>
        </div>
        <div class="zoom-group">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="range" id="zoomRange" min="60" max="180" value="100" aria-label="Zoom">
        </div>
        <div class="pill-group" id="lightToggle">
          <button data-light="studio" class="active">Studio</button>
          <button data-light="daylight">Daylight</button>
          <button data-light="pearl">Pearl</button>
        </div>
      </div>
    </div>
  </div>
</main>

<div class="tryon-modal" id="tryonModal" hidden>
  <div class="tryon-panel">
    <div class="tryon-panel-head">
      <h2>Probeer je ontwerp op</h2>
      <button class="close-btn" id="closeTryOn" aria-label="Sluiten">✕</button>
    </div>
    <div class="live-stage" id="stage">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="liveCanvas"></canvas>
      <div class="overlay-msg" id="startMsg">
        <div>
          <div>Geef toegang tot je camera om de bril te passen.</div>
          <button id="startBtn">Camera starten</button>
        </div>
      </div>
    </div>
    <div class="controls-row">
      <button class="primary" id="snapBtn">Maak foto</button>
      <button id="switchCamBtn">Wissel camera</button>
    </div>
    <a id="snapLink" download="everywear-pasfoto.png"></a>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
import { RoomEnvironment } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/environments/RoomEnvironment.js';

/* ======================================================================
   MASTER MEASUREMENT + STANDARD HINGE INTERFACE
   1 three.js unit = 1mm. Every montuur and every pootje is generated
   against this one shared hinge point (HINGE) — not its own, independently
   guessed, attachment spot — so any montuur can take any pootje with no
   gaps, overlap, floating parts or mismatched angles. This is the
   "STANDAARD SCHARNIER" the brief asks for: build it once, build every
   part against it, never per-combination.
   ====================================================================== */
const HINGE = Object.freeze({
  x: 70,   // mm from center-front — the shared technical interface every
           // montuur's hinge-stub reaches out to and every pootje starts
           // from. Deliberately generic, not any one product's measured
           // frame width: a montuur's real lens/bridge size (see
           // REAL_WORLD_DIMENSIONS below) is free to differ, and its
           // hinge-stub simply gets longer or shorter to still land here.
  y: 6,    // mm above the lens's own vertical center (hinges sit high)
  z: 1.5,  // mm back from the rim's front face
});
const TEMPLE_LENGTH_MM = 140; // fallback only, used when a pootje has no
// REAL_WORLD_DIMENSIONS.templeLength yet — see pootjeScaleFactor() below.

/* ---------- configuration data ----------
   Two separate stages feed the final geometry, and they are kept
   deliberately separate rather than baked into one set of numbers:

     SHAPE (this section): `lensContour` and `curvePoints` are NOT
     hand-fit formulas, they are actual traced measurements from
     assets/*.jpg —
       - lensContour: the lens-hole's own pixel silhouette, extracted with
         OpenCV (threshold → enclosed-background connected components →
         convex hull → polygon simplify), then the left/right lens
         contours were polar-resampled about their own centroid and
         averaged (mirroring one onto the other) into one canonical
         symmetric shape.
       - curvePoints: the pootje's own centerline, extracted by scanning
         every column of the side-profile photo for the temple's
         top/bottom edge and averaging, smoothed.
     These point arrays were converted to a number space using an
     ASSUMED absolute scale (no ruler was visible in any photo to measure
     against), so their proportions/curvature are real measurements, but
     their absolute size is not yet.

     SCALE (REAL_WORLD_DIMENSIONS, per montuur/pootje below): the actual
     caliper-measured dimensions of the physical product, in mm. This is
     what corrects the shape data above from "proportionally right" to
     "actually the right size" — required for AR, where a model 5%
     off-size shows the customer a different pair of glasses than the one
     they're buying. Every field starts `null` (unmeasured) rather than a
     guessed number; see montuurScaleFactors()/pootjeScaleFactor() below
     for exactly how a missing measurement is handled (it falls back to
     the shape data's own calibration anchor and logs a console warning,
     it is never silently invented).

   Pipeline: productfoto → OpenCV pixelmetingen → exacte 2D-vorm
   (lensContour/curvePoints, this section) → REAL_WORLD_DIMENSIONS →
   geschaald 3D-model (scaledMontuur/scaledPootje) → modulaire pootjes
   (shared HINGE) → (future) AR.

   What a single 2D photo genuinely cannot give us at all, however good
   the real-world scale becomes, is called out per field below: frame
   depth and lens curvature (not visible in a flat front photo), temple
   outward flare (not visible in a flat side photo), and the pootje's
   width-taper profile (the photo's raw width signal is contaminated by
   perspective foreshortening on the curved back half, so it's simplified
   to a straight taper rather than taken literally). Those remain
   informed estimates no matter how good the physical measurements get,
   and would need an actual 3D scan or a second camera angle to fix. */
const MONTUREN = [
  // Dodoma = green-voor.jpg. lensContour is the measured, symmetric-
  // averaged lens-hole silhouette (47mm wide at the calibrated scale —
  // see the module header above for why that absolute number is still an
  // assumption, not a measurement). rimBorder/rimDepth/bridgeWidth are
  // not visible as a separate, isolatable contour in the photo at this
  // resolution, so those stay informed estimates (very thin wire, as the
  // photo clearly shows) rather than measurements.
  { id:1, label:'Dodoma', price:45, shape:'round', finish:'metal',
    bridgeWidth:20, rimBorder:1.5, rimDepth:2.6,
    // Real caliper measurements of the physical product (mm). Fill these
    // in from the actual item, not an estimate — see the header comment
    // above. Until then every field stays null and the renderer falls
    // back to this lensContour's own calibration anchor (~47×40.8mm).
    REAL_WORLD_DIMENSIONS:{ frameWidth:null, frameHeight:null, bridgeWidth:null, lensWidth:null, lensHeight:null },
    lensContour:[[23.241,-0],[22.423,-2.952],[21.635,-5.797],[20.08,-8.317],[18.52,-10.693],[16.984,-13.032],[15.19,-15.19],[12.983,-16.92],[10.771,-18.655],[8.077,-19.499],[5.374,-20.056],[2.685,-20.397],[0,-20.277],[-2.653,-20.151],[-5.315,-19.836],[-8.068,-19.478],[-10.739,-18.601],[-13.249,-17.267],[-15.63,-15.63],[-17.465,-13.402],[-19.259,-11.119],[-21.121,-8.749],[-22.11,-5.924],[-22.9,-3.015],[-23.551,-0],[-23.471,3.09],[-23.389,6.267],[-23.234,9.624],[-22.195,12.814],[-20.474,15.71],[-17.907,17.907],[-14.585,19.008],[-11.478,19.88],[-8.338,20.129],[-5.424,20.242],[-2.679,20.348],[-0,20.452],[2.665,20.243],[5.317,19.843],[8.049,19.431],[10.965,18.991],[13.825,18.017],[16.738,16.738],[19.653,15.08],[21.735,12.549],[23.049,9.547],[23.256,6.231],[23.449,3.087]] },
  // Kuala Lumpur = tortoise-voor.jpg. Same measurement process; lensContour
  // is 42.4mm wide at the calibrated scale.
  { id:3, label:'Kuala Lumpur', price:45, shape:'square', finish:'acetate',
    bridgeWidth:17, rimBorder:4.8, rimDepth:6.2,
    // Real caliper measurements of the physical product (mm). Fill these
    // in from the actual item, not an estimate — see the header comment
    // above. Until then every field stays null and the renderer falls
    // back to this lensContour's own calibration anchor (~42.4×32.8mm).
    REAL_WORLD_DIMENSIONS:{ frameWidth:null, frameHeight:null, bridgeWidth:null, lensWidth:null, lensHeight:null },
    lensContour:[[20.441,-0],[19.611,-2.582],[18.73,-5.019],[17.44,-7.224],[16.143,-9.32],[14.502,-11.128],[12.72,-12.72],[10.66,-13.892],[8.602,-14.899],[6.473,-15.628],[4.278,-15.967],[2.146,-16.297],[0,-16.354],[-2.149,-16.32],[-4.359,-16.27],[-6.589,-15.906],[-8.957,-15.515],[-11.403,-14.861],[-13.884,-13.884],[-15.963,-12.249],[-17.927,-10.35],[-19.03,-7.882],[-19.896,-5.331],[-20.385,-2.684],[-20.735,-0],[-21.022,2.768],[-21.225,5.687],[-21.169,8.769],[-20.359,11.754],[-18.557,14.239],[-15.525,15.525],[-12.438,16.209],[-9.401,16.283],[-6.771,16.348],[-4.396,16.406],[-2.167,16.46],[-0,16.307],[2.116,16.075],[4.245,15.842],[6.462,15.599],[8.855,15.337],[11.313,14.743],[13.935,13.935],[16.95,13.006],[19.633,11.335],[21.175,8.771],[21.167,5.672],[20.918,2.754]] },
];
function getMontuur(id){ return MONTUREN.find(m=>m.id===id); }

const POOTJES = [
  // Dodoma = green-pootje.jpg (measured against green-zij-montuur.jpg
  // too). curvePoints is the actual traced centerline, hinge to tip, at
  // 140mm calibrated length — not a bend-start/bend-power formula.
  // thickness/width stay informed estimates (the photo shows the flat
  // face, not the true edge-on thickness, and the raw width signal was
  // too noisy past the hinge clip to trust point-by-point).
  { id:'A', label:'Dodoma', price:0, style:'thin',
    thickness:2.0, tipThickness:2.0, width:2.7, flare:1.5,
    // Real caliper measurement of the physical temple's length (mm).
    // null = not yet measured; falls back to the curvePoints' own 140mm
    // calibration anchor — see pootjeScaleFactor() below.
    REAL_WORLD_DIMENSIONS:{ templeLength:null },
    curvePoints:[[0,-0],[-4.65,-1.84],[-7.05,-2.01],[-11.85,-2.27],[-16.5,-2.56],[-18.9,-2.76],[-23.71,-3.13],[-28.35,-3.52],[-30.76,-3.71],[-35.56,-4.09],[-40.21,-4.47],[-45.01,-4.86],[-47.41,-5.05],[-52.06,-5.4],[-56.86,-5.76],[-59.27,-5.96],[-63.91,-6.33],[-68.72,-6.74],[-71.12,-6.96],[-75.93,-7.4],[-80.57,-7.8],[-82.97,-8],[-87.78,-8.41],[-92.43,-8.78],[-94.83,-9],[-99.63,-9.47],[-104.28,-10.01],[-109.08,-10.23],[-111.49,-10.38],[-116.13,-11.13],[-120.94,-11.81],[-123.34,-12.35],[-127.99,-13.69],[-132.79,-15.99],[-135.19,-17.67],[-140,-18.84]] },
  // Kuala Lumpur = tortoise-pootje.jpg. Note the measured tip drop here
  // (~39mm) is notably larger than Dodoma's (~19mm) — plausible for a
  // longer comfort-cable curve, but also exactly the kind of number a
  // single side-profile photo can exaggerate if the temple isn't shot
  // perfectly flat to the camera. Used as measured per this request's
  // instruction to prioritize the photo over my own judgment, but worth
  // a visual sanity-check on the live model.
  { id:'C', label:'Kuala Lumpur', price:0, style:'bold',
    thickness:4.2, tipThickness:2.0, width:5.6, flare:2.5,
    // Real caliper measurement of the physical temple's length (mm).
    // null = not yet measured; falls back to the curvePoints' own 140mm
    // calibration anchor — see pootjeScaleFactor() below.
    REAL_WORLD_DIMENSIONS:{ templeLength:null },
    curvePoints:[[0,-0],[-4.72,-1.6],[-7.01,-1.71],[-11.86,-1.93],[-16.57,-2.36],[-18.86,-3.14],[-23.72,-3.28],[-28.43,-3.25],[-30.72,-3.27],[-35.57,-3.36],[-40.29,-3.5],[-45,-3.78],[-47.43,-3.94],[-52.15,-4.32],[-56.86,-4.79],[-59.29,-5.08],[-64,-5.73],[-68.72,-6.46],[-71.15,-6.85],[-75.86,-7.05],[-80.58,-7.43],[-83,-7.69],[-87.72,-8.31],[-92.44,-9.18],[-94.86,-9.75],[-99.58,-11.24],[-104.29,-13.36],[-109.14,-16.62],[-111.43,-18.61],[-116.15,-23.55],[-121,-27.04],[-123.29,-28.56],[-128.01,-31.68],[-132.86,-35.01],[-135.15,-36.92],[-140,-39.48]] },
];
function getPootje(id){ return POOTJES.find(p=>p.id===id); }

// bbox of a flat [x,y] point list — used wherever code needs the overall
// width/height of a measured contour (replaces the old lensWidth/
// lensHeight config fields, which are now derived from lensContour itself
// so they can never drift out of sync with the actual measured shape).
function contourBounds(points){
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for(const [x,y] of points){
    if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y;
  }
  return { minX,maxX,minY,maxY, w:maxX-minX, h:maxY-minY };
}

// offset a (roughly convex, as ours are post-convexHull) closed polygon
// outward by `dist` mm, via each vertex's averaged adjacent-edge normal —
// used to build the rim's OUTER boundary from the measured lensContour,
// which is the rim's INNER boundary (only the inner edge — where the
// glass sits — is cleanly isolatable from the photo; the outer edge is
// reconstructed from it plus the rim thickness rather than traced
// separately).
function offsetContour(points, dist){
  const n = points.length;
  const out = [];
  for(let i=0;i<n;i++){
    const [px,py] = points[(i-1+n)%n], [cx,cy] = points[i], [nx,ny] = points[(i+1)%n];
    const e1x=cx-px, e1y=cy-py, e2x=nx-cx, e2y=ny-cy;
    const len1=Math.hypot(e1x,e1y)||1, len2=Math.hypot(e2x,e2y)||1;
    // outward normal of each edge — our traced contours run clockwise
    // (verified via shoelace sign), so the outward normal of an edge
    // (ex,ey) is (-ey,ex)
    const n1x=-e1y/len1, n1y=e1x/len1, n2x=-e2y/len2, n2y=e2x/len2;
    let avgx=n1x+n2x, avgy=n1y+n2y;
    const avgLen=Math.hypot(avgx,avgy)||1;
    avgx/=avgLen; avgy/=avgLen;
    out.push([cx+avgx*dist, cy+avgy*dist]);
  }
  return out;
}

/* ======================================================================
   SHAPE → SCALE: turn the pixel-measured contours above into true real-
   world millimeters, using REAL_WORLD_DIMENSIONS. This is the one place
   the "echte productafmetingen bepalen de schaal" rule is enforced — the
   measured shape itself (lensContour/curvePoints) is never edited to
   "look right", only multiplied by a scale factor derived from an actual
   caliper measurement. Every build function below consumes the output of
   scaledMontuur()/scaledPootje(), never the raw MONTUREN/POOTJES entries.
   ====================================================================== */
// sx/sy are kept separate (not one uniform factor) so that if both a real
// lensWidth AND a real lensHeight are supplied, a photo that was
// perspectivically foreshortened more in one axis than the other gets
// corrected on each axis independently, rather than forcing a single
// average scale onto a possibly-distorted shape.
function montuurScaleFactors(montuur){
  const rwd = montuur.REAL_WORLD_DIMENSIONS || {};
  const shape = contourBounds(montuur.lensContour); // the lensContour's own baked-in calibration size
  let sx = 1, sy = 1, measured = false;
  if(rwd.lensWidth){ sx = rwd.lensWidth / shape.w; measured = true; }
  if(rwd.lensHeight){ sy = rwd.lensHeight / shape.h; measured = true; }
  // only one axis measured: the other axis has no independent real data,
  // so the least-invented assumption is to reuse the measured axis'
  // factor rather than leaving it at the old calibration guess.
  if(rwd.lensWidth && !rwd.lensHeight) sy = sx;
  if(rwd.lensHeight && !rwd.lensWidth) sx = sy;

  // secondary real measurements, if supplied, are NOT used to drive the
  // scale (lensWidth/lensHeight are the direct match to lensContour's own
  // calibration) — they're cross-checked against it instead, to surface a
  // perspective-distorted source photo rather than silently absorb it.
  const warn = (field, measuredMm, impliedMm) => {
    if(Math.abs(impliedMm - measuredMm) / measuredMm > 0.05){
      console.warn(`[${montuur.label}] REAL_WORLD_DIMENSIONS.${field} (${measuredMm}mm) doesn't match the ${impliedMm.toFixed(1)}mm implied by lensWidth/lensHeight scale (>5% off) — possible perspective distortion in the source photo, or one of the two measurements needs rechecking.`);
    }
  };
  if(rwd.bridgeWidth) warn('bridgeWidth', rwd.bridgeWidth, montuur.bridgeWidth*sx);
  if(rwd.frameWidth){
    const outerW = contourBounds(offsetContour(montuur.lensContour, montuur.rimBorder)).w;
    warn('frameWidth', rwd.frameWidth, montuur.bridgeWidth*sx + 2*outerW*sx);
  }
  if(rwd.frameHeight){
    const outerH = contourBounds(offsetContour(montuur.lensContour, montuur.rimBorder)).h;
    warn('frameHeight', rwd.frameHeight, outerH*sy);
  }
  if(!measured){
    console.warn(`[${montuur.label}] No REAL_WORLD_DIMENSIONS measured yet — rendering at the photo's own ASSUMED calibration size (${shape.w.toFixed(1)}×${shape.h.toFixed(1)}mm lens), not a verified physical measurement. Fill in REAL_WORLD_DIMENSIONS.lensWidth/lensHeight for an AR-accurate scale.`);
  }
  return { sx, sy, measured };
}

// a copy of montuur with every geometry-relevant field — lensContour,
// bridgeWidth, rimBorder, rimDepth — scaled to true mm. The contour's
// proportions and curvature (the actual photo measurement) are untouched;
// only its absolute size changes.
function scaledMontuur(montuur){
  const { sx, sy } = montuurScaleFactors(montuur);
  const sAvg = (sx+sy)/2; // rimBorder/rimDepth have no independent real
  // measurement of their own (not in the REAL_WORLD_DIMENSIONS field
  // list), so they scale with the average of whatever axes were measured
  // rather than drifting out of proportion with the lens they sit on.
  return {
    ...montuur,
    lensContour: montuur.lensContour.map(([x,y]) => [x*sx, y*sy]),
    bridgeWidth: montuur.bridgeWidth * sx,
    rimBorder: montuur.rimBorder * sAvg,
    rimDepth: montuur.rimDepth * sAvg,
  };
}

// a single length measurement (no second axis available for a temple, so
// this stays a uniform scale along the curve — flagged in the header
// comment as the honest limit of what a side-profile photo can give us).
function pootjeScaleFactor(pootje){
  const rwd = pootje.REAL_WORLD_DIMENSIONS || {};
  if(rwd.templeLength) return rwd.templeLength / TEMPLE_LENGTH_MM;
  console.warn(`[${pootje.label}] No REAL_WORLD_DIMENSIONS.templeLength measured yet — rendering at the curvePoints' own ASSUMED calibration length (${TEMPLE_LENGTH_MM}mm), not a verified physical measurement.`);
  return 1;
}
function scaledPootje(pootje){
  const s = pootjeScaleFactor(pootje);
  return { ...pootje, curvePoints: pootje.curvePoints.map(([z,y]) => [z*s, y*s]) };
}

/* ---------- simple vector glasses (unchanged) — used only for the live
   webcam try-on overlay below, which draws on a flat 2D video frame and
   has nothing to do with the 3D studio preview. ---------- */
function drawGlassesFront(ctx, cx, cy, unitScale, color){
  ctx.save(); ctx.translate(cx, cy); ctx.scale(unitScale, unitScale);
  const lensW=58, lensH=40, rimW=9, gap=20, r=8;
  ctx.lineJoin='round'; ctx.fillStyle=color; ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.lineWidth=1;
  function rr(x,y,w,h,rad){
    ctx.beginPath(); ctx.moveTo(x+rad,y); ctx.arcTo(x+w,y,x+w,y+h,rad); ctx.arcTo(x+w,y+h,x,y+h,rad);
    ctx.arcTo(x,y+h,x,y,rad); ctx.arcTo(x,y,x+w,y,rad); ctx.closePath();
  }
  [-1,1].forEach(side=>{
    const x = side===-1 ? -(gap/2+lensW) : gap/2, y = -lensH/2;
    rr(x-rimW/2, y-rimW/2, lensW+rimW, lensH+rimW, r+rimW/2); ctx.fill(); ctx.stroke();
    ctx.save(); rr(x,y,lensW,lensH,r); ctx.clip();
    ctx.fillStyle='rgba(255,255,255,0.08)'; ctx.fillRect(x,y,lensW,lensH); ctx.restore();
    const armX = side===-1 ? x-rimW/2 : x+lensW+rimW/2;
    ctx.beginPath(); ctx.moveTo(armX,0); ctx.lineTo(armX+side*26,-4);
    ctx.lineWidth=rimW*0.7; ctx.strokeStyle=color; ctx.lineCap='round'; ctx.stroke();
  });
  ctx.fillStyle=color; rr(-gap/2, -lensH/2+6, gap, 9, 4); ctx.fill();
  ctx.restore();
}

/* ======================================================================
   PARAMETRIC 3D GEOMETRY — frame + temples, built in real millimeters
   against the shared HINGE point above. Nothing here is a photo or a
   flat sprite: every part is real extruded/tubed 3D geometry, so it can
   be viewed, lit and rotated from any angle, and reused as-is for a
   future AR try-on. ====================================================================== */
// build a THREE.Shape by tracing a measured [x,y] point list directly
// (straight segments between consecutive points — the points are already
// densely sampled, ~36-48 of them, from the real photo contour, so no
// formula/curve-fit is used here at all).
function shapeFromContour(points){
  const s = new THREE.Shape();
  points.forEach(([x,y], i) => { if(i===0) s.moveTo(x,y); else s.lineTo(x,y); });
  s.closePath();
  return s;
}

// one lens rim (a ring: outer boundary minus the measured inner lens-hole
// contour, extruded front-to-back) — symmetric about its own local origin,
// so the left lens is just a mirrored *position*, never a mirrored mesh.
// The outer boundary is the measured contour offset outward by rimBorder
// (see offsetContour above for why — only the inner edge is cleanly
// traceable from the photo).
function buildLensRimGeometry(montuur){
  const { lensContour, rimBorder:b, rimDepth:d } = montuur;
  const outer = shapeFromContour(offsetContour(lensContour, b));
  const inner = shapeFromContour(lensContour);
  outer.holes.push(inner);
  const geo = new THREE.ExtrudeGeometry(outer, {
    depth:d, bevelEnabled:true, bevelThickness:0.35, bevelSize:0.3, bevelSegments:2, curveSegments:20,
  });
  geo.translate(0, 0, -d/2);
  return geo;
}

// the actual lens glass filling the rim's inner opening — exactly the
// measured inner contour (so there's no gap/overlap between glass and
// rim), extruded thin and centered in the rim's own depth. Always clear
// optical glass: the materiaal picker colors the frame, never the lens.
function buildLensGlassGeometry(montuur){
  const shape = shapeFromContour(montuur.lensContour);
  const geo = new THREE.ExtrudeGeometry(shape, { depth:0.9, bevelEnabled:false, curveSegments:20 });
  geo.translate(0, 0, -0.45);
  return geo;
}

// bridge: a short arched tube between the two lenses' inner-top edges.
// topY comes from the measured contour's own topmost point (not a
// formula against lensHeight, which no longer exists as a separate field).
function buildBridgeGeometry(montuur){
  const halfB = montuur.bridgeWidth/2;
  const topY = contourBounds(montuur.lensContour).maxY - 2;
  const curve = new THREE.QuadraticBezierCurve3(
    new THREE.Vector3(-halfB, topY, 0),
    new THREE.Vector3(0, topY+3.2, 0),
    new THREE.Vector3(halfB, topY, 0),
  );
  return new THREE.TubeGeometry(curve, 12, Math.max(0.9, montuur.rimBorder*0.5), 8, false);
}

// hinge stub: carries the rim's outer edge out to the STANDARD hinge X —
// the literal, physical connector every pootje plugs into, built from the
// same shared HINGE constants rather than anything montuur-specific.
// lensEdgeX now comes from the measured (and rim-offset) contour's own
// bounding box rather than a stored lensWidth field.
function buildHingeStubGeometry(montuur){
  const outerW = contourBounds(offsetContour(montuur.lensContour, montuur.rimBorder)).w;
  const lensEdgeX = montuur.bridgeWidth/2 + outerW;
  const len = Math.max(1.5, (HINGE.x + 1.2) - lensEdgeX);
  // z-depth must reach past HINGE.z (where every temple's local origin sits)
  // with real overlap, not just up to the rim's own front-to-back depth —
  // otherwise a thin montuur (small rimDepth) can leave a sub-mm gap at the
  // exact point the temple attaches, however good it looks at other angles.
  const zDepth = Math.max(montuur.rimDepth*0.85, (HINGE.z + 2.5)*2);
  const geo = new THREE.BoxGeometry(len, Math.max(2.2, montuur.rimBorder*1.7), zDepth);
  geo.translate(lensEdgeX + len/2, HINGE.y, 0);
  return geo;
}

// a tube with a *varying* radius along its length (three.js' own
// TubeGeometry only supports a constant radius) — needed to reconstruct
// Kuala Lumpur's pootje, which tapers from thick acetate at the hinge to a
// thin cable-like tip in tortoise-pootje.jpg. Mirrors TubeGeometry's own
// construction (Frenet frames around the curve), just with radiusFn(t)
// instead of one fixed radius.
function buildTaperedTubeGeometry(curve, segments, radialSegments, radiusFn){
  const frames = curve.computeFrenetFrames(segments, false);
  const pathPoints = curve.getSpacedPoints(segments);
  const positions = [], normals = [], indices = [];
  for(let i=0;i<=segments;i++){
    const r = radiusFn(i/segments);
    const N = frames.normals[i], B = frames.binormals[i], P = pathPoints[i];
    for(let j=0;j<=radialSegments;j++){
      const v = (j/radialSegments) * Math.PI*2;
      const sin = Math.sin(v), cos = -Math.cos(v);
      const nx = cos*N.x + sin*B.x, ny = cos*N.y + sin*B.y, nz = cos*N.z + sin*B.z;
      positions.push(P.x + r*nx, P.y + r*ny, P.z + r*nz);
      normals.push(nx, ny, nz);
    }
  }
  for(let i=0;i<segments;i++){
    for(let j=0;j<radialSegments;j++){
      const a = (radialSegments+1)*i + j, b = (radialSegments+1)*(i+1) + j;
      const c = (radialSegments+1)*(i+1) + (j+1), d = (radialSegments+1)*i + (j+1);
      indices.push(a,b,d, b,c,d);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setIndex(indices);
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
  return geo;
}

// pootje (temple arm): starts exactly at local origin (the hinge pivot),
// runs backward (-Z) with an outward flare and a downward comfort bend —
// generated directly mirrored by `side` (1=right, -1=left) so normals are
// never flipped via negative scale. The (z,y) path itself is the measured
// curvePoints from the photo (see POOTJES above) — not a bend-formula —
// run backward from the hinge pivot at local origin; `flare` is the one
// part of this curve a side-profile photo can't show at all (outward X
// splay only shows in a front/top view), so it stays a straight ramp.
function buildTempleGeometry(pootje, side){
  // normalize against this pootje's OWN curve length, not the fallback
  // constant — once a real templeLength measurement scales curvePoints
  // (see scaledPootje above), the flare ramp must track the new length.
  const templeLen = Math.abs(pootje.curvePoints[pootje.curvePoints.length-1][0]) || TEMPLE_LENGTH_MM;
  const pts = pootje.curvePoints.map(([z,y]) => {
    const f = Math.abs(z) / templeLen;
    return new THREE.Vector3(side * f * pootje.flare, y, z);
  });
  const curve = new THREE.CatmullRomCurve3(pts);
  const radiusFn = t => THREE.MathUtils.lerp(pootje.thickness/2, pootje.tipThickness/2, Math.min(1, t/0.9));
  const geo = buildTaperedTubeGeometry(curve, 56, 10, radiusFn);
  if(pootje.width > pootje.thickness){
    geo.scale(pootje.width/pootje.thickness, 1, 1); // flatten into an oval cross-section
  }
  return geo;
}

// assemble one full pair of glasses: montuur + pootje, combined dynamically
// (never a pre-made per-combination model) and attached purely through HINGE
function buildGlassesGroup(montuur, pootje, material, lensMaterial){
  const group = new THREE.Group();
  const rimGeo = buildLensRimGeometry(montuur);
  const lensGeo = buildLensGlassGeometry(montuur);
  const bridgeGeo = buildBridgeGeometry(montuur);
  const stubGeo = buildHingeStubGeometry(montuur);
  const templeGeoR = buildTempleGeometry(pootje, 1);
  const templeGeoL = buildTempleGeometry(pootje, -1);

  const lensX = montuur.bridgeWidth/2 + contourBounds(offsetContour(montuur.lensContour, montuur.rimBorder)).w/2;
  [1,-1].forEach(side=>{
    const rim = new THREE.Mesh(rimGeo, material);
    rim.position.x = side*lensX;
    group.add(rim);

    const lens = new THREE.Mesh(lensGeo, lensMaterial);
    lens.position.x = side*lensX;
    group.add(lens);

    const stub = new THREE.Mesh(stubGeo, material);
    stub.position.x = 0; // geometry already baked to the right-side X; mirror via scale for the box only (box is symmetric front/back so this is safe)
    stub.scale.x = side;
    group.add(stub);

    const temple = new THREE.Mesh(side===1 ? templeGeoR : templeGeoL, material);
    temple.position.set(side*HINGE.x, HINGE.y, HINGE.z);
    group.add(temple);
  });
  group.add(new THREE.Mesh(bridgeGeo, material));
  return group;
}
function disposeGroup(group){
  group.traverse(obj=>{ if(obj.geometry) obj.geometry.dispose(); });
}

// procedural tortoiseshell pattern for the "Schildpad" materiaal — mottled
// amber/dark blotches on a canvas texture, generated once and reused, so
// that material reads as a real acetate pattern instead of a flat brown.
let tortoiseTexture = null;
function getTortoiseTexture(){
  if(tortoiseTexture) return tortoiseTexture;
  const size = 256;
  const c = document.createElement('canvas'); c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#9a6a3a'; ctx.fillRect(0,0,size,size);
  for(let i=0;i<220;i++){
    const x = Math.random()*size, y = Math.random()*size, r = 3+Math.random()*16;
    ctx.fillStyle = Math.random()<0.55 ? 'rgba(35,20,10,0.55)' : 'rgba(224,175,110,0.4)';
    ctx.beginPath();
    ctx.ellipse(x, y, r, r*(0.5+Math.random()*0.4), Math.random()*Math.PI, 0, Math.PI*2);
    ctx.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  if('colorSpace' in tex) tex.colorSpace = THREE.SRGBColorSpace;
  tortoiseTexture = tex;
  return tex;
}

// soft contact shadow: a transparent disc with a radial-gradient alpha
// texture sitting just under the glasses — the classic cheap-but-effective
// stand-in for real ground shadows, grounds the product instead of letting
// it float against the stage background.
function buildContactShadowTexture(){
  const size = 256;
  const c = document.createElement('canvas'); c.width = c.height = size;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(size/2,size/2,0, size/2,size/2,size/2);
  g.addColorStop(0, 'rgba(0,0,0,0.38)');
  g.addColorStop(0.7, 'rgba(0,0,0,0.14)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,size,size);
  const tex = new THREE.CanvasTexture(c);
  if('colorSpace' in tex) tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const shadowMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(1,1),
  new THREE.MeshBasicMaterial({ map:buildContactShadowTexture(), transparent:true, depthWrite:false }),
);
shadowMesh.rotation.x = -Math.PI/2;
scene.add(shadowMesh);

let glassesGroup = null;
function rebuildGlasses(){
  if(glassesGroup){ scene.remove(glassesGroup); disposeGroup(glassesGroup); }
  const montuurRaw = getMontuur(state.montuur);
  const pootjeRaw = getPootje(state.pootje);
  // all geometry is built from the SCALED copies (real-world mm, see
  // scaledMontuur/scaledPootje above) — montuurRaw/pootjeRaw are kept
  // around only for non-geometry metadata (finish, label).
  const montuur = scaledMontuur(montuurRaw);
  const pootje = scaledPootje(pootjeRaw);
  const mat = getMateriaal(state.materiaal);
  const isTortoise = mat.id === 'schildpad';
  const isTransparent = mat.id === 'transparant';

  // tortoiseshell uses a texture map (so its color comes from the map, not
  // the base color — tint it white so the map reads true); every other
  // materiaal is a flat color with no map.
  sharedMaterial.map = isTortoise ? getTortoiseTexture() : null;
  sharedMaterial.color.set(isTortoise ? 0xffffff : mat.hex);
  sharedMaterial.transmission = isTransparent ? 0.85 : 0;
  sharedMaterial.transparent = isTransparent;
  sharedMaterial.thickness = isTransparent ? 1.5 : 0;
  sharedMaterial.roughness = montuur.finish==='metal' ? 0.25 : (isTransparent ? 0.12 : 0.42);
  sharedMaterial.metalness = montuur.finish==='metal' ? 0.65 : 0.04;
  sharedMaterial.clearcoat = montuur.finish==='metal' ? 0.25 : 0.55;
  sharedMaterial.clearcoatRoughness = montuur.finish==='metal' ? 0.15 : 0.22;
  sharedMaterial.envMapIntensity = montuur.finish==='metal' ? 1.3 : 0.8;
  sharedMaterial.needsUpdate = true;
  glassesGroup = buildGlassesGroup(montuur, pootje, sharedMaterial, lensMaterial);
  scene.add(glassesGroup);

  // size/position the shadow disc to the actual frame width so it reads as
  // one footprint under the glasses rather than a fixed decal
  const footprintW = HINGE.x*2*0.78;
  shadowMesh.scale.set(footprintW, footprintW*0.4, 1);
  shadowMesh.position.set(0, contourBounds(montuur.lensContour).minY - 7, -TEMPLE_LENGTH_MM*0.1);
}

function resizeRenderer(){
  const rect = canvas3d.getBoundingClientRect();
  const w = Math.max(1, Math.round(rect.width)), h = Math.max(1, Math.round(rect.height));
  renderer.setSize(w, h, false);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resizeRenderer).observe(canvas3d);
resizeRenderer();

(function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
})();

/* ---------- Voor / Zij / Vrij camera presets ---------- */
const dragHint = document.getElementById('dragHint');
function setAngleButton(name){
  document.querySelectorAll('#angleToggle button').forEach(b=>b.classList.toggle('active', b.dataset.angle===name));
}
function setView(name){
  state.angle = name;
  setAngleButton(name);
  if(name==='vrij') return;
  const dist = camera.position.distanceTo(controls.target) || BASE_DIST;
  const theta = name==='voor' ? 0 : Math.PI/2; // azimuth: 0=front, 90°=true side
  const spherical = new THREE.Spherical(dist, Math.PI/2, theta);
  camera.position.setFromSpherical(spherical).add(controls.target);
  controls.update();
}
document.getElementById('angleToggle').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-angle]'); if(!btn) return;
  setView(btn.dataset.angle);
});
controls.addEventListener('start', ()=>{
  setAngleButton('vrij'); state.angle = 'vrij';
  dragHint.classList.add('faded');
});

/* ---------- zoom slider (mirrors scroll/pinch zoom via camera distance) ---------- */
const zoomRangeEl = document.getElementById('zoomRange');
let syncingZoom = false;
zoomRangeEl.addEventListener('input', ()=>{
  const v = Number(zoomRangeEl.value);
  const dist = THREE.MathUtils.clamp(BASE_DIST*100/v, controls.minDistance, controls.maxDistance);
  const dir = camera.position.clone().sub(controls.target).normalize();
  syncingZoom = true;
  camera.position.copy(controls.target).addScaledVector(dir, dist);
  controls.update();
  syncingZoom = false;
});
controls.addEventListener('change', ()=>{
  if(syncingZoom) return;
  const dist = camera.position.distanceTo(controls.target);
  zoomRangeEl.value = THREE.MathUtils.clamp(Math.round(BASE_DIST*100/dist), 60, 180);
});

/* ---------- price + ref code + scene rebuild ---------- */
function refresh(){
  const total = MONTUREN.find(m=>m.id===state.montuur).price
              + POOTJES.find(p=>p.id===state.pootje).price
              + getMateriaal(state.materiaal).price;
  document.getElementById('totalPrice').textContent = '€' + total;

  const matCode = state.materiaal.slice(0,2).toUpperCase();
  document.getElementById('refCode').textContent = `Ref EW-${state.montuur}${state.pootje}-${matCode}VR00`;

  rebuildGlasses();
  const bgVar = state.light === 'studio' ? '--stage-studio' : state.light === 'daylight' ? '--stage-daylight' : '--stage-pearl';
  const bg = getComputedStyle(document.documentElement).getPropertyValue(bgVar);
  document.getElementById('previewStage').style.background =
    `linear-gradient(180deg, ${bg}, color-mix(in srgb, ${bg} 70%, var(--olive)))`;

  renderOptions();
  syncLiveColor();
}

/* ---------- small inline icons for the option chips (schematic, not
   photos — these are generic style indicators, not renders of the 3D
   model) ---------- */
function montuurIcon(shape){
  if(shape==='round') return '<svg viewBox="0 0 34 20" width="26" height="16"><g fill="none" stroke="#4a4238" stroke-width="2"><circle cx="9" cy="10" r="8"/><circle cx="25" cy="10" r="8"/><path d="M17 9h0"/></g></svg>';
  return '<svg viewBox="0 0 34 20" width="26" height="16"><g fill="none" stroke="#4a4238" stroke-width="2"><rect x="1" y="2" width="14" height="16" rx="3"/><rect x="19" y="2" width="14" height="16" rx="3"/></g></svg>';
}
function pootjeIcon(style){
  const w = style==='bold' ? 3.4 : 1.6;
  return `<svg viewBox="0 0 34 14" width="26" height="12"><line x1="2" y1="3" x2="30" y2="10" stroke="#4a4238" stroke-width="${w}" stroke-linecap="round"/></svg>`;
}

/* ---------- price + ref code ---------- */
/* ---------- option rows: Montuur / Pootjes / Materiaal, all visible at once ---------- */
function renderRow(listId, items, selectedId, isColor, onPick){
  const list = document.getElementById(listId);
  list.innerHTML = '';
  items.forEach(item=>{
    const chip = document.createElement('div');
    chip.className = 'wheel-chip' + (item.id===selectedId ? ' selected' : '');

    const thumb = document.createElement('div');
    thumb.className = 'wheel-thumb' + (isColor ? ' swatch-dot' : '');
    if(isColor){
      thumb.style.background = item.hex;
    } else if(item.shape){
      thumb.innerHTML = montuurIcon(item.shape);
    } else if(item.style){
      thumb.innerHTML = pootjeIcon(item.style);
    }
    chip.appendChild(thumb);

    const label = document.createElement('div'); label.className='wheel-label'; label.textContent = item.label;
    const price = document.createElement('div'); price.className='wheel-price';
    price.textContent = item.price > 0 ? `+€${item.price}` : 'incl.';
    chip.appendChild(label); chip.appendChild(price);

    chip.onclick = ()=>{ onPick(item.id); refresh(); };
    list.appendChild(chip);
  });
}

function renderOptions(){
  renderRow('montuurRow', MONTUREN, state.montuur, false, id=>{ state.montuur = id; });
  renderRow('pootjesRow', POOTJES, state.pootje, false, id=>{ state.pootje = id; });
  renderRow('materiaalRow', MATERIALEN, state.materiaal, true, id=>{ state.materiaal = id; });
}

/* ---------- light toggle ---------- */
document.getElementById('lightToggle').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-light]'); if(!btn) return;
  state.light = btn.dataset.light;
  document.querySelectorAll('#lightToggle button').forEach(b=>b.classList.toggle('active', b===btn));
  refresh();
});

/* ---------- action buttons ---------- */
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> t.classList.remove('show'), 2200);
}
document.getElementById('resetBtn').addEventListener('click', ()=>{
  state = { montuur:1, pootje:'A', materiaal:'nachtblauw', light:'studio', angle:'voor' };
  document.querySelectorAll('#lightToggle button').forEach(b=>b.classList.toggle('active', b.dataset.light==='studio'));
  document.getElementById('zoomRange').value = 100;
  setView('voor');
  dragHint.classList.remove('faded');
  refresh();
  showToast('Ontwerp gereset');
});
document.getElementById('finishBtn').addEventListener('click', ()=>{
  const m = MONTUREN.find(x=>x.id===state.montuur), p = POOTJES.find(x=>x.id===state.pootje), mat = getMateriaal(state.materiaal);
  showToast(`${m.label} · ${p.label} · ${mat.label} — ${document.getElementById('totalPrice').textContent} bewaard`);
});
const tryonModal = document.getElementById('tryonModal');
function openTryOn(){
  tryonModal.hidden = false;
  if(!running) document.getElementById('startBtn').click();
}
function closeTryOn(){
  tryonModal.hidden = true;
  if(currentStream){ currentStream.getTracks().forEach(t=>t.stop()); currentStream = null; }
  running = false;
  startMsg.style.display = 'flex';
  startMsg.innerHTML = '<div><div>Geef toegang tot je camera om de bril te passen.</div><button id="startBtn">Camera starten</button></div>';
  document.getElementById('startBtn').addEventListener('click', startCamera);
}
document.getElementById('tryOnBtn').addEventListener('click', openTryOn);
document.getElementById('closeTryOn').addEventListener('click', closeTryOn);
tryonModal.addEventListener('click', (e)=>{ if(e.target===tryonModal) closeTryOn(); });

/* ---------- live camera AR (uses configurator's material color) ---------- */
const video = document.getElementById('video');
const liveCanvas = document.getElementById('liveCanvas');
const lctx = liveCanvas.getContext('2d');
const startMsg = document.getElementById('startMsg');
const startBtn = document.getElementById('startBtn');
const snapBtn = document.getElementById('snapBtn');
const snapLink = document.getElementById('snapLink');
const switchCamBtn = document.getElementById('switchCamBtn');

let currentStream = null, facingMode = 'user', faceMesh = null, running = false, lastLandmarks = null, busy = false;

function syncLiveColor(){ /* color read live from state.materiaal at draw time, nothing to precompute */ }

function resizeLiveCanvas(){
  const rect = video.getBoundingClientRect();
  liveCanvas.width = rect.width; liveCanvas.height = rect.height;
}
window.addEventListener('resize', resizeLiveCanvas);

async function startCamera(){
  try{
    if(currentStream){ currentStream.getTracks().forEach(t=>t.stop()); }
    currentStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode, width:{ideal:640}, height:{ideal:480} }, audio:false });
    video.srcObject = currentStream;
    await video.play();
    resizeLiveCanvas();
    startMsg.style.display = 'none';
    if(!faceMesh) initFaceMesh();
    if(!running){ running = true; requestAnimationFrame(loop); }
  }catch(err){
    startMsg.innerHTML = '<div>Kon geen toegang krijgen tot de camera.<br><span style="opacity:.8;font-size:.8em;">'+ (err.message||err) +'</span></div>';
    startMsg.style.display = 'flex';
  }
}
startBtn.addEventListener('click', startCamera);
switchCamBtn.addEventListener('click', ()=>{
  facingMode = facingMode==='user' ? 'environment' : 'user';
  video.style.transform = facingMode==='user' ? 'scaleX(-1)' : 'none';
  startCamera();
});

function initFaceMesh(){
  faceMesh = new FaceMesh({ locateFile:(f)=> `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}` });
  faceMesh.setOptions({ maxNumFaces:1, refineLandmarks:true, minDetectionConfidence:0.6, minTrackingConfidence:0.6 });
  faceMesh.onResults(res=>{ lastLandmarks = (res.multiFaceLandmarks && res.multiFaceLandmarks[0]) || null; });
}

async function loop(){
  if(!running) return;
  if(video.readyState >= 2 && faceMesh && !busy){
    busy = true;
    try{ await faceMesh.send({ image: video }); } catch(e){}
    busy = false;
  }
  drawLive();
  requestAnimationFrame(loop);
}

function drawLive(){
  const w = liveCanvas.width, h = liveCanvas.height;
  lctx.clearRect(0,0,w,h);
  if(!lastLandmarks) return;
  const toXY = (idx)=>{ const p = lastLandmarks[idx]; return { x: p.x*w, y: p.y*h }; };
  const leftOuter = toXY(33), rightOuter = toXY(263);
  const mirrored = facingMode === 'user';
  const mx = (x)=> mirrored ? (w-x) : x;
  const p1 = { x: mx(leftOuter.x), y: leftOuter.y };
  const p2 = { x: mx(rightOuter.x), y: rightOuter.y };
  const dx = p2.x-p1.x, dy = p2.y-p1.y;
  const eyeDist = Math.hypot(dx,dy);
  const angle = Math.atan2(dy,dx);
  const cx = (p1.x+p2.x)/2, cy = (p1.y+p2.y)/2 + eyeDist*0.03;
  lctx.save(); lctx.translate(cx,cy); lctx.rotate(angle); lctx.translate(-cx,-cy);
  drawGlassesFront(lctx, cx, cy, eyeDist/100, getMateriaal(state.materiaal).hex);
  lctx.restore();
}

snapBtn.addEventListener('click', ()=>{
  const out = document.createElement('canvas');
  out.width = liveCanvas.width; out.height = liveCanvas.height;
  const octx = out.getContext('2d');
  octx.save();
  if(facingMode==='user'){ octx.translate(out.width,0); octx.scale(-1,1); }
  octx.drawImage(video, 0, 0, out.width, out.height);
  octx.restore();
  octx.drawImage(liveCanvas, 0, 0);
  snapLink.href = out.toDataURL('image/png');
  snapLink.click();
});

refresh();
</script>
