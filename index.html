<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>EveryWear</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdfbf7; --surface:#ffffff; --ink:#4a4238; --muted:#948a7a; --line:rgba(74,66,56,.10);
    --accent:#d97c4f; --accent-strong:#c1663b; --olive:#8a9878; --navy:#7192a3; --ochre:#e0b46a;
    --stage-studio:#f1eee6; --stage-daylight:#fdf7ea; --stage-pearl:#faf3f0;
    --f-display:'Fraunces', Georgia, serif;
    --f-body:'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  *{box-sizing:border-box;}
  html, body{ height:100%; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--f-body); display:flex; flex-direction:column; overflow:hidden; }
  img{max-width:100%;}
  a{ color:inherit; }
  [hidden]{ display:none !important; }
  .shell{ max-width:1520px; margin:0 auto; padding-inline:1.6rem; width:100%; }
  button{ font-family:inherit; }

  nav.top{ flex:none; z-index:20; background:var(--bg); border-bottom:1px solid var(--line); }
  nav.top .shell{ display:flex; align-items:center; justify-content:space-between; padding-block:.7rem; gap:1rem; flex-wrap:wrap; }
  .brand-block{ display:flex; align-items:center; gap:.6rem; }
  .brand-icon{
    width:38px; height:38px; border-radius:50%; background:var(--olive); color:#fff;
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .brand-icon svg{ width:19px; height:19px; }
  .brand-name{ font-family:var(--f-display); font-weight:700; font-size:1.1rem; line-height:1.15; }
  .brand-sub{ font-size:.66rem; font-weight:700; letter-spacing:.08em; color:var(--muted); text-transform:uppercase; }

  .nav-right{ display:flex; align-items:center; gap:1.3rem; flex-wrap:wrap; }
  .meta-block{ text-align:right; line-height:1.2; }
  .meta-label{ font-size:.62rem; font-weight:700; letter-spacing:.08em; color:var(--muted); text-transform:uppercase; }
  .meta-value{ font-family:ui-monospace,monospace; font-size:.78rem; color:var(--ink); }
  .meta-value.total{ font-family:var(--f-display); font-weight:700; font-size:1.15rem; }

  .btn-outline, .btn-solid{
    font-family:var(--f-body); font-size:.72rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    padding:.6rem 1.1rem; border-radius:999px; cursor:pointer; white-space:nowrap;
    display:inline-flex; align-items:center; gap:.4rem;
  }
  .btn-outline{ border:1px solid var(--line); background:transparent; color:var(--ink); }
  .btn-outline:hover{ border-color:var(--accent); color:var(--accent); }
  .btn-solid{ border:1px solid var(--olive); background:var(--olive); color:#fff; }
  .btn-solid:hover{ background:#73815f; }

  main{ flex:1; min-height:0; display:flex; flex-direction:column; }

  /* ---- Frame Studio configurator: fills the remaining viewport, no page scroll ---- */
  .studio{ flex:1; min-height:0; display:flex; flex-direction:column; gap:.7rem; padding-block:.8rem; }

  /* -- option rows: Montuur / Pootjes / Materiaal always visible, stacked -- */
  .option-rows{ flex:none; display:flex; flex-direction:column; gap:.5rem; }
  .option-row{
    display:flex; align-items:center; gap:1rem; background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:.55rem .8rem;
  }
  .option-row-label{
    flex:none; width:70px; font-size:.68rem; font-weight:700; letter-spacing:.07em; color:var(--muted); text-transform:uppercase;
  }
  .wheel-row{ flex:1; min-width:0; display:flex; align-items:center; gap:.6rem; overflow-x:auto; scroll-snap-type:x proximity; padding:.15rem; }
  .wheel-chip{
    flex:none; scroll-snap-align:start; display:flex; align-items:center; gap:.55rem; cursor:pointer;
    padding:.4rem .8rem .4rem .4rem; border-radius:999px; border:1px solid var(--line); background:var(--bg);
    transition:border-color .15s, background .15s;
  }
  .wheel-chip:hover{ border-color:var(--accent); }
  .wheel-chip.selected{ border-color:var(--olive); background:color-mix(in srgb, var(--olive) 10%, var(--bg)); }
  .wheel-chip .wheel-thumb{
    width:34px; height:34px; border-radius:50%; background:#fff; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; overflow:hidden; flex:none;
  }
  .wheel-chip .wheel-thumb img{ width:100%; height:100%; object-fit:contain; }
  .wheel-chip .wheel-thumb.swatch-dot{ border-radius:50%; }
  .wheel-chip .wheel-label{ font-size:.78rem; font-weight:600; color:var(--ink); white-space:nowrap; }
  .wheel-chip .wheel-price{ font-size:.68rem; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }

  /* -- preview stage -- */
  .stage-card{
    position:relative; background:linear-gradient(180deg, var(--stage-studio), color-mix(in srgb, var(--stage-studio) 70%, var(--olive)));
    border:1px solid var(--line); border-radius:20px; overflow:hidden; flex:1; min-height:0;
    transition:background .25s;
  }
  .stage-mountains{ position:absolute; left:0; right:0; bottom:0; height:38%; opacity:.5; pointer-events:none; }
  .stage-3d{ position:absolute; inset:0; }
  .stage-3d canvas{ width:100%; height:100%; display:block; cursor:grab; touch-action:none; }
  .stage-3d canvas:active{ cursor:grabbing; }
  .drag-hint{
    position:absolute; top:.9rem; left:50%; transform:translateX(-50%); z-index:2;
    font-size:.68rem; font-weight:600; letter-spacing:.04em; color:var(--muted);
    background:color-mix(in srgb, var(--surface) 80%, transparent); padding:.3rem .7rem; border-radius:999px;
    pointer-events:none; transition:opacity .3s; opacity:.9;
  }
  .drag-hint.faded{ opacity:0; }

  .stage-controls{
    position:absolute; left:50%; bottom:1.1rem; transform:translateX(-50%); z-index:3;
    display:flex; align-items:center; gap:.9rem; background:color-mix(in srgb, var(--surface) 88%, transparent);
    border:1px solid var(--line); border-radius:999px; padding:.4rem .6rem .4rem 1rem; backdrop-filter:blur(6px);
  }
  .zoom-group{ display:flex; align-items:center; gap:.55rem; color:var(--muted); }
  .zoom-group svg{ flex:none; width:16px; height:16px; stroke:var(--muted); }
  .zoom-group input[type=range]{ width:110px; accent-color:var(--olive); cursor:pointer; }
  .pill-group{ display:inline-flex; background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:.2rem; gap:.15rem; }
  .pill-group button{ border:none; background:transparent; padding:.4rem .85rem; border-radius:999px; font-size:.72rem; font-weight:700; letter-spacing:.03em; text-transform:uppercase; cursor:pointer; color:var(--muted); }
  .pill-group button.active{ background:var(--olive); color:#fff; }

  /* ---- live try-on modal ---- */
  .tryon-modal{
    position:fixed; inset:0; z-index:40; background:color-mix(in srgb, var(--ink) 45%, transparent);
    display:flex; align-items:center; justify-content:center; padding:1.2rem;
  }
  .tryon-panel{ background:var(--surface); border-radius:18px; padding:1.3rem; width:100%; max-width:560px; max-height:92vh; overflow-y:auto; }
  .tryon-panel-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:.9rem; }
  .tryon-panel-head h2{ font-family:var(--f-display); font-weight:700; font-size:1.2rem; margin:0; }
  .close-btn{ border:none; background:var(--bg); width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:.9rem; color:var(--ink); }
  .live-stage{ position:relative; width:100%; background:#000; border:1px solid var(--line); border-radius:16px; overflow:hidden; aspect-ratio:4/3; }
  video, canvas#liveCanvas{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  video{ transform:scaleX(-1); }
  .overlay-msg{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; color:#fff; background:rgba(0,0,0,.55); font-size:.9rem; padding:1.5rem; line-height:1.5; }
  .overlay-msg button{ margin-top:.8rem; padding:.6rem 1.2rem; border-radius:999px; border:none; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; font-size:.85rem; }
  .controls-row{ display:flex; gap:.7rem; flex-wrap:wrap; margin-top:.9rem; }
  .controls-row button{ flex:1; min-width:130px; padding:.65rem 1rem; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-weight:700; font-size:.85rem; cursor:pointer; }
  .controls-row button.primary{ background:var(--accent); color:#fff; border-color:transparent; }
  a#snapLink{ display:none; }

  .toast{
    position:fixed; left:50%; bottom:1.4rem; transform:translateX(-50%) translateY(120%);
    background:var(--ink); color:var(--bg); padding:.75rem 1.2rem; border-radius:999px; font-size:.85rem; font-weight:600;
    transition:transform .25s ease; z-index:50; white-space:nowrap;
  }
  .toast.show{ transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<nav class="top">
  <div class="shell">
    <div class="brand-block">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20l6-11 4 7 3-5 5 9z"/></svg>
      </div>
      <div>
        <div class="brand-name">EveryWear</div>
        <div class="brand-sub">Frame Studio · Natuur &amp; Avontuur</div>
      </div>
    </div>
    <div class="nav-right">
      <div class="meta-block">
        <div class="meta-label">Ref</div>
        <div class="meta-value" id="refCode">EW-1A-NBCL00</div>
      </div>
      <div class="meta-block">
        <div class="meta-label">Total</div>
        <div class="meta-value total" id="totalPrice">€55</div>
      </div>
      <button class="btn-outline" id="tryOnBtn" type="button">Probeer Op</button>
      <button class="btn-outline" id="resetBtn" type="button">Reset</button>
      <button class="btn-solid" id="finishBtn" type="button">Finish Design</button>
    </div>
  </div>
</nav>

<main>
  <div class="studio shell">
    <div class="option-rows">
      <div class="option-row">
        <div class="option-row-label">Montuur</div>
        <div class="wheel-row" id="montuurRow"></div>
      </div>
      <div class="option-row">
        <div class="option-row-label">Pootjes</div>
        <div class="wheel-row" id="pootjesRow"></div>
      </div>
      <div class="option-row">
        <div class="option-row-label">Materiaal</div>
        <div class="wheel-row" id="materiaalRow"></div>
      </div>
    </div>

    <div class="stage-card" id="previewStage">
      <div class="stage-3d" id="stage3d">
        <canvas id="previewCanvas3d"></canvas>
        <span class="drag-hint" id="dragHint">Sleep om te draaien · scroll om te zoomen</span>
      </div>
      <div class="stage-controls">
        <div class="pill-group" id="angleToggle">
          <button data-angle="voor" class="active">Voor</button>
          <button data-angle="zij">Zij</button>
          <button data-angle="vrij">Vrij</button>
        </div>
        <div class="zoom-group">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="range" id="zoomRange" min="60" max="180" value="100" aria-label="Zoom">
        </div>
        <div class="pill-group" id="lightToggle">
          <button data-light="studio" class="active">Studio</button>
          <button data-light="daylight">Daylight</button>
          <button data-light="pearl">Pearl</button>
        </div>
      </div>
    </div>
  </div>
</main>

<div class="tryon-modal" id="tryonModal" hidden>
  <div class="tryon-panel">
    <div class="tryon-panel-head">
      <h2>Probeer je ontwerp op</h2>
      <button class="close-btn" id="closeTryOn" aria-label="Sluiten">✕</button>
    </div>
    <div class="live-stage" id="stage">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="liveCanvas"></canvas>
      <div class="overlay-msg" id="startMsg">
        <div>
          <div>Geef toegang tot je camera om de bril te passen.</div>
          <button id="startBtn">Camera starten</button>
        </div>
      </div>
    </div>
    <div class="controls-row">
      <button class="primary" id="snapBtn">Maak foto</button>
      <button id="switchCamBtn">Wissel camera</button>
    </div>
    <a id="snapLink" download="everywear-pasfoto.png"></a>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">

/* ======================================================================
   MASTER MEASUREMENT + STANDARD HINGE INTERFACE
   1 three.js unit = 1mm. Every montuur exposes ONE hinge point (its
   scharnier) and every pootje is built with its pivot at its own local
   origin, so any montuur can take any pootje: the pootje is simply placed
   at the montuur's hinge point (and mirrored by *position* for the left
   side, never by a negative-scale mesh). HINGE.x is the shared standard:
   every montuur's measured front is calibrated so its hinge lands exactly
   here (see FRONT_HALF_WIDTH_MM). HINGE.y/z are only the fallback for a
   montuur without its own measured hinge height/depth.
   ====================================================================== */
const HINGE = Object.freeze({
  x: 70,   // mm from center-front — the shared technical interface
  y: 6,    // fallback: mm above the lens centre
  z: 1.5,  // fallback: mm relative to the front face
});
// AANGENOMEN calibration anchor (no ruler in any video): the measured front
// silhouette's outer half-width is set to HINGE.x + 1.5 mm, i.e. the
// pivot sits 1.5 mm inside the end piece. Every other front dimension is a
// measured proportion of this. REAL_WORLD_DIMENSIONS replaces it.
const FRONT_HALF_WIDTH_MM = HINGE.x + 1.5;
// Pootjes are no longer calibrated to an assumed length: each pootje's
// arc length (pootje.calibratedLength) is AFGELEID from the multi-view fit
// relative to the front anchor above (perspective-corrected). This
// constant is only a generic reference value (shadow placement).
const TEMPLE_LENGTH_MM = 140;

/* ---------- configuration data ----------
   SOURCE OF TRUTH: the product turntable videos (one bril per video).
   Every montuur + pootje below is reconstructed from those videos by
   treating every frame as a different projection of ONE physical object:

   MULTI-VIEW FIT (analysis-by-synthesis): a pinhole camera model is fitted
   per video (focal length, distance, elevation, rotation axis, per-frame
   rotation). The
   3D model is projected into 18 (turntable) / 5 (moving camera) frames
   from front, 3/4, side, back and the other 3/4 views, and its silhouette
   is compared with the video's frame-material silhouette. Wrap amount +
   profile, front thickness, hinge height/depth, the pootje's outward/
   inward path, length, tip drop and height scale are optimised so the
   model matches ALL views at once. With that camera, the front outline
   and lens shape are then un-projected onto the curved front (perspective
   corrected) and the pootje centre line + height profile are un-projected
   from the side view onto the pootje's own plane. Fit → re-measure → fit
   was repeated until the parameters stopped changing (pootje length
   factor 1.00 ± 0.02, hinge offset < 3 mm).

   Original per-view measurements:

     vooraanzicht (frame 1 / 211)
       → plateOuter / plateHoles: the complete front silhouette — rims,
         bridge, nose cut-outs, end pieces — as ONE measured outline with
         its lens openings, segmented from the white studio background
         (frame material vs. lens glass vs. background by luminance +
         saturation), then left/right averaged about the measured symmetry
         axis (symmetry IoU 0.94–0.99 before averaging).
       → lensContour: the measured lens outline (right lens, +x).
     zijaanzicht (frame 61 / 68 / 151)
       → curvePoints: the pootje's measured centre line, hinge → tip,
         tracked column by column (top + bottom edge) and smoothed.
       → heightProfile: the pootje's measured vertical size along its
         length (slope-corrected), sampled at the same 48 points.
       → segments: measured material transitions along the pootje
         (colour / saturation change point), with the measured colour.
       → frontThickness, wrapSag + wrapExp (how far / how the front sweeps
         back toward the hinges), hingeY: AFGELEID from the
         multi-view fit (all views at once), not from a single view.
     achteraanzicht / 3/4-aanzichten
       → used to check symmetry, the lens openings and the perspective
         (front/back lens-width ratio 1.33–1.38: these videos have strong
         perspective, which is why absolute lengths are NOT taken from a
         single view but anchored, see above).

   Not reliably recoverable from the videos, kept as minimal physical
   assumptions (AANGENOMEN, see getMontuurProvenance/getPootjeProvenance):
   the pootje cross-section shape (super-ellipse; metal rounder than
   acetate) and lateral thickness, the edge bevel radius, nose pads (not
   modelled) and the absolute scale (one anchor, FRONT_HALF_WIDTH_MM).
   Logos, wordmarks and brand emblems visible in the videos are
   deliberately NOT reproduced. */

// bbox of a flat [x,y] point list
function contourBounds(points){
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for(const [x,y] of points){
    if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y;
  }
  return { minX,maxX,minY,maxY, w:maxX-minX, h:maxY-minY };
}
function frontBounds(montuur){ return contourBounds(montuur.plateOuter.flat()); }

/* ======================================================================
   SHAPE → SCALE: the measured shapes are never edited to "look right",
   only multiplied by a factor from a real caliper measurement once
   REAL_WORLD_DIMENSIONS is filled in. Every build function consumes
   scaledMontuur()/scaledPootje(), never the raw entries.
   ====================================================================== */
function montuurScaleFactors(montuur){
  const rwd = montuur.REAL_WORLD_DIMENSIONS || {};
  const front = frontBounds(montuur), lens = contourBounds(montuur.lensContour);
  let sx = 1, sy = 1, measured = false;
  if(rwd.frameWidth){ sx = rwd.frameWidth / front.w; measured = true; }
  else if(rwd.lensWidth){ sx = rwd.lensWidth / lens.w; measured = true; }
  if(rwd.frameHeight){ sy = rwd.frameHeight / front.h; measured = true; }
  else if(rwd.lensHeight){ sy = rwd.lensHeight / lens.h; measured = true; }
  if(measured && !(rwd.frameHeight || rwd.lensHeight)) sy = sx;
  if(measured && !(rwd.frameWidth || rwd.lensWidth)) sx = sy;
  if(!measured){
    console.warn(`[${montuur.label}] No REAL_WORLD_DIMENSIONS measured yet — rendering at the video's ASSUMED calibration (${front.w.toFixed(1)}×${front.h.toFixed(1)}mm front), not a verified physical measurement.`);
  }
  // cross-check: bridge width (distance between the lenses) after scaling
  if(rwd.bridgeWidth){
    const dbl = 2 * Math.min(...montuur.lensContour.map(p => p[0])) * sx;
    if(Math.abs(dbl - rwd.bridgeWidth) / rwd.bridgeWidth > 0.05)
      console.warn(`[${montuur.label}] bridge ${dbl.toFixed(1)}mm vs REAL_WORLD_DIMENSIONS.bridgeWidth ${rwd.bridgeWidth}mm (>5% off)`);
  }
  return { sx, sy, measured };
}
// hinge depth: the pootje pivot sits just behind the swept-back end piece
function wrapZ(montuur, x){
  const u = Math.min(1, Math.abs(x) / montuur.frontHalfWidth), p = montuur.wrapExp ?? 3;
  return -montuur.wrapSag * Math.pow(u, p);
}
function wrapSlope(montuur, x){
  const u = Math.min(1, Math.abs(x) / montuur.frontHalfWidth), p = montuur.wrapExp ?? 3;
  if(u >= 1) return 0;
  return -p * montuur.wrapSag * Math.pow(u, p-1) * Math.sign(x) / montuur.frontHalfWidth;
}
function scaledMontuur(montuur){
  const { sx, sy } = montuurScaleFactors(montuur);

  const m = {
    ...montuur,
    plateOuter: montuur.plateOuter.map(S),
    plateHoles: montuur.plateHoles.map(S),
    lensContour: S(montuur.lensContour),
    frontThickness: montuur.frontThickness * sAvg,
    wrapSag: montuur.wrapSag * sAvg,
    frontHalfWidth: (montuur.frontHalfWidthMm ?? FRONT_HALF_WIDTH_MM) * sx,
  };
  const hx = (montuur.hingeX ?? HINGE.x) * sx;
  // pivot exactly at the back face of the end piece, 0.5 mm into it, for
  // EVERY montuur — so any pootje meets any montuur without a gap
  m.hinge = { x: hx, y: (montuur.hingeY ?? HINGE.y) * sy, z: wrapZ(m, hx) - m.frontThickness + 0.5 };

}
function pootjeScaleFactor(pootje){

  console.warn(`[${pootje.label}] No REAL_WORLD_DIMENSIONS.templeLength measured yet — rendering at the video-derived ${pootje.calibratedLength}mm arc length (relative to the ASSUMED front anchor), not a verified physical measurement.`);

}
function scaledPootje(pootje){
  const s = pootjeScaleFactor(pootje);

    curvePoints: pootje.curvePoints.map(([z,y]) => [z*s, y*s]),
    heightProfile: pootje.heightProfile.map(h => h*s),
    flare: pootje.flare * s, flare2: (pootje.flare2 || 0) * s };
}

const MATERIALEN = [
  { id:'parelwit',   label:'Parelwit',   price:10, hex:'#F2EEE6' },
  { id:'transparant',label:'Transparant',price:10, hex:'#E4E2D9' },
  { id:'perzik',     label:'Perzik',     price:10, hex:'#F0B18A' },
  { id:'luchtblauw', label:'Luchtblauw', price:10, hex:'#A9CBDF' },
  { id:'antraciet',  label:'Antraciet',  price:10, hex:'#3A3A3A' },
  { id:'bosgroen',   label:'Bosgroen',   price:10, hex:'#33503A' },
  { id:'nachtblauw', label:'Nachtblauw', price:10, hex:'#16283D' },
];
function getMateriaal(id){ return MATERIALEN.find(m=>m.id===id); }

let state = {
  montuur: 1,
  pootje: 'A',
  // default to each montuur's own measured photo colour, not an arbitrary
  // palette pick, so the page's first render is the real product's own
  // colour — getMontuur(1).defaultMateriaal below ('antraciet' for Accra).
  materiaal: getMontuur(1).defaultMateriaal,
  light: 'studio',
  angle: 'voor',
};

/* ======================================================================
   SELECTED CONFIGURATION — the single source of truth for "which bril".
   `state` holds only the user's picks (ids); this resolves them into one
   frozen object. The configurator's 3D model AND the AR try-on are both
   built from this — AR never decides on its own which bril to load, and
   there is no separate/default/placeholder AR bril anywhere.
   ====================================================================== */
function getSelectedConfiguration(){
  const frame = getMontuur(state.montuur);
  const temple = getPootje(state.pootje);
  const material = getMateriaal(state.materiaal);
  if(!frame || !temple || !material){
    throw new Error(`Ongeldige configuratie: montuur=${state.montuur} pootje=${state.pootje} materiaal=${state.materiaal}`);
  }
  return Object.freeze({
    key: `${frame.id}-${temple.id}-${material.id}`,
    frameId: frame.id, frame: frame.label,
    templeId: temple.id, temple: temple.label,
    materialId: material.id, material: material.label, color: material.hex,
  });
}

// The one 3D product model that exists at any time: the configurator
// builds it (rebuildGlasses), AR only ever clones it (sharing the very same
// geometry buffers + material instances, see syncARModel).
let productModel = null; // { configuration, group }

/* ======================================================================
   3D GEOMETRY — built in real millimeters from the measured data above.
   Nothing here is a generic frame: the front is the measured silhouette
   extruded to its measured thickness and swept back by its measured wrap;
   the pootjes follow their measured centre line and height profile.
   ====================================================================== */
function shapeFromContour(points){
  const s = new THREE.Shape();
  points.forEach(([x,y], i) => { if(i===0) s.moveTo(x,y); else s.lineTo(x,y); });
  s.closePath();
  return s;
}
function pathFromContour(points){
  const p = new THREE.Path();
  points.forEach(([x,y], i) => { if(i===0) p.moveTo(x,y); else p.lineTo(x,y); });
  p.closePath();
  return p;
}
function signedArea(points){
  let a=0; for(let i=0;i<points.length;i++){ const [x1,y1]=points[i], [x2,y2]=points[(i+1)%points.length]; a+=x1*y2-x2*y1; } return a/2;
}
function ccw(points){ return signedArea(points) >= 0 ? points : points.slice().reverse(); }
function cw(points){ return signedArea(points) < 0 ? points : points.slice().reverse(); }

// split every triangle of a non-indexed geometry until no edge is longer
// than maxEdge — needed so the front's wrap (a smooth bend in z) is
// carried by enough vertices instead of a few long triangles.
function subdivideNonIndexed(geo, maxEdge){
  const names = Object.keys(geo.attributes);
  const src = names.map(n => geo.attributes[n]);
  const out = names.map(() => []);
  const P = geo.attributes.position;
  const tri = [];
  for(let i=0;i<P.count;i+=3){
    tri.push([0,1,2].map(k => src.map(a => Array.from({length:a.itemSize}, (_,c)=>a.array[(i+k)*a.itemSize+c]))));
  }
  const mid = (A,B) => A.map((attr,ai) => attr.map((v,c) => (v + B[ai][c]) / 2));
  const len = (A,B) => Math.hypot(A[0][0]-B[0][0], A[0][1]-B[0][1], A[0][2]-B[0][2]);
  while(tri.length){
    const t = tri.pop();
    const e = [len(t[0],t[1]), len(t[1],t[2]), len(t[2],t[0])];
    const m = e.indexOf(Math.max(...e));
    if(e[m] <= maxEdge){ t.forEach(v => v.forEach((attr,ai) => out[ai].push(...attr))); continue; }
    const a = t[m], b = t[(m+1)%3], c = t[(m+2)%3], ab = mid(a,b);
    tri.push([a,ab,c],[ab,b,c]);
  }
  const g = new THREE.BufferGeometry();
  names.forEach((n,i) => g.setAttribute(n, new THREE.Float32BufferAttribute(out[i], src[i].itemSize)));
  return g;
}
// sweep the front back toward the hinges: z += wrapZ(x). Normals follow
// the same deformation exactly (n' = (nx − g'(x)·nz, ny, nz)).
function applyWrap(geo, montuur){
  const P = geo.attributes.position, N = geo.attributes.normal;
  for(let i=0;i<P.count;i++){
    const x = P.getX(i);
    P.setZ(i, P.getZ(i) + wrapZ(montuur, x));
    if(N){
      const g = wrapSlope(montuur, x);
      const nx = N.getX(i) - g*N.getZ(i), ny = N.getY(i), nz = N.getZ(i);
      const l = Math.hypot(nx,ny,nz) || 1;
      N.setXYZ(i, nx/l, ny/l, nz/l);
    }
  }
  P.needsUpdate = true; if(N) N.needsUpdate = true;
  return geo;
}

// the complete front (rims + bridge + end pieces) as ONE measured outline
// with its measured lens openings, extruded to the measured thickness.
// Front face at z=0, back face at z=−frontThickness, then wrapped.
function buildFrontGeometry(montuur){
  const t = montuur.frontThickness;
  const metal = montuur.finish === 'metal';
  const bevelSize = metal ? 0.3 : 0.55, bevelThickness = Math.min(t*0.3, metal ? 0.35 : 0.7);
  const outers = montuur.plateOuter.map(ccw);
  const shapes = outers.map(o => shapeFromContour(o));
  // every hole goes into the outline that contains it (the largest one)
  const main = shapes[outers.map(o=>Math.abs(signedArea(o))).reduce((bi,a,i,arr)=>a>arr[bi]?i:bi,0)];
  montuur.plateHoles.forEach(h => main.holes.push(pathFromContour(cw(h))));
  const depth = Math.max(0.2, t - 2*bevelThickness);
  let geo = new THREE.ExtrudeGeometry(shapes, {
    depth, bevelEnabled:true, bevelThickness, bevelSize, bevelOffset:-bevelSize, bevelSegments:3, curveSegments:1,
  });
  geo.translate(0, 0, -(depth + bevelThickness));
  geo = subdivideNonIndexed(geo, 3);
  return applyWrap(geo, montuur);
}
// lens glass = the measured lens outline; the left lens is the mirrored
// contour (mirrored geometry, not a negative-scale mesh)
function buildLensGeometry(montuur, side){
  const pts = side === 1 ? montuur.lensContour : montuur.lensContour.map(([x,y]) => [-x,y]);
  let geo = new THREE.ExtrudeGeometry(shapeFromContour(ccw(pts)), { depth:1.2, bevelEnabled:false, curveSegments:1 });
  geo.translate(0, 0, -montuur.frontThickness/2 - 0.6);
  geo = subdivideNonIndexed(geo, 3);
  return applyWrap(geo, montuur);
}

// pootje: a tube along the measured centre line whose vertical size is the
// measured heightProfile. Lateral thickness / cross-section are the
// AANGENOMEN parts (see getPootjeProvenance). Built directly mirrored by
// `side` (1 = right, −1 = left). Returns one geometry per material segment
// ({ geo, seg }) — seg = null means "follows the chosen materiaal".
function lateralWidth(h, finish){
  return finish === 'metal' ? THREE.MathUtils.clamp(0.45*h, 1.0, 2.0) : THREE.MathUtils.clamp(0.55*h, 1.6, 3.8);
}
function segmentAt(pootje, f){ return pootje.segments.find(s => f >= s.from && f <= s.to) || null; }
function buildTempleGeometries(pootje, side){
  const n = pootje.curvePoints.length;
  // lateral path (AFGELEID, multi-view fit): x = flare·f + flare2·f² over
  // the arc fraction f (curvePoints are sampled uniformly along the arc)
  const pts = pootje.curvePoints.map(([z,y], i) => { const f = i/(n-1); return new THREE.Vector3(side * (pootje.flare*f + (pootje.flare2||0)*f*f), y, z); });
  const curve = new THREE.CatmullRomCurve3(pts);
  const segments = 120, radial = 20;
  const P = curve.getSpacedPoints(segments);
  const arcLen = curve.getLength();
  const hAt = f => { const x = f*(n-1), i = Math.min(n-2, Math.floor(x)); return THREE.MathUtils.lerp(pootje.heightProfile[i], pootje.heightProfile[i+1], x-i); };
  const xHat = new THREE.Vector3(1,0,0);
  const rings = P.map((p, i) => {
    const f = i/segments;
    const T = curve.getTangentAt(Math.min(f, 0.9999)).normalize();
    const L = xHat.clone().addScaledVector(T, -T.dot(xHat)).normalize();
    const V = new THREE.Vector3().crossVectors(L, T).normalize();
    const seg = segmentAt(pootje, f);
    const finish = seg ? seg.finish : pootje.mainFinish;
    const h = hAt(f), w = lateralWidth(h, finish) * (pootje.widthScale || 1); // widthScale: AFGELEID (multi-view fit, back + 3/4 views)
    const e = finish === 'metal' ? 2.0 : 3.2; // super-ellipse exponent (AANGENOMEN)
    return { p, L, V, rx:w/2, ry:h/2, e, f };
  });
  // segment boundaries in ring indices
  const cuts = new Set([0, segments]);
  pootje.segments.forEach(s => { cuts.add(Math.round(s.from*segments)); cuts.add(Math.round(s.to*segments)); });
  const bounds = [...cuts].filter(i => i>=0 && i<=segments).sort((a,b)=>a-b);
  const out = [];
  for(let b=0;b<bounds.length-1;b++){
    const i0 = bounds[b], i1 = bounds[b+1];
    if(i1 <= i0) continue;
    const pos = [], uv = [], idx = [];
    for(let i=i0;i<=i1;i++){
      const r = rings[i];
      for(let j=0;j<=radial;j++){
        const a = j/radial * Math.PI*2, c = Math.cos(a), s = Math.sin(a);
        const cx = Math.sign(c)*Math.pow(Math.abs(c), 2/r.e), sy = Math.sign(s)*Math.pow(Math.abs(s), 2/r.e);
        const v = r.p.clone().addScaledVector(r.L, side*r.rx*cx).addScaledVector(r.V, r.ry*sy);
        pos.push(v.x, v.y, v.z);
        uv.push(r.f*arcLen, j/radial*Math.PI*(r.rx+r.ry)); // mm, so textures keep their measured size
      }
    }
    const rowLen = radial+1;
    for(let i=0;i<i1-i0;i++) for(let j=0;j<radial;j++){
      const a = i*rowLen+j, bb = (i+1)*rowLen+j, c = (i+1)*rowLen+j+1, d = i*rowLen+j+1;
      if(side===1){ idx.push(a,bb,d, bb,c,d); } else { idx.push(a,d,bb, bb,d,c); }
    }
    if(i0 === 0){ // close the hinge end (it sits inside the end piece, but never leave an open tube)
      const r = rings[0], base = pos.length/3;
      pos.push(r.p.x, r.p.y, r.p.z); uv.push(0, 0);
      for(let j=0;j<radial;j++){ if(side===1) idx.push(j+1, base, j); else idx.push(j, base, j+1); }
    }
    if(i1 === segments){ // close the tip
      const r = rings[segments], base = pos.length/3;
      pos.push(r.p.x, r.p.y, r.p.z); uv.push(r.f*arcLen, 0);
      const last = (i1-i0)*rowLen;
      for(let j=0;j<radial;j++){ if(side===1) idx.push(last+j, base, last+j+1); else idx.push(last+j, last+j+1, base); }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
    g.setIndex(idx); g.computeVertexNormals();
    const fMid = (i0+i1)/2/segments;
    out.push({ geo:g, seg: segmentAt(pootje, fMid) });
  }
  return out;
}

// assemble one full pair: measured front + two lenses + two pootjes,
// combined dynamically (never a pre-made per-combination model). The
// pootjes are placed at THIS montuur's hinge point — the modular interface.
function buildGlassesGroup(montuur, pootje, material, lensMaterial){
  const group = new THREE.Group();
  group.add(new THREE.Mesh(buildFrontGeometry(montuur), material));
  [1,-1].forEach(side=>{
    group.add(new THREE.Mesh(buildLensGeometry(montuur, side), lensMaterial));
    for(const { geo, seg } of buildTempleGeometries(pootje, side)){
      const mesh = new THREE.Mesh(geo, seg ? getFixedMaterial(seg) : material);
      mesh.position.set(side*montuur.hinge.x, montuur.hinge.y, montuur.hinge.z);
      group.add(mesh);
    }
  });
  return group;
}
function disposeGroup(group){
  group.traverse(obj=>{ if(obj.geometry) obj.geometry.dispose(); });
}

/* ======================================================================
   SCENE, CAMERA, LIGHTS, CONTROLS
   ====================================================================== */
const canvas3d = document.getElementById('previewCanvas3d');
const renderer = new THREE.WebGLRenderer({ canvas:canvas3d, antialias:true, alpha:true, preserveDrawingBuffer:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
if('outputColorSpace' in renderer) renderer.outputColorSpace = THREE.SRGBColorSpace;
// filmic tone mapping = the difference between "flat CG preview" and a
// premium product-shot look — it's what keeps the metal highlights and
// the acetate clearcoat from blowing out to solid white.
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 1, 2000);
const BASE_DIST = 230;
camera.position.set(0, 6, BASE_DIST);

// soft, neutral studio reflections (not a visible background — the CSS
// gradient behind the transparent canvas still provides that) so metal
// and acetate finishes get real environment highlights instead of flat
// directional-light dots.
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 120;
controls.maxDistance = 420;
controls.minPolarAngle = Math.PI*0.25;
controls.maxPolarAngle = Math.PI*0.75;
controls.target.set(0,0,0);
controls.update();

// lights are deliberately lighter than before now that scene.environment
// (below) provides realistic ambient/specular fill on its own — stacking
// full-strength directional lights on top of an env map is what causes the
// washed-out, overexposed look PBR renders are prone to.
const hemi = new THREE.HemisphereLight(0xffffff, 0x8a8370, 0.45);
scene.add(hemi);
const keyLight = new THREE.DirectionalLight(0xffffff, 0.65);
keyLight.position.set(120,180,220);
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0xffffff, 0.28);
fillLight.position.set(-150,80,-120);
scene.add(fillLight);
const rimLight = new THREE.DirectionalLight(0xffffff, 0.3);
rimLight.position.set(0,-60,-200);
scene.add(rimLight);

const sharedMaterial = new THREE.MeshPhysicalMaterial({
  color:0x16283D, roughness:0.4, metalness:0.15, clearcoat:0.3, clearcoatRoughness:0.25,
  envMapIntensity:1,
  side: THREE.DoubleSide, // the hinge stub is mirrored via negative scale for the left side,
                           // which flips triangle winding — DoubleSide keeps it visible/lit correctly
});

// the lens glass is always clear optical glass — the materiaal picker colors
// the frame, never the lens — so it gets its own permanent material instead
// of reusing sharedMaterial. `transmission` is real see-through refraction
// (needs scene.environment, already set above, to have anything to refract).
const lensMaterial = new THREE.MeshPhysicalMaterial({
  color:0xffffff, roughness:0.04, transmission:1, ior:1.5, thickness:0.6,
  envMapIntensity:1.1, side: THREE.DoubleSide,
});

// textures are crops of the actual product from the videos (never
// generated). uv coordinates are in mm (ExtrudeGeometry's world uvs, and
// the pootje tube's arc-length uvs), so repeat = 1 / measured patch size
// keeps the pattern at its real physical scale. MirroredRepeatWrapping
// tiles the small crop without a visible seam.
const textureCache = new Map();
function getTexture(path, sizeMm){
  const key = path + '|' + sizeMm.join('x');
  if(!textureCache.has(key)){
    const tex = new THREE.TextureLoader().load(path, t => { t.needsUpdate = true; });
    tex.wrapS = tex.wrapT = THREE.MirroredRepeatWrapping;
    tex.repeat.set(1/sizeMm[0], 1/sizeMm[1]);
    if('colorSpace' in tex) tex.colorSpace = THREE.SRGBColorSpace;
    textureCache.set(key, tex);
  }
  return textureCache.get(key);
}
// fixed pootje segments (a measured physical feature of that pootje, e.g.
// Hanoi's black tip or Accra's gold hinge part) — NOT recoloured by the
// materiaal picker. Cached per spec so rebuilds reuse one instance.
const fixedMaterialCache = new Map();
function getFixedMaterial(seg){
  const key = JSON.stringify(seg);
  if(!fixedMaterialCache.has(key)){
    const metal = seg.finish === 'metal';
    fixedMaterialCache.set(key, new THREE.MeshPhysicalMaterial({
      color: seg.texture ? 0xffffff : seg.hex,
      map: seg.texture ? getTexture(seg.texture, seg.textureMm || [8,4]) : null,
      metalness: metal ? 0.7 : 0.04, roughness: metal ? 0.3 : 0.38,
      clearcoat: metal ? 0.2 : 0.55, clearcoatRoughness: 0.2,
      envMapIntensity: metal ? 1.2 : 0.85, side: THREE.DoubleSide,
    }));
  }
  return fixedMaterialCache.get(key);
}

// soft contact shadow: a transparent disc with a radial-gradient alpha
// texture sitting just under the glasses — the classic cheap-but-effective
// stand-in for real ground shadows, grounds the product instead of letting
// it float against the stage background.
function buildContactShadowTexture(){
  const size = 256;
  const c = document.createElement('canvas'); c.width = c.height = size;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(size/2,size/2,0, size/2,size/2,size/2);
  g.addColorStop(0, 'rgba(0,0,0,0.38)');
  g.addColorStop(0.7, 'rgba(0,0,0,0.14)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,size,size);
  const tex = new THREE.CanvasTexture(c);
  if('colorSpace' in tex) tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const shadowMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(1,1),
  new THREE.MeshBasicMaterial({ map:buildContactShadowTexture(), transparent:true, depthWrite:false }),
);
shadowMesh.rotation.x = -Math.PI/2;
scene.add(shadowMesh);

let glassesGroup = null;
function rebuildGlasses(){
  if(glassesGroup){ scene.remove(glassesGroup); disposeGroup(glassesGroup); }
  const configuration = getSelectedConfiguration();
  const montuurRaw = getMontuur(configuration.frameId);
  const pootjeRaw = getPootje(configuration.templeId);
  // all geometry is built from the SCALED copies (real-world mm, see
  // scaledMontuur/scaledPootje above) — montuurRaw/pootjeRaw are kept
  // around only for non-geometry metadata (finish, label).
  const montuur = scaledMontuur(montuurRaw);
  const pootje = scaledPootje(pootjeRaw);
  const mat = getMateriaal(configuration.materialId);
  const hasTexture = !!mat.texture;
  const isTransparent = mat.id === 'transparant';

  // a textured materiaal (if any) takes its colour
  // from the map — tint it white so the map reads true; every other
  // materiaal is a flat measured colour with no map.
  sharedMaterial.map = hasTexture ? getTexture(mat.texture, mat.textureMm) : null;
  sharedMaterial.color.set(hasTexture ? 0xffffff : mat.hex);
  sharedMaterial.transmission = isTransparent ? 0.85 : 0;
  sharedMaterial.transparent = isTransparent;
  sharedMaterial.thickness = isTransparent ? 1.5 : 0;
  sharedMaterial.roughness = montuur.finish==='metal' ? 0.25 : (isTransparent ? 0.12 : 0.42);
  sharedMaterial.metalness = montuur.finish==='metal' ? 0.65 : 0.04;
  sharedMaterial.clearcoat = montuur.finish==='metal' ? 0.25 : 0.55;
  sharedMaterial.clearcoatRoughness = montuur.finish==='metal' ? 0.15 : 0.22;
  sharedMaterial.envMapIntensity = montuur.finish==='metal' ? 1.3 : 0.8;
  sharedMaterial.needsUpdate = true;
  glassesGroup = buildGlassesGroup(montuur, pootje, sharedMaterial, lensMaterial);
  scene.add(glassesGroup);
  productModel = { configuration, group: glassesGroup };

  // size/position the shadow disc to the actual frame width so it reads as
  // one footprint under the glasses rather than a fixed decal
  const footprintW = HINGE.x*2*0.78;
  shadowMesh.scale.set(footprintW, footprintW*0.4, 1);
  shadowMesh.position.set(0, frontBounds(montuur).minY - 7, -TEMPLE_LENGTH_MM*0.1);
}

function resizeRenderer(){
  const rect = canvas3d.getBoundingClientRect();
  const w = Math.max(1, Math.round(rect.width)), h = Math.max(1, Math.round(rect.height));
  renderer.setSize(w, h, false);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resizeRenderer).observe(canvas3d);
resizeRenderer();

(function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
})();

/* ---------- Voor / Zij / Vrij camera presets ---------- */
const dragHint = document.getElementById('dragHint');
function setAngleButton(name){
  document.querySelectorAll('#angleToggle button').forEach(b=>b.classList.toggle('active', b.dataset.angle===name));
}
function setView(name){
  state.angle = name;
  setAngleButton(name);
  if(name==='vrij') return;
  const dist = camera.position.distanceTo(controls.target) || BASE_DIST;
  const theta = name==='voor' ? 0 : Math.PI/2; // azimuth: 0=front, 90°=true side
  const spherical = new THREE.Spherical(dist, Math.PI/2, theta);
  camera.position.setFromSpherical(spherical).add(controls.target);
  controls.update();
}
document.getElementById('angleToggle').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-angle]'); if(!btn) return;
  setView(btn.dataset.angle);
});
controls.addEventListener('start', ()=>{
  setAngleButton('vrij'); state.angle = 'vrij';
  dragHint.classList.add('faded');
});

/* ---------- zoom slider (mirrors scroll/pinch zoom via camera distance) ---------- */
const zoomRangeEl = document.getElementById('zoomRange');
let syncingZoom = false;
zoomRangeEl.addEventListener('input', ()=>{
  const v = Number(zoomRangeEl.value);
  const dist = THREE.MathUtils.clamp(BASE_DIST*100/v, controls.minDistance, controls.maxDistance);
  const dir = camera.position.clone().sub(controls.target).normalize();
  syncingZoom = true;
  camera.position.copy(controls.target).addScaledVector(dir, dist);
  controls.update();
  syncingZoom = false;
});
controls.addEventListener('change', ()=>{
  if(syncingZoom) return;
  const dist = camera.position.distanceTo(controls.target);
  zoomRangeEl.value = THREE.MathUtils.clamp(Math.round(BASE_DIST*100/dist), 60, 180);
});

/* ---------- price + ref code + scene rebuild ---------- */
function refresh(){
  const total = MONTUREN.find(m=>m.id===state.montuur).price
              + POOTJES.find(p=>p.id===state.pootje).price
              + getMateriaal(state.materiaal).price;
  document.getElementById('totalPrice').textContent = '€' + total;

  const matCode = state.materiaal.slice(0,2).toUpperCase();
  document.getElementById('refCode').textContent = `Ref EW-${state.montuur}${state.pootje}-${matCode}VR00`;

  rebuildGlasses();
  const bgVar = state.light === 'studio' ? '--stage-studio' : state.light === 'daylight' ? '--stage-daylight' : '--stage-pearl';
  const bg = getComputedStyle(document.documentElement).getPropertyValue(bgVar);
  document.getElementById('previewStage').style.background =
    `linear-gradient(180deg, ${bg}, color-mix(in srgb, ${bg} 70%, var(--olive)))`;

  renderOptions();
  // AR always mirrors the configurator's current product model — if the
  // try-on is open while the configuration changes, it follows immediately.
  if(!tryonModal.hidden) syncARModel();
}

/* ---------- small inline icons for the option chips (schematic, not
   photos — these are generic style indicators, not renders of the 3D
   model) ---------- */
function montuurIcon(shape){
  if(shape==='round') return '<svg viewBox="0 0 34 20" width="26" height="16"><g fill="none" stroke="#4a4238" stroke-width="2"><circle cx="9" cy="10" r="8"/><circle cx="25" cy="10" r="8"/><path d="M17 9h0"/></g></svg>';
  return '<svg viewBox="0 0 34 20" width="26" height="16"><g fill="none" stroke="#4a4238" stroke-width="2"><rect x="1" y="2" width="14" height="16" rx="3"/><rect x="19" y="2" width="14" height="16" rx="3"/></g></svg>';
}
function pootjeIcon(style){
  const w = style==='bold' ? 3.4 : 1.6;
  return `<svg viewBox="0 0 34 14" width="26" height="12"><line x1="2" y1="3" x2="30" y2="10" stroke="#4a4238" stroke-width="${w}" stroke-linecap="round"/></svg>`;
}

/* ---------- price + ref code ---------- */
/* ---------- option rows: Montuur / Pootjes / Materiaal, all visible at once ---------- */
function renderRow(listId, items, selectedId, isColor, onPick){
  const list = document.getElementById(listId);
  list.innerHTML = '';
  items.forEach(item=>{
    const chip = document.createElement('div');
    chip.className = 'wheel-chip' + (item.id===selectedId ? ' selected' : '');

    const thumb = document.createElement('div');
    thumb.className = 'wheel-thumb' + (isColor ? ' swatch-dot' : '');
    if(isColor){
      thumb.style.background = item.hex;
    } else if(item.shape){
      thumb.innerHTML = montuurIcon(item.shape);
    } else if(item.style){
      thumb.innerHTML = pootjeIcon(item.style);
    }
    chip.appendChild(thumb);

    const label = document.createElement('div'); label.className='wheel-label'; label.textContent = item.label;
    const price = document.createElement('div'); price.className='wheel-price';
    price.textContent = item.price > 0 ? `+€${item.price}` : 'incl.';
    chip.appendChild(label); chip.appendChild(price);

    chip.onclick = ()=>{ onPick(item.id); refresh(); };
    list.appendChild(chip);
  });
}

function renderOptions(){
  renderRow('montuurRow', MONTUREN, state.montuur, false, id=>{ state.montuur = id; });
  renderRow('pootjesRow', POOTJES, state.pootje, false, id=>{ state.pootje = id; });
  renderRow('materiaalRow', MATERIALEN, state.materiaal, true, id=>{ state.materiaal = id; });
}

/* ---------- light toggle ---------- */
document.getElementById('lightToggle').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-light]'); if(!btn) return;
  state.light = btn.dataset.light;
  document.querySelectorAll('#lightToggle button').forEach(b=>b.classList.toggle('active', b===btn));
  refresh();
});

/* ---------- action buttons ---------- */
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> t.classList.remove('show'), 2200);
}
document.getElementById('resetBtn').addEventListener('click', ()=>{
  state = { montuur:1, pootje:'A', materiaal:'nachtblauw', light:'studio', angle:'voor' };
  document.querySelectorAll('#lightToggle button').forEach(b=>b.classList.toggle('active', b.dataset.light==='studio'));
  document.getElementById('zoomRange').value = 100;
  setView('voor');
  dragHint.classList.remove('faded');
  refresh();
  showToast('Ontwerp gereset');
});
document.getElementById('finishBtn').addEventListener('click', ()=>{
  const m = MONTUREN.find(x=>x.id===state.montuur), p = POOTJES.find(x=>x.id===state.pootje), mat = getMateriaal(state.materiaal);
  showToast(`${m.label} · ${p.label} · ${mat.label} — ${document.getElementById('totalPrice').textContent} bewaard`);
});
const tryonModal = document.getElementById('tryonModal');
function openTryOn(){
  tryonModal.hidden = false;
  syncARModel();
  if(!running) document.getElementById('startBtn').click();
}
function closeTryOn(){
  tryonModal.hidden = true;
  if(currentStream){ currentStream.getTracks().forEach(t=>t.stop()); currentStream = null; }
  running = false;
  startMsg.style.display = 'flex';
  startMsg.innerHTML = '<div><div>Geef toegang tot je camera om de bril te passen.</div><button id="startBtn">Camera starten</button></div>';
  document.getElementById('startBtn').addEventListener('click', startCamera);
}
document.getElementById('tryOnBtn').addEventListener('click', openTryOn);
document.getElementById('closeTryOn').addEventListener('click', closeTryOn);
tryonModal.addEventListener('click', (e)=>{ if(e.target===tryonModal) closeTryOn(); });

/* ======================================================================
   LIVE CAMERA AR — renders the configurator's own 3D product model.
   No 2D sprite, no default/placeholder bril, no simplified AR asset:
   syncARModel() clones productModel.group, and Object3D.clone() keeps the
   exact same BufferGeometry + Material instances (same mm vertex data,
   same montuur + pootjes + materiaal). The model is never rescaled:
   1 unit = 1 mm stays true. Instead the *camera* is fitted to the face —
   pixels-per-mm is measured from the iris (≈11.7 mm, a stable human
   constant), so a 140 mm bril stays 140 mm against the user's real face.
   ====================================================================== */
const video = document.getElementById('video');
const liveCanvas = document.getElementById('liveCanvas');
const startMsg = document.getElementById('startMsg');
const startBtn = document.getElementById('startBtn');
const snapBtn = document.getElementById('snapBtn');
const snapLink = document.getElementById('snapLink');
const switchCamBtn = document.getElementById('switchCamBtn');

let currentStream = null, facingMode = 'user', faceMesh = null, running = false, lastLandmarks = null, busy = false;

const IRIS_DIAMETER_MM = 11.7;      // horizontal visible iris diameter, adult average
const OUTER_CANTHI_MM = 90;         // fallback only, if iris landmarks are missing
const LENS_PLANE_OFFSET_MM = 12;    // vertex distance: lens plane in front of the cornea

const arRenderer = new THREE.WebGLRenderer({ canvas:liveCanvas, antialias:true, alpha:true, preserveDrawingBuffer:true });
arRenderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
if('outputColorSpace' in arRenderer) arRenderer.outputColorSpace = THREE.SRGBColorSpace;
arRenderer.toneMapping = renderer.toneMapping;
arRenderer.toneMappingExposure = renderer.toneMappingExposure;

const arScene = new THREE.Scene();
arScene.environment = scene.environment; // same studio reflections as the configurator
arScene.add(hemi.clone(), keyLight.clone(), fillLight.clone(), rimLight.clone());

// the camera image is the scene background (cover-cropped + mirrored via
// texture repeat/offset in fitVideoBackground), so the clear lens glass
// refracts the real video instead of an empty transparent canvas
const videoTexture = new THREE.VideoTexture(video);
if('colorSpace' in videoTexture) videoTexture.colorSpace = THREE.SRGBColorSpace;
videoTexture.wrapS = THREE.RepeatWrapping;
arScene.background = videoTexture;

// orthographic camera measured in mm (its frustum is set per frame from
// the face's pixels-per-mm) — perspective plays no part in the bril's size
const arCamera = new THREE.OrthographicCamera(-100, 100, 75, -75, 1, 5000);
arCamera.position.set(0, 0, 2000);
arCamera.lookAt(0, 0, 0);

// head pose anchor: rotation + position only. Its scale is never touched.
const arAnchor = new THREE.Group();
arAnchor.visible = false;
arScene.add(arAnchor);

// invisible head (depth only) so pootjes disappear behind the head/ears
// instead of being drawn over the face. This is an occluder, not part of
// the bril — the product model itself is untouched.
const headOccluderGeo = new THREE.SphereGeometry(1, 48, 32);
headOccluderGeo.scale(80, 105, 95); // ≈ adult head half-widths in mm; wide enough that pootjes (HINGE.x + flare ≈ 72 mm) run inside it behind the ears
const headOccluder = new THREE.Mesh(headOccluderGeo, new THREE.MeshBasicMaterial({ colorWrite:false }));
headOccluder.position.set(0, 12, -LENS_PLANE_OFFSET_MM - 95);
headOccluder.renderOrder = -1;
arAnchor.add(headOccluder);

let arModel = null;

function modelSizeMm(object){
  // measured in the object's own (unposed) space, so anchor rotation doesn't skew it
  const box = new THREE.Box3();
  object.updateMatrixWorld(true);
  const inv = new THREE.Matrix4().copy(object.matrixWorld).invert();
  object.traverse(o=>{
    if(!o.isMesh) return;
    o.geometry.computeBoundingBox();
    const b = o.geometry.boundingBox.clone().applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld));
    box.union(b);
  });
  const s = box.getSize(new THREE.Vector3());
  return { width:+s.x.toFixed(2), height:+s.y.toFixed(2), depth:+s.z.toFixed(2) };
}

function meshesOf(object){ const out=[]; object.traverse(o=>{ if(o.isMesh) out.push(o); }); return out; }

// true when the AR model is literally the configurator's model: same
// configuration, same geometry instances, same materials, same local transforms, scale 1
function verifyARMatchesConfigurator(){
  if(!productModel || !arModel) return false;
  const a = meshesOf(productModel.group), b = meshesOf(arModel);
  if(a.length !== b.length) return false;
  const same = a.every((m,i)=> m.geometry === b[i].geometry && m.material === b[i].material
    && m.position.equals(b[i].position) && m.quaternion.equals(b[i].quaternion) && m.scale.equals(b[i].scale));
  const unscaled = arModel.scale.x===1 && arModel.scale.y===1 && arModel.scale.z===1
    && arAnchor.scale.x===1 && arAnchor.scale.y===1 && arAnchor.scale.z===1;
  return same && unscaled && arModel.userData.configurationKey === productModel.configuration.key;
}

function syncARModel(){
  if(!productModel) rebuildGlasses();
  if(arModel) arAnchor.remove(arModel);
  arModel = productModel.group.clone(); // shares geometry + material — no second bril
  arModel.userData.configurationKey = productModel.configuration.key;
  arAnchor.add(arModel);

  const c = productModel.configuration;
  const size = modelSizeMm(arModel);
  console.log('AR configuration:',
    '\n  frame:', `${c.frame} (id ${c.frameId})`,
    '\n  temple:', `${c.temple} (id ${c.templeId})`,
    '\n  material:', `${c.material} (${c.materialId}, ${c.color})`,
    '\n  model:', `configurator mesh group ${productModel.group.uuid} — ${meshesOf(arModel).length} meshes, ${size.width}×${size.height}×${size.depth} mm`,
    '\n  same geometry as configurator:', verifyARMatchesConfigurator());
}

function resizeLiveCanvas(){
  const rect = liveCanvas.getBoundingClientRect();
  arRenderer.setSize(Math.max(1, Math.round(rect.width)), Math.max(1, Math.round(rect.height)), false);
}
window.addEventListener('resize', resizeLiveCanvas);

// object-fit:cover crop of the video into the canvas, expressed as the
// visible fraction (rx, ry) of the video frame — shared by the background
// texture and the landmark mapping so they line up exactly
function videoCover(){
  const vw = video.videoWidth || 640, vh = video.videoHeight || 480;
  const cw = arRenderer.domElement.clientWidth || 640, ch = arRenderer.domElement.clientHeight || 480;
  const va = vw/vh, ca = cw/ch;
  return va > ca ? { rx: ca/va, ry: 1, cw, ch } : { rx: 1, ry: va/ca, cw, ch };
}
function fitVideoBackground(){
  const { rx, ry } = videoCover();
  const mirrored = facingMode === 'user';
  videoTexture.repeat.set(mirrored ? -rx : rx, ry);
  videoTexture.offset.set(mirrored ? (1+rx)/2 : (1-rx)/2, (1-ry)/2);
}

async function startCamera(){
  try{
    if(currentStream){ currentStream.getTracks().forEach(t=>t.stop()); }
    currentStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode, width:{ideal:640}, height:{ideal:480} }, audio:false });
    video.srcObject = currentStream;
    await video.play();
    resizeLiveCanvas();
    startMsg.style.display = 'none';
    if(!faceMesh) initFaceMesh();
    if(!running){ running = true; requestAnimationFrame(loop); }
  }catch(err){
    startMsg.innerHTML = '<div>Kon geen toegang krijgen tot de camera.<br><span style="opacity:.8;font-size:.8em;">'+ (err.message||err) +'</span></div>';
    startMsg.style.display = 'flex';
  }
}
startBtn.addEventListener('click', startCamera);
switchCamBtn.addEventListener('click', ()=>{
  facingMode = facingMode==='user' ? 'environment' : 'user';
  video.style.transform = facingMode==='user' ? 'scaleX(-1)' : 'none';
  startCamera();
});

function initFaceMesh(){
  faceMesh = new FaceMesh({ locateFile:(f)=> `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}` });
  faceMesh.setOptions({ maxNumFaces:1, refineLandmarks:true, minDetectionConfidence:0.6, minTrackingConfidence:0.6 });
  faceMesh.onResults(res=>{ lastLandmarks = (res.multiFaceLandmarks && res.multiFaceLandmarks[0]) || null; });
}

async function loop(){
  if(!running) return;
  if(video.readyState >= 2 && faceMesh && !busy){
    busy = true;
    try{ await faceMesh.send({ image: video }); } catch(e){}
    busy = false;
  }
  renderAR();
  requestAnimationFrame(loop);
}

let smoothedPxPerMm = null;

// landmarks → head pose. Only rotation + position are applied to arAnchor;
// the face's size is handled by fitting the camera frustum (px per mm).
function updateHeadPose(landmarks){
  const { rx, ry, cw, ch } = videoCover();
  const mirrored = facingMode === 'user';
  // normalized video coords → canvas pixels, Y up, Z toward the camera
  const P = (i)=>{
    const p = landmarks[i];
    let u = (p.x - (1-rx)/2) / rx;
    const v = (p.y - (1-ry)/2) / ry;
    if(mirrored) u = 1 - u;
    return new THREE.Vector3((u-0.5)*cw, (0.5-v)*ch, -p.z*cw/rx);
  };

  let pxPerMm;
  if(landmarks.length >= 478){
    const irisPx = (P(469).distanceTo(P(471)) + P(474).distanceTo(P(476))) / 2;
    pxPerMm = irisPx / IRIS_DIAMETER_MM;
  } else {
    pxPerMm = P(33).distanceTo(P(263)) / OUTER_CANTHI_MM;
  }
  smoothedPxPerMm = smoothedPxPerMm ? smoothedPxPerMm*0.85 + pxPerMm*0.15 : pxPerMm;
  const k = smoothedPxPerMm;

  // camera frustum in mm: this — not a model scale — maps real mm to pixels
  arCamera.left = -cw/2/k; arCamera.right = cw/2/k;
  arCamera.top = ch/2/k;   arCamera.bottom = -ch/2/k;
  arCamera.updateProjectionMatrix();

  const mm = (v)=> v.divideScalar(k);
  // model +X must point to the screen-right eye: landmark 263 in the raw
  // image, landmark 33 once the selfie view is mirrored
  const xAxis = mirrored ? mm(P(33)).sub(mm(P(263))) : mm(P(263)).sub(mm(P(33)));
  xAxis.normalize();
  const upApprox = mm(P(10)).sub(mm(P(152)));
  const zAxis = new THREE.Vector3().crossVectors(xAxis, upApprox).normalize();
  const yAxis = new THREE.Vector3().crossVectors(zAxis, xAxis).normalize();
  arAnchor.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(xAxis, yAxis, zAxis));

  const pupils = landmarks.length >= 478
    ? mm(P(468)).add(mm(P(473))).multiplyScalar(0.5)
    : mm(P(33)).add(mm(P(263))).multiplyScalar(0.5);
  arAnchor.position.copy(pupils).addScaledVector(zAxis, LENS_PLANE_OFFSET_MM);
  arAnchor.visible = true;
}

function renderAR(){
  const rect = liveCanvas.getBoundingClientRect();
  if(arRenderer.domElement.width !== Math.round(rect.width*arRenderer.getPixelRatio())) resizeLiveCanvas();
  fitVideoBackground();
  if(lastLandmarks) updateHeadPose(lastLandmarks); else arAnchor.visible = false;
  arRenderer.render(arScene, arCamera);
}

snapBtn.addEventListener('click', ()=>{
  // the AR canvas already contains the (mirrored) camera image + the bril
  snapLink.href = liveCanvas.toDataURL('image/png');
  snapLink.click();
});

// debug/test hook: lets the console (or an automated test) inspect exactly
// what the configurator and AR are using
window.__everywear = {
  getSelectedConfiguration, syncARModel, verifyARMatchesConfigurator, modelSizeMm,
  get productModel(){ return productModel; },
  get arModel(){ return arModel; },
  select(frameId, templeId, materialId){
    if(frameId!==undefined) state.montuur = frameId;
    if(templeId!==undefined) state.pootje = templeId;
    if(materialId!==undefined) state.materiaal = materialId;
    refresh();
  },
  openTryOn, closeTryOn, renderAR, camera, controls,
  setLandmarks(l){ lastLandmarks = l; },
};

refresh();
</script>
</body>
