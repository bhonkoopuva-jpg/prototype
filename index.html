<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>EveryWear</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdfbf7; --surface:#ffffff; --ink:#4a4238; --muted:#948a7a; --line:rgba(74,66,56,.10);
    --accent:#d97c4f; --accent-strong:#c1663b; --olive:#8a9878; --navy:#7192a3; --ochre:#e0b46a;
    --stage-studio:#f1eee6; --stage-daylight:#fdf7ea; --stage-pearl:#faf3f0;
    --f-display:'Fraunces', Georgia, serif;
    --f-body:'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  *{box-sizing:border-box;}
  html, body{ height:100%; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--f-body); display:flex; flex-direction:column; overflow:hidden; }
  img{max-width:100%;}
  a{ color:inherit; }
  .shell{ max-width:1080px; margin:0 auto; padding-inline:1.3rem; }
  button{ font-family:inherit; }

  nav.top{ flex:none; z-index:20; background:var(--bg); border-bottom:1px solid var(--line); }
  nav.top .shell{ display:flex; align-items:center; justify-content:space-between; padding-block:.65rem; gap:1rem; flex-wrap:wrap; }
  .brand{ font-family:var(--f-display); font-weight:700; font-size:1.15rem; text-decoration:none; }
  .navlinks{ display:flex; gap:1.4rem; font-size:.86rem; font-weight:600; }
  .navlinks a{ text-decoration:none; color:var(--muted); }
  .navlinks a:hover{ color:var(--ink); }

  main{ flex:1; min-height:0; display:flex; flex-direction:column; }

  /* ---- Frame Studio configurator: fills the remaining viewport, no page scroll ---- */
  .studio{ flex:1; min-height:0; display:flex; flex-direction:column; padding-block:.9rem; }
  .studio-head{ flex:none; display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:1rem; margin-bottom:.8rem; }
  .studio-head h1{ font-family:var(--f-display); font-weight:700; font-size:1.5rem; margin:0 0 .2rem; }
  .studio-head .collection{ color:var(--muted); font-size:.85rem; }
  .studio-meta{ text-align:right; font-size:.8rem; color:var(--muted); }
  .studio-meta .ref{ font-family:ui-monospace,monospace; font-size:.78rem; }
  .studio-meta .total{ font-family:var(--f-display); font-weight:700; font-size:1.4rem; color:var(--ink); }

  .studio-grid{ flex:1; min-height:0; display:flex; }
  .stage-card{
    background:var(--surface); border:1px solid var(--line); border-radius:20px; overflow:hidden;
    display:flex; flex-direction:column; flex:1; min-height:0;
  }
  .preview-area{ flex:7 1 0; min-height:0; padding:1rem 1rem 0; display:flex; flex-direction:column; }
  .preview-toolbar{ display:flex; justify-content:flex-end; margin-bottom:.7rem; }
  .pill-group{ display:inline-flex; background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:.2rem; gap:.15rem; }
  .pill-group button{ border:none; background:transparent; padding:.4rem .85rem; border-radius:999px; font-size:.78rem; font-weight:600; cursor:pointer; color:var(--muted); }
  .pill-group button.active{ background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08); }

  .stage-pair{ flex:1; min-height:0; display:grid; grid-template-columns:1fr 1fr; gap:.8rem; }
  .stage-single{ position:relative; border-radius:14px; overflow:hidden; transition:background .25s; min-width:0; }
  .stage-single canvas{ position:absolute; inset:0; width:100%; height:100%; }
  .stage-single .angle-label{
    position:absolute; top:.6rem; left:.7rem; font-size:.7rem; font-weight:700; letter-spacing:.06em;
    text-transform:uppercase; color:var(--muted); background:color-mix(in srgb, var(--surface) 75%, transparent);
    padding:.2rem .55rem; border-radius:999px; z-index:2;
  }

  .picker-sheet{ flex:3 1 0; min-height:0; border-top:1px solid var(--line); background:var(--bg); display:flex; flex-direction:column; padding:.8rem 1rem; gap:.6rem; }
  .tabs{ display:flex; gap:1.1rem; flex:none; }
  .tabs button{ border:none; background:none; padding:.2rem 0; font-size:.86rem; font-weight:700; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; }
  .tabs button.active{ color:var(--ink); border-bottom-color:var(--accent); }

  .wheel-row{ flex:1; min-height:0; display:flex; align-items:center; gap:.7rem; overflow-x:auto; scroll-snap-type:x proximity; padding:.2rem .1rem .5rem; }
  .wheel-chip{
    flex:none; scroll-snap-align:center; display:flex; flex-direction:column; align-items:center; gap:.3rem;
    cursor:pointer; opacity:.75; transition:opacity .15s, transform .15s;
  }
  .wheel-chip:hover{ opacity:1; }
  .wheel-chip.selected{ opacity:1; transform:translateY(-2px); }
  .wheel-chip .wheel-thumb{
    width:58px; height:58px; border-radius:50%; border:2px solid var(--line); background:#fff;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .wheel-chip.selected .wheel-thumb{ border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .wheel-chip .wheel-thumb img{ width:100%; height:100%; object-fit:contain; }
  .wheel-chip .wheel-thumb.swatch-dot{ border-radius:50%; }
  .wheel-chip .wheel-label{ font-size:.68rem; font-weight:600; color:var(--muted); white-space:nowrap; }
  .wheel-chip.selected .wheel-label{ color:var(--ink); }
  .wheel-chip .wheel-price{ font-size:.62rem; color:var(--muted); font-variant-numeric:tabular-nums; }

  .action-row{ display:flex; gap:.6rem; flex:none; }
  .action-row button{ flex:1; min-width:0; padding:.65rem .7rem; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-weight:700; font-size:.8rem; cursor:pointer; }
  .action-row button.primary{ background:var(--accent); color:#fff; border-color:transparent; }
  .action-row button.primary:hover{ background:var(--accent-strong); }

  /* ---- live try-on modal ---- */
  .tryon-modal{
    position:fixed; inset:0; z-index:40; background:color-mix(in srgb, var(--ink) 45%, transparent);
    display:flex; align-items:center; justify-content:center; padding:1.2rem;
  }
  .tryon-panel{ background:var(--surface); border-radius:18px; padding:1.3rem; width:100%; max-width:560px; max-height:92vh; overflow-y:auto; }
  .tryon-panel-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:.9rem; }
  .tryon-panel-head h2{ font-family:var(--f-display); font-weight:700; font-size:1.2rem; margin:0; }
  .close-btn{ border:none; background:var(--bg); width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:.9rem; color:var(--ink); }
  .live-stage{ position:relative; width:100%; background:#000; border:1px solid var(--line); border-radius:16px; overflow:hidden; aspect-ratio:4/3; }
  video, canvas#liveCanvas{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  video{ transform:scaleX(-1); }
  .overlay-msg{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; color:#fff; background:rgba(0,0,0,.55); font-size:.9rem; padding:1.5rem; line-height:1.5; }
  .overlay-msg button{ margin-top:.8rem; padding:.6rem 1.2rem; border-radius:999px; border:none; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; font-size:.85rem; }
  .controls-row{ display:flex; gap:.7rem; flex-wrap:wrap; margin-top:.9rem; }
  .controls-row button{ flex:1; min-width:130px; padding:.65rem 1rem; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-weight:700; font-size:.85rem; cursor:pointer; }
  .controls-row button.primary{ background:var(--accent); color:#fff; border-color:transparent; }
  a#snapLink{ display:none; }

  .toast{
    position:fixed; left:50%; bottom:1.4rem; transform:translateX(-50%) translateY(120%);
    background:var(--ink); color:var(--bg); padding:.75rem 1.2rem; border-radius:999px; font-size:.85rem; font-weight:600;
    transition:transform .25s ease; z-index:50; white-space:nowrap;
  }
  .toast.show{ transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<nav class="top">
  <div class="shell">
    <a class="brand" href="#">EveryWear</a>
    <div class="navlinks">
      <a href="#" id="tryOnNavLink">Live passen</a>
    </div>
  </div>
</nav>

<main>
  <div class="studio shell">
    <div class="studio-head">
      <div>
        <h1>Frame Studio</h1>
        <div class="collection">Natuur &amp; Avontuur</div>
      </div>
      <div class="studio-meta">
        <div class="ref" id="refCode">Ref EW-1A-NBST00</div>
        <div class="total" id="totalPrice">€55</div>
      </div>
    </div>

    <div class="studio-grid">
      <div class="stage-card">
        <div class="preview-area">
          <div class="preview-toolbar">
            <div class="pill-group" id="lightToggle">
              <button data-light="studio" class="active">Studio</button>
              <button data-light="daylight">Daylight</button>
              <button data-light="pearl">Pearl</button>
            </div>
          </div>
          <div class="stage-pair" id="previewStage">
            <div class="stage-single" id="stageVoor">
              <span class="angle-label">Voor</span>
              <canvas id="previewCanvasVoor" width="360" height="360"></canvas>
            </div>
            <div class="stage-single" id="stageZij">
              <span class="angle-label">Zij</span>
              <canvas id="previewCanvasZij" width="360" height="360"></canvas>
            </div>
          </div>
        </div>

        <div class="picker-sheet">
          <div class="tabs" id="tabBar">
            <button data-tab="montuur" class="active">Montuur</button>
            <button data-tab="pootjes">Pootjes</button>
            <button data-tab="materiaal">Materiaal</button>
          </div>
          <div class="wheel-row" id="optionList"></div>
          <div class="action-row">
            <button class="primary" id="tryOnBtn">Probeer Op</button>
            <button id="resetBtn">Reset</button>
            <button id="finishBtn">Finish Design</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<div class="tryon-modal" id="tryonModal" hidden>
  <div class="tryon-panel">
    <div class="tryon-panel-head">
      <h2>Probeer je ontwerp op</h2>
      <button class="close-btn" id="closeTryOn" aria-label="Sluiten">✕</button>
    </div>
    <div class="live-stage" id="stage">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="liveCanvas"></canvas>
      <div class="overlay-msg" id="startMsg">
        <div>
          <div>Geef toegang tot je camera om de bril te passen.</div>
          <button id="startBtn">Camera starten</button>
        </div>
      </div>
    </div>
    <div class="controls-row">
      <button class="primary" id="snapBtn">Maak foto</button>
      <button id="switchCamBtn">Wissel camera</button>
    </div>
    <a id="snapLink" download="everywear-pasfoto.png"></a>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
<script>
/* ---------- configuration data (from the real Frame Studio) ---------- */
const MONTUREN = [
  { id:1, label:'Montuur 1', price:45, voor:'assets/montuur1-voor.jpg', zij:'assets/montuur1-zij.jpg' },
  { id:2, label:'Montuur 2', price:45, voor:'assets/montuur2-voor.jpg', zij:'assets/montuur2-zij.jpg' },
  { id:3, label:'Montuur 3', price:45, voor:'assets/montuur3-voor.jpg', zij:'assets/montuur3-zij.jpg' },
  { id:4, label:'Montuur 4', price:45, voor:'assets/montuur4-voor.jpg', zij:'assets/montuur4-zij.jpg' },
];
function getMontuur(id){ return MONTUREN.find(m=>m.id===id); }
const montuurImgCache = {};
function loadMontuurImage(src){
  if(montuurImgCache[src]) return montuurImgCache[src];
  const img = new Image();
  img.src = src;
  montuurImgCache[src] = img;
  return img;
}
const POOTJES = [
  { id:'A', label:'Pootje A', price:0 },
  { id:'B', label:'Pootje B', price:0 },
  { id:'C', label:'Pootje C', price:0 },
  { id:'D', label:'Pootje D', price:0 },
];
const MATERIALEN = [
  { id:'parelwit',   label:'Parelwit',   price:10, hex:'#F2EEE6' },
  { id:'transparant',label:'Transparant',price:10, hex:'#E4E2D9' },
  { id:'perzik',     label:'Perzik',     price:10, hex:'#F0B18A' },
  { id:'luchtblauw', label:'Luchtblauw', price:10, hex:'#A9CBDF' },
  { id:'schildpad',  label:'Schildpad',  price:10, hex:'#8B5A34' },
  { id:'antraciet',  label:'Antraciet',  price:10, hex:'#3A3A3A' },
  { id:'bosgroen',   label:'Bosgroen',   price:10, hex:'#33503A' },
  { id:'nachtblauw', label:'Nachtblauw', price:10, hex:'#16283D' },
];

let state = {
  montuur: 1,
  pootje: 'A',
  materiaal: 'nachtblauw',
  view: 'voor',
  light: 'studio',
  tab: 'montuur',
};

function getMateriaal(id){ return MATERIALEN.find(m=>m.id===id); }

/* ---------- glasses drawing (shared front/side) ---------- */
function drawGlassesFront(ctx, cx, cy, unitScale, color){
  ctx.save(); ctx.translate(cx, cy); ctx.scale(unitScale, unitScale);
  const lensW=58, lensH=40, rimW=9, gap=20, r=8;
  ctx.lineJoin='round'; ctx.fillStyle=color; ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.lineWidth=1;
  function rr(x,y,w,h,rad){
    ctx.beginPath(); ctx.moveTo(x+rad,y); ctx.arcTo(x+w,y,x+w,y+h,rad); ctx.arcTo(x+w,y+h,x,y+h,rad);
    ctx.arcTo(x,y+h,x,y,rad); ctx.arcTo(x,y,x+w,y,rad); ctx.closePath();
  }
  [-1,1].forEach(side=>{
    const x = side===-1 ? -(gap/2+lensW) : gap/2, y = -lensH/2;
    rr(x-rimW/2, y-rimW/2, lensW+rimW, lensH+rimW, r+rimW/2); ctx.fill(); ctx.stroke();
    ctx.save(); rr(x,y,lensW,lensH,r); ctx.clip();
    ctx.fillStyle='rgba(255,255,255,0.08)'; ctx.fillRect(x,y,lensW,lensH); ctx.restore();
    const armX = side===-1 ? x-rimW/2 : x+lensW+rimW/2;
    ctx.beginPath(); ctx.moveTo(armX,0); ctx.lineTo(armX+side*26,-4);
    ctx.lineWidth=rimW*0.7; ctx.strokeStyle=color; ctx.lineCap='round'; ctx.stroke();
  });
  ctx.fillStyle=color; rr(-gap/2, -lensH/2+6, gap, 9, 4); ctx.fill();
  ctx.restore();
}
function drawGlassesSide(ctx, cx, cy, unitScale, color){
  // simplified side-profile: one lens rim + a long temple arm receding to the right
  ctx.save(); ctx.translate(cx, cy); ctx.scale(unitScale, unitScale);
  ctx.fillStyle=color; ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.ellipse(0,0,26,20,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.beginPath(); ctx.ellipse(0,0,26-9,20-9,0,0,Math.PI*2); ctx.clip();
  ctx.fillStyle='rgba(255,255,255,0.08)'; ctx.fillRect(-30,-30,60,60); ctx.restore();
  ctx.beginPath(); ctx.moveTo(24,-6); ctx.quadraticCurveTo(70,-14,96,-2);
  ctx.lineWidth=9; ctx.strokeStyle=color; ctx.lineCap='round'; ctx.stroke();
  ctx.restore();
}

/* ---- tint a real frame photo toward the selected material color ----
   Keeps near-white background untouched, preserves luminance/texture (grain,
   reflections) on the frame itself, and shifts its hue toward the target color.
   This is an approximate live preview, not a photoreal material render. */
function hexToRgb(hex){
  const v = hex.replace('#','');
  return [parseInt(v.slice(0,2),16), parseInt(v.slice(2,4),16), parseInt(v.slice(4,6),16)];
}
function drawTintedPhoto(ctx, img, w, h, color){
  ctx.clearRect(0,0,w,h);
  if(!img.complete || img.naturalWidth===0) return false;
  // draw image centered, contained within the canvas
  const scale = Math.min(w/img.naturalWidth, h/img.naturalHeight);
  const dw = img.naturalWidth*scale, dh = img.naturalHeight*scale;
  const dx = (w-dw)/2, dy = (h-dh)/2;
  ctx.drawImage(img, dx, dy, dw, dh);
  const [tr,tg,tb] = hexToRgb(color);
  const frame = ctx.getImageData(dx, dy, Math.max(1,Math.round(dw)), Math.max(1,Math.round(dh)));
  const d = frame.data;
  for(let i=0;i<d.length;i+=4){
    const r=d[i], g=d[i+1], b=d[i+2];
    if(r>235 && g>235 && b>235) continue; // leave the white background alone
    const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
    d[i]   = tr*lum + r*0.18;
    d[i+1] = tg*lum + g*0.18;
    d[i+2] = tb*lum + b*0.18;
  }
  ctx.putImageData(frame, dx, dy);
  return true;
}

/* ---------- configurator preview: front + side canvases, drawn together ---------- */
const previewCanvasVoor = document.getElementById('previewCanvasVoor');
const previewCanvasZij = document.getElementById('previewCanvasZij');
const pvctxVoor = previewCanvasVoor.getContext('2d');
const pvctxZij = previewCanvasZij.getContext('2d');
const stageVoor = document.getElementById('stageVoor');
const stageZij = document.getElementById('stageZij');

function drawOneAngle(canvas, ctx, montuur, src, color, fallbackDraw){
  const img = loadMontuurImage(src);
  const w = canvas.width, h = canvas.height;
  const ok = drawTintedPhoto(ctx, img, w, h, color);
  if(!ok){
    ctx.clearRect(0,0,w,h);
    fallbackDraw(ctx, w/2, h/2, 2.6, color);
    img.onload = ()=>{ if(getMontuur(state.montuur)===montuur) drawPreview(); };
  }
}

function drawPreview(){
  const color = getMateriaal(state.materiaal).hex;
  const montuur = getMontuur(state.montuur);
  drawOneAngle(previewCanvasVoor, pvctxVoor, montuur, montuur.voor, color, drawGlassesFront);
  drawOneAngle(previewCanvasZij, pvctxZij, montuur, montuur.zij, color, drawGlassesSide);

  const bgVar = state.light === 'studio' ? '--stage-studio' : state.light === 'daylight' ? '--stage-daylight' : '--stage-pearl';
  const bg = getComputedStyle(document.documentElement).getPropertyValue(bgVar);
  stageVoor.style.background = bg;
  stageZij.style.background = bg;
}

/* ---------- price + ref code ---------- */
function refresh(){
  const total = MONTUREN.find(m=>m.id===state.montuur).price
              + POOTJES.find(p=>p.id===state.pootje).price
              + getMateriaal(state.materiaal).price;
  document.getElementById('totalPrice').textContent = '€' + total;

  const matCode = state.materiaal.slice(0,2).toUpperCase();
  document.getElementById('refCode').textContent = `Ref EW-${state.montuur}${state.pootje}-${matCode}VR00`;

  drawPreview();
  renderOptions();
  syncLiveColor();
}

/* ---------- tabs + option list ---------- */
document.getElementById('tabBar').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-tab]');
  if(!btn) return;
  state.tab = btn.dataset.tab;
  document.querySelectorAll('#tabBar button').forEach(b=>b.classList.toggle('active', b===btn));
  renderOptions();
});

function renderOptions(){
  const list = document.getElementById('optionList');
  list.innerHTML = '';
  let items, selectedId, isColor;
  if(state.tab === 'montuur'){ items = MONTUREN; selectedId = state.montuur; isColor=false; }
  else if(state.tab === 'pootjes'){ items = POOTJES; selectedId = state.pootje; isColor=false; }
  else { items = MATERIALEN; selectedId = state.materiaal; isColor=true; }

  items.forEach(item=>{
    const chip = document.createElement('div');
    chip.className = 'wheel-chip' + (item.id===selectedId ? ' selected' : '');

    const thumb = document.createElement('div');
    thumb.className = 'wheel-thumb' + (isColor ? ' swatch-dot' : '');
    if(isColor){
      thumb.style.background = item.hex;
    } else if(item.voor){
      const img = document.createElement('img');
      img.src = item.voor; img.alt = item.label;
      thumb.appendChild(img);
    }
    chip.appendChild(thumb);

    const label = document.createElement('div'); label.className='wheel-label'; label.textContent = item.label;
    const price = document.createElement('div'); price.className='wheel-price';
    price.textContent = item.price > 0 ? `+€${item.price}` : 'incl.';
    chip.appendChild(label); chip.appendChild(price);

    chip.onclick = ()=>{
      if(state.tab==='montuur') state.montuur = item.id;
      else if(state.tab==='pootjes') state.pootje = item.id;
      else state.materiaal = item.id;
      refresh();
    };
    list.appendChild(chip);
  });

  const sel = list.querySelector('.wheel-chip.selected');
  if(sel) sel.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
}

/* ---------- light toggle ---------- */
document.getElementById('lightToggle').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-light]'); if(!btn) return;
  state.light = btn.dataset.light;
  document.querySelectorAll('#lightToggle button').forEach(b=>b.classList.toggle('active', b===btn));
  refresh();
});

/* ---------- action buttons ---------- */
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> t.classList.remove('show'), 2200);
}
document.getElementById('resetBtn').addEventListener('click', ()=>{
  state = { montuur:1, pootje:'A', materiaal:'nachtblauw', view:'voor', light:'studio', tab:'montuur' };
  document.querySelectorAll('#lightToggle button').forEach(b=>b.classList.toggle('active', b.dataset.light==='studio'));
  document.querySelectorAll('#tabBar button').forEach(b=>b.classList.toggle('active', b.dataset.tab==='montuur'));
  refresh();
  showToast('Ontwerp gereset');
});
document.getElementById('finishBtn').addEventListener('click', ()=>{
  const m = MONTUREN.find(x=>x.id===state.montuur), p = POOTJES.find(x=>x.id===state.pootje), mat = getMateriaal(state.materiaal);
  showToast(`${m.label} · ${p.label} · ${mat.label} — ${document.getElementById('totalPrice').textContent} bewaard`);
});
const tryonModal = document.getElementById('tryonModal');
function openTryOn(){
  tryonModal.hidden = false;
  if(!running) document.getElementById('startBtn').click();
}
function closeTryOn(){
  tryonModal.hidden = true;
  if(currentStream){ currentStream.getTracks().forEach(t=>t.stop()); currentStream = null; }
  running = false;
  startMsg.style.display = 'flex';
  startMsg.innerHTML = '<div><div>Geef toegang tot je camera om de bril te passen.</div><button id="startBtn">Camera starten</button></div>';
  document.getElementById('startBtn').addEventListener('click', startCamera);
}
document.getElementById('tryOnBtn').addEventListener('click', openTryOn);
document.getElementById('tryOnNavLink').addEventListener('click', (e)=>{ e.preventDefault(); openTryOn(); });
document.getElementById('closeTryOn').addEventListener('click', closeTryOn);
tryonModal.addEventListener('click', (e)=>{ if(e.target===tryonModal) closeTryOn(); });

/* ---------- live camera AR (uses configurator's material color) ---------- */
const video = document.getElementById('video');
const liveCanvas = document.getElementById('liveCanvas');
const lctx = liveCanvas.getContext('2d');
const startMsg = document.getElementById('startMsg');
const startBtn = document.getElementById('startBtn');
const snapBtn = document.getElementById('snapBtn');
const snapLink = document.getElementById('snapLink');
const switchCamBtn = document.getElementById('switchCamBtn');

let currentStream = null, facingMode = 'user', faceMesh = null, running = false, lastLandmarks = null, busy = false;

function syncLiveColor(){ /* color read live from state.materiaal at draw time, nothing to precompute */ }

function resizeLiveCanvas(){
  const rect = video.getBoundingClientRect();
  liveCanvas.width = rect.width; liveCanvas.height = rect.height;
}
window.addEventListener('resize', resizeLiveCanvas);

async function startCamera(){
  try{
    if(currentStream){ currentStream.getTracks().forEach(t=>t.stop()); }
    currentStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode, width:{ideal:640}, height:{ideal:480} }, audio:false });
    video.srcObject = currentStream;
    await video.play();
    resizeLiveCanvas();
    startMsg.style.display = 'none';
    if(!faceMesh) initFaceMesh();
    if(!running){ running = true; requestAnimationFrame(loop); }
  }catch(err){
    startMsg.innerHTML = '<div>Kon geen toegang krijgen tot de camera.<br><span style="opacity:.8;font-size:.8em;">'+ (err.message||err) +'</span></div>';
    startMsg.style.display = 'flex';
  }
}
startBtn.addEventListener('click', startCamera);
switchCamBtn.addEventListener('click', ()=>{
  facingMode = facingMode==='user' ? 'environment' : 'user';
  video.style.transform = facingMode==='user' ? 'scaleX(-1)' : 'none';
  startCamera();
});

function initFaceMesh(){
  faceMesh = new FaceMesh({ locateFile:(f)=> `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}` });
  faceMesh.setOptions({ maxNumFaces:1, refineLandmarks:true, minDetectionConfidence:0.6, minTrackingConfidence:0.6 });
  faceMesh.onResults(res=>{ lastLandmarks = (res.multiFaceLandmarks && res.multiFaceLandmarks[0]) || null; });
}

async function loop(){
  if(!running) return;
  if(video.readyState >= 2 && faceMesh && !busy){
    busy = true;
    try{ await faceMesh.send({ image: video }); } catch(e){}
    busy = false;
  }
  drawLive();
  requestAnimationFrame(loop);
}

function drawLive(){
  const w = liveCanvas.width, h = liveCanvas.height;
  lctx.clearRect(0,0,w,h);
  if(!lastLandmarks) return;
  const toXY = (idx)=>{ const p = lastLandmarks[idx]; return { x: p.x*w, y: p.y*h }; };
  const leftOuter = toXY(33), rightOuter = toXY(263);
  const mirrored = facingMode === 'user';
  const mx = (x)=> mirrored ? (w-x) : x;
  const p1 = { x: mx(leftOuter.x), y: leftOuter.y };
  const p2 = { x: mx(rightOuter.x), y: rightOuter.y };
  const dx = p2.x-p1.x, dy = p2.y-p1.y;
  const eyeDist = Math.hypot(dx,dy);
  const angle = Math.atan2(dy,dx);
  const cx = (p1.x+p2.x)/2, cy = (p1.y+p2.y)/2 + eyeDist*0.03;
  lctx.save(); lctx.translate(cx,cy); lctx.rotate(angle); lctx.translate(-cx,-cy);
  drawGlassesFront(lctx, cx, cy, eyeDist/100, getMateriaal(state.materiaal).hex);
  lctx.restore();
}

snapBtn.addEventListener('click', ()=>{
  const out = document.createElement('canvas');
  out.width = liveCanvas.width; out.height = liveCanvas.height;
  const octx = out.getContext('2d');
  octx.save();
  if(facingMode==='user'){ octx.translate(out.width,0); octx.scale(-1,1); }
  octx.drawImage(video, 0, 0, out.width, out.height);
  octx.restore();
  octx.drawImage(liveCanvas, 0, 0);
  snapLink.href = out.toDataURL('image/png');
  snapLink.click();
});

refresh();
</script>
