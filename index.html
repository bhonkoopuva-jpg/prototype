<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>EveryWear</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdfbf7; --surface:#ffffff; --ink:#4a4238; --muted:#948a7a; --line:rgba(74,66,56,.10);
    --accent:#d97c4f; --accent-strong:#c1663b; --olive:#8a9878; --navy:#7192a3; --ochre:#e0b46a;
    --stage-studio:#f1eee6; --stage-daylight:#fdf7ea; --stage-pearl:#faf3f0;
    --f-display:'Fraunces', Georgia, serif;
    --f-body:'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  *{box-sizing:border-box;}
  html, body{ height:100%; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--f-body); display:flex; flex-direction:column; overflow:hidden; }
  img{max-width:100%;}
  a{ color:inherit; }
  [hidden]{ display:none !important; }
  .shell{ max-width:1520px; margin:0 auto; padding-inline:1.6rem; width:100%; }
  button{ font-family:inherit; }

  nav.top{ flex:none; z-index:20; background:var(--bg); border-bottom:1px solid var(--line); }
  nav.top .shell{ display:flex; align-items:center; justify-content:space-between; padding-block:.7rem; gap:1rem; flex-wrap:wrap; }
  .brand-block{ display:flex; align-items:center; gap:.6rem; }
  .brand-icon{
    width:38px; height:38px; border-radius:50%; background:var(--olive); color:#fff;
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .brand-icon svg{ width:19px; height:19px; }
  .brand-name{ font-family:var(--f-display); font-weight:700; font-size:1.1rem; line-height:1.15; }
  .brand-sub{ font-size:.66rem; font-weight:700; letter-spacing:.08em; color:var(--muted); text-transform:uppercase; }

  .nav-right{ display:flex; align-items:center; gap:1.3rem; flex-wrap:wrap; }
  .meta-block{ text-align:right; line-height:1.2; }
  .meta-label{ font-size:.62rem; font-weight:700; letter-spacing:.08em; color:var(--muted); text-transform:uppercase; }
  .meta-value{ font-family:ui-monospace,monospace; font-size:.78rem; color:var(--ink); }
  .meta-value.total{ font-family:var(--f-display); font-weight:700; font-size:1.15rem; }

  .btn-outline, .btn-solid{
    font-family:var(--f-body); font-size:.72rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    padding:.6rem 1.1rem; border-radius:999px; cursor:pointer; white-space:nowrap;
    display:inline-flex; align-items:center; gap:.4rem;
  }
  .btn-outline{ border:1px solid var(--line); background:transparent; color:var(--ink); }
  .btn-outline:hover{ border-color:var(--accent); color:var(--accent); }
  .btn-solid{ border:1px solid var(--olive); background:var(--olive); color:#fff; }
  .btn-solid:hover{ background:#73815f; }

  main{ flex:1; min-height:0; display:flex; flex-direction:column; }

  /* ---- Frame Studio configurator: fills the remaining viewport, no page scroll ---- */
  .studio{ flex:1; min-height:0; display:flex; flex-direction:column; gap:.7rem; padding-block:.8rem; }

  /* -- option rows: Montuur / Pootjes / Materiaal always visible, stacked -- */
  .option-rows{ flex:none; display:flex; flex-direction:column; gap:.5rem; }
  .option-row{
    display:flex; align-items:center; gap:1rem; background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:.55rem .8rem;
  }
  .option-row-label{
    flex:none; width:70px; font-size:.68rem; font-weight:700; letter-spacing:.07em; color:var(--muted); text-transform:uppercase;
  }
  .wheel-row{ flex:1; min-width:0; display:flex; align-items:center; gap:.6rem; overflow-x:auto; scroll-snap-type:x proximity; padding:.15rem; }
  .wheel-chip{
    flex:none; scroll-snap-align:start; display:flex; align-items:center; gap:.55rem; cursor:pointer;
    padding:.4rem .8rem .4rem .4rem; border-radius:999px; border:1px solid var(--line); background:var(--bg);
    transition:border-color .15s, background .15s;
  }
  .wheel-chip:hover{ border-color:var(--accent); }
  .wheel-chip.selected{ border-color:var(--olive); background:color-mix(in srgb, var(--olive) 10%, var(--bg)); }
  .wheel-chip .wheel-thumb{
    width:34px; height:34px; border-radius:50%; background:#fff; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; overflow:hidden; flex:none;
  }
  .wheel-chip .wheel-thumb img{ width:100%; height:100%; object-fit:contain; }
  .wheel-chip .wheel-thumb.swatch-dot{ border-radius:50%; }
  .wheel-chip .wheel-label{ font-size:.78rem; font-weight:600; color:var(--ink); white-space:nowrap; }
  .wheel-chip .wheel-price{ font-size:.68rem; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }

  /* -- preview stage -- */
  .stage-card{
    position:relative; background:linear-gradient(180deg, var(--stage-studio), color-mix(in srgb, var(--stage-studio) 70%, var(--olive)));
    border:1px solid var(--line); border-radius:20px; overflow:hidden; flex:1; min-height:0;
    transition:background .25s;
  }
  .stage-mountains{ position:absolute; left:0; right:0; bottom:0; height:38%; opacity:.5; pointer-events:none; }
  .stage-3d{ position:absolute; inset:0; }
  .stage-3d canvas{ width:100%; height:100%; display:block; cursor:grab; touch-action:none; }
  .stage-3d canvas:active{ cursor:grabbing; }
  .drag-hint{
    position:absolute; top:.9rem; left:50%; transform:translateX(-50%); z-index:2;
    font-size:.68rem; font-weight:600; letter-spacing:.04em; color:var(--muted);
    background:color-mix(in srgb, var(--surface) 80%, transparent); padding:.3rem .7rem; border-radius:999px;
    pointer-events:none; transition:opacity .3s; opacity:.9;
  }
  .drag-hint.faded{ opacity:0; }

  .stage-controls{
    position:absolute; left:50%; bottom:1.1rem; transform:translateX(-50%); z-index:3;
    display:flex; align-items:center; gap:.9rem; background:color-mix(in srgb, var(--surface) 88%, transparent);
    border:1px solid var(--line); border-radius:999px; padding:.4rem .6rem .4rem 1rem; backdrop-filter:blur(6px);
  }
  .zoom-group{ display:flex; align-items:center; gap:.55rem; color:var(--muted); }
  .zoom-group svg{ flex:none; width:16px; height:16px; stroke:var(--muted); }
  .zoom-group input[type=range]{ width:110px; accent-color:var(--olive); cursor:pointer; }
  .pill-group{ display:inline-flex; background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:.2rem; gap:.15rem; }
  .pill-group button{ border:none; background:transparent; padding:.4rem .85rem; border-radius:999px; font-size:.72rem; font-weight:700; letter-spacing:.03em; text-transform:uppercase; cursor:pointer; color:var(--muted); }
  .pill-group button.active{ background:var(--olive); color:#fff; }

  /* ---- live try-on modal ---- */
  .tryon-modal{
    position:fixed; inset:0; z-index:40; background:color-mix(in srgb, var(--ink) 45%, transparent);
    display:flex; align-items:center; justify-content:center; padding:1.2rem;
  }
  .tryon-panel{ background:var(--surface); border-radius:18px; padding:1.3rem; width:100%; max-width:560px; max-height:92vh; overflow-y:auto; }
  .tryon-panel-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:.9rem; }
  .tryon-panel-head h2{ font-family:var(--f-display); font-weight:700; font-size:1.2rem; margin:0; }
  .close-btn{ border:none; background:var(--bg); width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:.9rem; color:var(--ink); }
  .live-stage{ position:relative; width:100%; background:#000; border:1px solid var(--line); border-radius:16px; overflow:hidden; aspect-ratio:4/3; }
  video, canvas#liveCanvas{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  video{ transform:scaleX(-1); }
  .overlay-msg{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; color:#fff; background:rgba(0,0,0,.55); font-size:.9rem; padding:1.5rem; line-height:1.5; }
  .overlay-msg button{ margin-top:.8rem; padding:.6rem 1.2rem; border-radius:999px; border:none; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; font-size:.85rem; }
  .controls-row{ display:flex; gap:.7rem; flex-wrap:wrap; margin-top:.9rem; }
  .controls-row button{ flex:1; min-width:130px; padding:.65rem 1rem; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-weight:700; font-size:.85rem; cursor:pointer; }
  .controls-row button.primary{ background:var(--accent); color:#fff; border-color:transparent; }
  a#snapLink{ display:none; }

  .toast{
    position:fixed; left:50%; bottom:1.4rem; transform:translateX(-50%) translateY(120%);
    background:var(--ink); color:var(--bg); padding:.75rem 1.2rem; border-radius:999px; font-size:.85rem; font-weight:600;
    transition:transform .25s ease; z-index:50; white-space:nowrap;
  }
  .toast.show{ transform:translateX(-50%) translateY(0); }
</style>
</head>

          <button data-angle="vrij">Vrij</button>

<!-- Import map: OrbitControls.js (loaded below) imports three.js via the
     bare specifier "three", which the browser can only resolve through a
     map like this — without it the module script fails on its very first
     import, before any app code runs. Must appear before the module script. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
import { RoomEnvironment } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/environments/RoomEnvironment.js';

/* ======================================================================
   MASTER MEASUREMENT + STANDARD HINGE INTERFACE
   1 three.js unit = 1mm. Every montuur and every pootje is generated
   against this one shared hinge point (HINGE) — not its own, independently
   guessed, attachment spot — so any montuur can take any pootje with no
   gaps, overlap, floating parts or mismatched angles. This is the
   "STANDAARD SCHARNIER" the brief asks for: build it once, build every
   part against it, never per-combination.
   ====================================================================== */
const HINGE = Object.freeze({
  x: 70,   // mm from center-front — half of a realistic ~140mm frame width
  y: 6,    // mm above the lens's own vertical center (hinges sit high)
  z: 1.5,  // mm back from the rim's front face
});
const TEMPLE_LENGTH_MM = 140; // realistic adult temple length (135–145mm brief)

/* ---------- configuration data ----------
   Every montuur/pootje here is a real parametric 3D shape in millimeters,
   not a photo — so scale is physically meaningful now and the same model
   can later drive an AR try-on without being rebuilt. These numbers are
   not just visually estimated: assets/*.jpg were measured with a pixel
   analysis pass (connected-component hole bounding boxes for lens
   width/height ratio, per-column thickness + centerline-slope profiles
   for the pootjes) to calibrate the proportions below, then cross-checked
   against zoomed crops of the same photos. See the shape-building
   functions for how each field maps back to what's visible. */
const MONTUREN = [
  // Dodoma (green-voor.jpg): thin wire metal frame. Measured inner-lens
  // hole aspect ratio (pixel bbox of the enclosed lens opening) is
  // ≈1.16:1 (462x399px) — rounder than the previous 1.27:1 guess, hence
  // the taller lensHeight below. Soft, slightly-angular round shape with
  // a flatter brow and a fuller lower edge (chinFullness).
  { id:1, label:'Dodoma', price:45, shape:'round', finish:'metal',
    lensWidth:50, lensHeight:45, bridgeWidth:20, rimBorder:1.5, rimDepth:2.6,
    roundness:2.5, browFlatten:0.14, chinFullness:0.07 },
  // Kuala Lumpur (tortoise-voor.jpg): thick acetate, soft square lens.
  // Measured inner-lens aspect ratio ≈1.31:1 (454x348px) — more elongated
  // than the previous 1.20:1 guess, hence wider/shorter below. Higher
  // roundness exponent = flatter sides with gently rounded corners,
  // matching the zoomed crop's fairly rectangular silhouette.
  { id:3, label:'Kuala Lumpur', price:45, shape:'square', finish:'acetate',
    lensWidth:52, lensHeight:42, bridgeWidth:17, rimBorder:4.8, rimDepth:6.2,
    roundness:5.2, browFlatten:0, chinFullness:0 },
];
function getMontuur(id){ return MONTUREN.find(m=>m.id===id); }

const POOTJES = [
  // Dodoma (green-pootje.jpg / green-zij-montuur.jpg): thin flat metal
  // temple, essentially straight for most of its length. A per-column
  // centerline-slope measurement of the photo confirms the bend genuinely
  // starts late (slope only breaks from its ~0.08 baseline past roughly
  // 80% of the length) and the total vertical drop implied by the photo
  // (~16mm) matches bendAmount+the baseline slope almost exactly — no
  // taper: the wire reads the same width along the whole arm.
  { id:'A', label:'Dodoma', price:0, style:'thin',
    thickness:2.0, tipThickness:2.0, width:2.7, flare:1.5,
    bendStart:0.83, bendAmount:15, bendPower:2.3 },
  // Kuala Lumpur (tortoise-pootje.jpg): thick acetate at the hinge,
  // tapering down to a thinner tip. The same slope measurement shows this
  // one's bend breaking from baseline much earlier (~45-55% along the
  // length) — a long comfort curve, not a late hook — confirming the
  // early bendStart; the taper ratio was moderated after measuring the
  // photo's actual width profile (perspective foreshortening on the
  // curved back half of that photo exaggerates taper if read literally).
  { id:'C', label:'Kuala Lumpur', price:0, style:'bold',
    thickness:4.2, tipThickness:2.0, width:5.6, flare:2.5,
    bendStart:0.52, bendAmount:12, bendPower:1.3 },
];
function getPootje(id){ return POOTJES.find(p=>p.id===id); }

const MATERIALEN = [
  { id:'parelwit',   label:'Parelwit',   price:10, hex:'#F2EEE6' },
  { id:'transparant',label:'Transparant',price:10, hex:'#E4E2D9' },
  { id:'perzik',     label:'Perzik',     price:10, hex:'#F0B18A' },
  { id:'luchtblauw', label:'Luchtblauw', price:10, hex:'#A9CBDF' },
  { id:'schildpad',  label:'Schildpad',  price:10, hex:'#8B5A34' },
  { id:'antraciet',  label:'Antraciet',  price:10, hex:'#3A3A3A' },
  { id:'bosgroen',   label:'Bosgroen',   price:10, hex:'#33503A' },
  { id:'nachtblauw', label:'Nachtblauw', price:10, hex:'#16283D' },
];
function getMateriaal(id){ return MATERIALEN.find(m=>m.id===id); }

let state = {
  montuur: 1,
  pootje: 'A',
  materiaal: 'nachtblauw',
  light: 'studio',
  angle: 'voor',
};

/* ---------- simple vector glasses (unchanged) — used only for the live
   webcam try-on overlay below, which draws on a flat 2D video frame and
   has nothing to do with the 3D studio preview. ---------- */
function drawGlassesFront(ctx, cx, cy, unitScale, color){
  ctx.save(); ctx.translate(cx, cy); ctx.scale(unitScale, unitScale);
  const lensW=58, lensH=40, rimW=9, gap=20, r=8;
  ctx.lineJoin='round'; ctx.fillStyle=color; ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.lineWidth=1;
  function rr(x,y,w,h,rad){
    ctx.beginPath(); ctx.moveTo(x+rad,y); ctx.arcTo(x+w,y,x+w,y+h,rad); ctx.arcTo(x+w,y+h,x,y+h,rad);
    ctx.arcTo(x,y+h,x,y,rad); ctx.arcTo(x,y,x+w,y,rad); ctx.closePath();
  }
  [-1,1].forEach(side=>{
    const x = side===-1 ? -(gap/2+lensW) : gap/2, y = -lensH/2;
    rr(x-rimW/2, y-rimW/2, lensW+rimW, lensH+rimW, r+rimW/2); ctx.fill(); ctx.stroke();
    ctx.save(); rr(x,y,lensW,lensH,r); ctx.clip();
    ctx.fillStyle='rgba(255,255,255,0.08)'; ctx.fillRect(x,y,lensW,lensH); ctx.restore();
    const armX = side===-1 ? x-rimW/2 : x+lensW+rimW/2;
    ctx.beginPath(); ctx.moveTo(armX,0); ctx.lineTo(armX+side*26,-4);
    ctx.lineWidth=rimW*0.7; ctx.strokeStyle=color; ctx.lineCap='round'; ctx.stroke();
  });
  ctx.fillStyle=color; rr(-gap/2, -lensH/2+6, gap, 9, 4); ctx.fill();
  ctx.restore();
}

/* ======================================================================
   PARAMETRIC 3D GEOMETRY — frame + temples, built in real millimeters
   against the shared HINGE point above. Nothing here is a photo or a
   flat sprite: every part is real extruded/tubed 3D geometry, so it can
   be viewed, lit and rotated from any angle, and reused as-is for a
   future AR try-on. ====================================================================== */
// lens outline as a superellipse (|x/a|^n + |y/b|^n = 1), traced
// specifically to match each montuur's reference photo rather than a
// generic rounded rectangle: a low `n` (Dodoma, ~2.3) gives the soft,
// slightly-angular round shape in green-voor.jpg; a high `n` (Kuala
// Lumpur, ~4.6) gives the flatter-sided soft square in tortoise-voor.jpg.
// `browFlatten` compresses the upper half toward a straighter brow line,
// `chinFullness` expands the lower half slightly for a fuller bottom edge
// — both visible in Dodoma's photo (flatter brow, rounder chin) but not
// something a pure (symmetric) superellipse produces on its own.
function lensOutlineShape(w, h, n, browFlatten, chinFullness){
  const segments = 72;
  const a = w/2, b = h/2;
  const s = new THREE.Shape();
  for(let i=0;i<=segments;i++){
    const t = (i/segments)*Math.PI*2;
    const ct = Math.cos(t), st = Math.sin(t);
    const x = Math.sign(ct) * Math.pow(Math.abs(ct), 2/n) * a;
    let y = Math.sign(st) * Math.pow(Math.abs(st), 2/n) * b;
    if(browFlatten && st > 0) y *= (1 - browFlatten);
    if(chinFullness && st < 0) y *= (1 + chinFullness);
    if(i===0) s.moveTo(x,y); else s.lineTo(x,y);
  }
  s.closePath();
  return s;
}

// one lens rim (a ring: outer lens outline minus a slightly smaller inner
// outline, extruded front-to-back) — symmetric about its own local origin,
// so the left lens is just a mirrored *position*, never a mirrored mesh.
function buildLensRimGeometry(montuur){
  const { lensWidth:w, lensHeight:h, rimBorder:b, rimDepth:d, roundness:n, browFlatten:bf, chinFullness:cf } = montuur;
  const outer = lensOutlineShape(w, h, n, bf, cf);
  const inner = lensOutlineShape(Math.max(2,w-b*2), Math.max(2,h-b*2), n, bf, cf);
  outer.holes.push(inner);
  const geo = new THREE.ExtrudeGeometry(outer, {
    depth:d, bevelEnabled:true, bevelThickness:0.35, bevelSize:0.3, bevelSegments:2, curveSegments:20,
  });
  geo.translate(0, 0, -d/2);
  return geo;
}

// the actual lens glass filling the rim's inner opening — exactly the rim's
// own inner contour (so there's no gap/overlap between glass and rim),
// extruded thin and centered in the rim's own depth. Always clear optical
// glass: the materiaal picker colors the frame, never the lens itself.
function buildLensGlassGeometry(montuur){
  const { lensWidth:w, lensHeight:h, rimBorder:b, roundness:n, browFlatten:bf, chinFullness:cf } = montuur;
  const innerW = Math.max(2, w-b*2), innerH = Math.max(2, h-b*2);
  const shape = lensOutlineShape(innerW, innerH, n, bf, cf);
  const geo = new THREE.ExtrudeGeometry(shape, { depth:0.9, bevelEnabled:false, curveSegments:20 });
  geo.translate(0, 0, -0.45);
  return geo;
}

// bridge: a short arched tube between the two lenses' inner-top edges
function buildBridgeGeometry(montuur){
  const halfB = montuur.bridgeWidth/2;
  const topY = montuur.lensHeight/2 - montuur.rimBorder - 3;
  const curve = new THREE.QuadraticBezierCurve3(
    new THREE.Vector3(-halfB, topY, 0),
    new THREE.Vector3(0, topY+3.2, 0),
    new THREE.Vector3(halfB, topY, 0),
  );
  return new THREE.TubeGeometry(curve, 12, Math.max(0.9, montuur.rimBorder*0.5), 8, false);
}

// hinge stub: carries the rim's outer edge out to the STANDARD hinge X —
// the literal, physical connector every pootje plugs into, built from the
// same shared HINGE constants rather than anything montuur-specific.
function buildHingeStubGeometry(montuur){
  const lensEdgeX = montuur.bridgeWidth/2 + montuur.lensWidth;
  const len = Math.max(1.5, (HINGE.x + 1.2) - lensEdgeX);
  // z-depth must reach past HINGE.z (where every temple's local origin sits)
  // with real overlap, not just up to the rim's own front-to-back depth —
  // otherwise a thin montuur (small rimDepth) can leave a sub-mm gap at the
  // exact point the temple attaches, however good it looks at other angles.
  const zDepth = Math.max(montuur.rimDepth*0.85, (HINGE.z + 2.5)*2);
  const geo = new THREE.BoxGeometry(len, Math.max(2.2, montuur.rimBorder*1.7), zDepth);
  geo.translate(lensEdgeX + len/2, HINGE.y, 0);
  return geo;
}

// a tube with a *varying* radius along its length (three.js' own
// TubeGeometry only supports a constant radius) — needed to reconstruct
// Kuala Lumpur's pootje, which tapers from thick acetate at the hinge to a
// thin cable-like tip in tortoise-pootje.jpg. Mirrors TubeGeometry's own
// construction (Frenet frames around the curve), just with radiusFn(t)
// instead of one fixed radius.
function buildTaperedTubeGeometry(curve, segments, radialSegments, radiusFn){
  const frames = curve.computeFrenetFrames(segments, false);
  const pathPoints = curve.getSpacedPoints(segments);
  const positions = [], normals = [], indices = [];
  for(let i=0;i<=segments;i++){
    const r = radiusFn(i/segments);
    const N = frames.normals[i], B = frames.binormals[i], P = pathPoints[i];
    for(let j=0;j<=radialSegments;j++){
      const v = (j/radialSegments) * Math.PI*2;
      const sin = Math.sin(v), cos = -Math.cos(v);
      const nx = cos*N.x + sin*B.x, ny = cos*N.y + sin*B.y, nz = cos*N.z + sin*B.z;
      positions.push(P.x + r*nx, P.y + r*ny, P.z + r*nz);
      normals.push(nx, ny, nz);
    }
  }
  for(let i=0;i<segments;i++){
    for(let j=0;j<radialSegments;j++){
      const a = (radialSegments+1)*i + j, b = (radialSegments+1)*(i+1) + j;
      const c = (radialSegments+1)*(i+1) + (j+1), d = (radialSegments+1)*i + (j+1);
      indices.push(a,b,d, b,c,d);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setIndex(indices);
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
  return geo;
}

// pootje (temple arm): starts exactly at local origin (the hinge pivot),
// runs backward (-Z) with an outward flare and a downward comfort bend —
// generated directly mirrored by `side` (1=right, -1=left) so normals are
// never flipped via negative scale. Every shape parameter (flare, where
// the bend starts, how sharp it is, how much the radius tapers) comes from
// the pootje's own config, tuned per reference photo rather than shared
// defaults — see the POOTJES array above for what each value reconstructs.
function buildTempleGeometry(pootje, side){
  const L = TEMPLE_LENGTH_MM;
  const segs = 48, bendStart = pootje.bendStart;
  const pts = [];
  for(let i=0;i<=segs;i++){
    const f = i/segs;
    const z = -f*L;
    const x = side * f*pootje.flare;
    let y = -f*1.2; // gentle overall downward slope
    if(f > bendStart){
      const bf = (f-bendStart)/(1-bendStart);
      y -= Math.pow(bf, pootje.bendPower) * pootje.bendAmount; // comfort bend behind the ear
    }
    pts.push(new THREE.Vector3(x,y,z));
  }
  const curve = new THREE.CatmullRomCurve3(pts);
  const radiusFn = t => THREE.MathUtils.lerp(pootje.thickness/2, pootje.tipThickness/2, Math.min(1, t/0.9));
  const geo = buildTaperedTubeGeometry(curve, 56, 10, radiusFn);
  if(pootje.width > pootje.thickness){
    geo.scale(pootje.width/pootje.thickness, 1, 1); // flatten into an oval cross-section
  }
  return geo;
}

// assemble one full pair of glasses: montuur + pootje, combined dynamically
// (never a pre-made per-combination model) and attached purely through HINGE
function buildGlassesGroup(montuur, pootje, material, lensMaterial){
  const group = new THREE.Group();
  const rimGeo = buildLensRimGeometry(montuur);
  const lensGeo = buildLensGlassGeometry(montuur);
  const bridgeGeo = buildBridgeGeometry(montuur);
  const stubGeo = buildHingeStubGeometry(montuur);
  const templeGeoR = buildTempleGeometry(pootje, 1);
  const templeGeoL = buildTempleGeometry(pootje, -1);

  const lensX = montuur.bridgeWidth/2 + montuur.lensWidth/2;
  [1,-1].forEach(side=>{
    const rim = new THREE.Mesh(rimGeo, material);
    rim.position.x = side*lensX;
    group.add(rim);

    const lens = new THREE.Mesh(lensGeo, lensMaterial);
    lens.position.x = side*lensX;
    group.add(lens);

    const stub = new THREE.Mesh(stubGeo, material);
    stub.position.x = 0; // geometry already baked to the right-side X; mirror via scale for the box only (box is symmetric front/back so this is safe)
    stub.scale.x = side;
    group.add(stub);

    const temple = new THREE.Mesh(side===1 ? templeGeoR : templeGeoL, material);
    temple.position.set(side*HINGE.x, HINGE.y, HINGE.z);
    group.add(temple);
  });
  group.add(new THREE.Mesh(bridgeGeo, material));
  return group;
}
function disposeGroup(group){
  group.traverse(obj=>{ if(obj.geometry) obj.geometry.dispose(); });
}

/* ======================================================================
   SCENE, CAMERA, LIGHTS, CONTROLS
   ====================================================================== */
const canvas3d = document.getElementById('previewCanvas3d');
const renderer = new THREE.WebGLRenderer({ canvas:canvas3d, antialias:true, alpha:true, preserveDrawingBuffer:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
if('outputColorSpace' in renderer) renderer.outputColorSpace = THREE.SRGBColorSpace;
// filmic tone mapping = the difference between "flat CG preview" and a
// premium product-shot look — it's what keeps the metal highlights and
// the acetate clearcoat from blowing out to solid white.
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 1, 2000);
const BASE_DIST = 230;
camera.position.set(0, 6, BASE_DIST);

// soft, neutral studio reflections (not a visible background — the CSS
// gradient behind the transparent canvas still provides that) so metal
// and acetate finishes get real environment highlights instead of flat
// directional-light dots.
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 120;
controls.maxDistance = 420;
controls.minPolarAngle = Math.PI*0.25;
controls.maxPolarAngle = Math.PI*0.75;
controls.target.set(0,0,0);
controls.update();

// lights are deliberately lighter than before now that scene.environment
// (below) provides realistic ambient/specular fill on its own — stacking
// full-strength directional lights on top of an env map is what causes the
// washed-out, overexposed look PBR renders are prone to.
const hemi = new THREE.HemisphereLight(0xffffff, 0x8a8370, 0.45);
scene.add(hemi);
const keyLight = new THREE.DirectionalLight(0xffffff, 0.65);
keyLight.position.set(120,180,220);
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0xffffff, 0.28);
fillLight.position.set(-150,80,-120);
scene.add(fillLight);
const rimLight = new THREE.DirectionalLight(0xffffff, 0.3);
rimLight.position.set(0,-60,-200);
scene.add(rimLight);

const sharedMaterial = new THREE.MeshPhysicalMaterial({
  color:0x16283D, roughness:0.4, metalness:0.15, clearcoat:0.3, clearcoatRoughness:0.25,
  envMapIntensity:1,
  side: THREE.DoubleSide, // the hinge stub is mirrored via negative scale for the left side,
                           // which flips triangle winding — DoubleSide keeps it visible/lit correctly
});

// the lens glass is always clear optical glass — the materiaal picker colors
// the frame, never the lens — so it gets its own permanent material instead
// of reusing sharedMaterial. `transmission` is real see-through refraction
// (needs scene.environment, already set above, to have anything to refract).
const lensMaterial = new THREE.MeshPhysicalMaterial({
  color:0xffffff, roughness:0.04, transmission:1, ior:1.5, thickness:0.6,
  envMapIntensity:1.1, side: THREE.DoubleSide,
});

// procedural tortoiseshell pattern for the "Schildpad" materiaal — mottled
// amber/dark blotches on a canvas texture, generated once and reused, so
// that material reads as a real acetate pattern instead of a flat brown.
let tortoiseTexture = null;
function getTortoiseTexture(){
  if(tortoiseTexture) return tortoiseTexture;
  const size = 256;
  const c = document.createElement('canvas'); c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#9a6a3a'; ctx.fillRect(0,0,size,size);
  for(let i=0;i<220;i++){
    const x = Math.random()*size, y = Math.random()*size, r = 3+Math.random()*16;
    ctx.fillStyle = Math.random()<0.55 ? 'rgba(35,20,10,0.55)' : 'rgba(224,175,110,0.4)';
    ctx.beginPath();
    ctx.ellipse(x, y, r, r*(0.5+Math.random()*0.4), Math.random()*Math.PI, 0, Math.PI*2);
    ctx.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  if('colorSpace' in tex) tex.colorSpace = THREE.SRGBColorSpace;
  tortoiseTexture = tex;
  return tex;
}

// soft contact shadow: a transparent disc with a radial-gradient alpha
// texture sitting just under the glasses — the classic cheap-but-effective
// stand-in for real ground shadows, grounds the product instead of letting
// it float against the stage background.
function buildContactShadowTexture(){
  const size = 256;
  const c = document.createElement('canvas'); c.width = c.height = size;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(size/2,size/2,0, size/2,size/2,size/2);
  g.addColorStop(0, 'rgba(0,0,0,0.38)');
  g.addColorStop(0.7, 'rgba(0,0,0,0.14)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,size,size);
  const tex = new THREE.CanvasTexture(c);
  if('colorSpace' in tex) tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const shadowMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(1,1),
  new THREE.MeshBasicMaterial({ map:buildContactShadowTexture(), transparent:true, depthWrite:false }),
);
shadowMesh.rotation.x = -Math.PI/2;
scene.add(shadowMesh);

let glassesGroup = null;
function rebuildGlasses(){
  if(glassesGroup){ scene.remove(glassesGroup); disposeGroup(glassesGroup); }
  const montuur = getMontuur(state.montuur);
  const pootje = getPootje(state.pootje);
  const mat = getMateriaal(state.materiaal);
  const isTortoise = mat.id === 'schildpad';
  const isTransparent = mat.id === 'transparant';

  // tortoiseshell uses a texture map (so its color comes from the map, not
  // the base color — tint it white so the map reads true); every other
  // materiaal is a flat color with no map.
  sharedMaterial.map = isTortoise ? getTortoiseTexture() : null;
  sharedMaterial.color.set(isTortoise ? 0xffffff : mat.hex);
  sharedMaterial.transmission = isTransparent ? 0.85 : 0;
  sharedMaterial.transparent = isTransparent;
  sharedMaterial.thickness = isTransparent ? 1.5 : 0;
  sharedMaterial.roughness = montuur.finish==='metal' ? 0.25 : (isTransparent ? 0.12 : 0.42);
  sharedMaterial.metalness = montuur.finish==='metal' ? 0.65 : 0.04;
  sharedMaterial.clearcoat = montuur.finish==='metal' ? 0.25 : 0.55;
  sharedMaterial.clearcoatRoughness = montuur.finish==='metal' ? 0.15 : 0.22;
  sharedMaterial.envMapIntensity = montuur.finish==='metal' ? 1.3 : 0.8;
  sharedMaterial.needsUpdate = true;
  glassesGroup = buildGlassesGroup(montuur, pootje, sharedMaterial, lensMaterial);
  scene.add(glassesGroup);

  // size/position the shadow disc to the actual frame width so it reads as
  // one footprint under the glasses rather than a fixed decal
  const footprintW = HINGE.x*2*0.78;
  shadowMesh.scale.set(footprintW, footprintW*0.4, 1);
  shadowMesh.position.set(0, -montuur.lensHeight/2 - 7, -TEMPLE_LENGTH_MM*0.1);
}

function resizeRenderer(){
  const rect = canvas3d.getBoundingClientRect();
  const w = Math.max(1, Math.round(rect.width)), h = Math.max(1, Math.round(rect.height));
  renderer.setSize(w, h, false);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resizeRenderer).observe(canvas3d);
resizeRenderer();

(function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
})();

/* ---------- Voor / Zij / Vrij camera presets ---------- */
const dragHint = document.getElementById('dragHint');
function setAngleButton(name){
  document.querySelectorAll('#angleToggle button').forEach(b=>b.classList.toggle('active', b.dataset.angle===name));
}
function setView(name){
  state.angle = name;
  setAngleButton(name);
  if(name==='vrij') return;
  const dist = camera.position.distanceTo(controls.target) || BASE_DIST;
  const theta = name==='voor' ? 0 : Math.PI/2; // azimuth: 0=front, 90°=true side
  const spherical = new THREE.Spherical(dist, Math.PI/2, theta);
  camera.position.setFromSpherical(spherical).add(controls.target);
  controls.update();
}
document.getElementById('angleToggle').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-angle]'); if(!btn) return;
  setView(btn.dataset.angle);
});
controls.addEventListener('start', ()=>{
  setAngleButton('vrij'); state.angle = 'vrij';
  dragHint.classList.add('faded');
});

/* ---------- zoom slider (mirrors scroll/pinch zoom via camera distance) ---------- */
const zoomRangeEl = document.getElementById('zoomRange');
let syncingZoom = false;
zoomRangeEl.addEventListener('input', ()=>{
  const v = Number(zoomRangeEl.value);
  const dist = THREE.MathUtils.clamp(BASE_DIST*100/v, controls.minDistance, controls.maxDistance);
  const dir = camera.position.clone().sub(controls.target).normalize();
  syncingZoom = true;
  camera.position.copy(controls.target).addScaledVector(dir, dist);
  controls.update();
  syncingZoom = false;
});
controls.addEventListener('change', ()=>{
  if(syncingZoom) return;
  const dist = camera.position.distanceTo(controls.target);
  zoomRangeEl.value = THREE.MathUtils.clamp(Math.round(BASE_DIST*100/dist), 60, 180);
});

/* ---------- price + ref code + scene rebuild ---------- */
function refresh(){
  const total = MONTUREN.find(m=>m.id===state.montuur).price
              + POOTJES.find(p=>p.id===state.pootje).price
              + getMateriaal(state.materiaal).price;
  document.getElementById('totalPrice').textContent = '€' + total;

  const matCode = state.materiaal.slice(0,2).toUpperCase();
  document.getElementById('refCode').textContent = `Ref EW-${state.montuur}${state.pootje}-${matCode}VR00`;

  rebuildGlasses();
  const bgVar = state.light === 'studio' ? '--stage-studio' : state.light === 'daylight' ? '--stage-daylight' : '--stage-pearl';
  const bg = getComputedStyle(document.documentElement).getPropertyValue(bgVar);
  document.getElementById('previewStage').style.background =
    `linear-gradient(180deg, ${bg}, color-mix(in srgb, ${bg} 70%, var(--olive)))`;

  renderOptions();
  syncLiveColor();
}

/* ---------- option rows: Montuur / Pootjes / Materiaal, all visible at once ---------- */
function renderRow(listId, items, selectedId, isColor, onPick){
  const list = document.getElementById(listId);
  list.innerHTML = '';
  items.forEach(item=>{
    const chip = document.createElement('div');
    chip.className = 'wheel-chip' + (item.id===selectedId ? ' selected' : '');

    const thumb = document.createElement('div');
    thumb.className = 'wheel-thumb' + (isColor ? ' swatch-dot' : '');
    if(isColor){
      thumb.style.background = item.hex;
    } else if(item.shape){
      thumb.innerHTML = montuurIcon(item.shape);
    } else if(item.style){
      thumb.innerHTML = pootjeIcon(item.style);
    }
    chip.appendChild(thumb);

    const label = document.createElement('div'); label.className='wheel-label'; label.textContent = item.label;
    const price = document.createElement('div'); price.className='wheel-price';
    price.textContent = item.price > 0 ? `+€${item.price}` : 'incl.';
    chip.appendChild(label); chip.appendChild(price);

    chip.onclick = ()=>{ onPick(item.id); refresh(); };
    list.appendChild(chip);
  });
}

function renderOptions(){
  renderRow('montuurRow', MONTUREN, state.montuur, false, id=>{ state.montuur = id; });
  renderRow('pootjesRow', POOTJES, state.pootje, false, id=>{ state.pootje = id; });
  renderRow('materiaalRow', MATERIALEN, state.materiaal, true, id=>{ state.materiaal = id; });
}

document.getElementById('tryOnBtn').addEventListener('click', openTryOn);

/* ---------- live camera AR (uses configurator's material color) ---------- */
const video = document.getElementById('video');
const liveCanvas = document.getElementById('liveCanvas');
const lctx = liveCanvas.getContext('2d');
const startMsg = document.getElementById('startMsg');
const startBtn = document.getElementById('startBtn');
const snapBtn = document.getElementById('snapBtn');
const snapLink = document.getElementById('snapLink');
const switchCamBtn = document.getElementById('switchCamBtn');

let currentStream = null, facingMode = 'user', faceMesh = null, running = false, lastLandmarks = null, busy = false;

function syncLiveColor(){ /* color read live from state.materiaal at draw time, nothing to precompute */ }

function resizeLiveCanvas(){
  const rect = video.getBoundingClientRect();
  liveCanvas.width = rect.width; liveCanvas.height = rect.height;
}
window.addEventListener('resize', resizeLiveCanvas);

async function startCamera(){
  try{
    if(currentStream){ currentStream.getTracks().forEach(t=>t.stop()); }
    currentStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode, width:{ideal:640}, height:{ideal:480} }, audio:false });
    video.srcObject = currentStream;
    await video.play();
    resizeLiveCanvas();
    startMsg.style.display = 'none';
    if(!faceMesh) initFaceMesh();
    if(!running){ running = true; requestAnimationFrame(loop); }
  }catch(err){
    startMsg.innerHTML = '<div>Kon geen toegang krijgen tot de camera.<br><span style="opacity:.8;font-size:.8em;">'+ (err.message||err) +'</span></div>';
    startMsg.style.display = 'flex';
  }
}
startBtn.addEventListener('click', startCamera);
switchCamBtn.addEventListener('click', ()=>{
  facingMode = facingMode==='user' ? 'environment' : 'user';
  video.style.transform = facingMode==='user' ? 'scaleX(-1)' : 'none';
  startCamera();
});

function initFaceMesh(){
  faceMesh = new FaceMesh({ locateFile:(f)=> `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}` });
  faceMesh.setOptions({ maxNumFaces:1, refineLandmarks:true, minDetectionConfidence:0.6, minTrackingConfidence:0.6 });
  faceMesh.onResults(res=>{ lastLandmarks = (res.multiFaceLandmarks && res.multiFaceLandmarks[0]) || null; });
}

async function loop(){
  if(!running) return;
  if(video.readyState >= 2 && faceMesh && !busy){
    busy = true;
    try{ await faceMesh.send({ image: video }); } catch(e){}
    busy = false;
  }
  drawLive();
  requestAnimationFrame(loop);
}

function drawLive(){
  const w = liveCanvas.width, h = liveCanvas.height;
  lctx.clearRect(0,0,w,h);
  if(!lastLandmarks) return;
  const toXY = (idx)=>{ const p = lastLandmarks[idx]; return { x: p.x*w, y: p.y*h }; };
  const leftOuter = toXY(33), rightOuter = toXY(263);
  const mirrored = facingMode === 'user';
  const mx = (x)=> mirrored ? (w-x) : x;
  const p1 = { x: mx(leftOuter.x), y: leftOuter.y };
  const p2 = { x: mx(rightOuter.x), y: rightOuter.y };
  const dx = p2.x-p1.x, dy = p2.y-p1.y;
  const eyeDist = Math.hypot(dx,dy);
  const angle = Math.atan2(dy,dx);
  const cx = (p1.x+p2.x)/2, cy = (p1.y+p2.y)/2 + eyeDist*0.03;
  lctx.save(); lctx.translate(cx,cy); lctx.rotate(angle); lctx.translate(-cx,-cy);
  drawGlassesFront(lctx, cx, cy, eyeDist/100, getMateriaal(state.materiaal).hex);
  lctx.restore();
}

snapBtn.addEventListener('click', ()=>{
  const out = document.createElement('canvas');
  out.width = liveCanvas.width; out.height = liveCanvas.height;
  const octx = out.getContext('2d');
  octx.save();
  if(facingMode==='user'){ octx.translate(out.width,0); octx.scale(-1,1); }
  octx.drawImage(video, 0, 0, out.width, out.height);
  octx.restore();
  octx.drawImage(liveCanvas, 0, 0);
  snapLink.href = out.toDataURL('image/png');
  snapLink.click();
});

refresh();
</script>
