<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>EveryWear</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdfbf7; --surface:#ffffff; --ink:#4a4238; --muted:#948a7a; --line:rgba(74,66,56,.10);
    --accent:#d97c4f; --accent-strong:#c1663b; --olive:#8a9878; --navy:#7192a3; --ochre:#e0b46a;
    --stage-studio:#f1eee6; --stage-daylight:#fdf7ea; --stage-pearl:#faf3f0;
    --f-display:'Fraunces', Georgia, serif;
    --f-body:'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  *{box-sizing:border-box;}
  html, body{ height:100%; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--f-body); display:flex; flex-direction:column; overflow:hidden; }
  img{max-width:100%;}
  a{ color:inherit; }
  [hidden]{ display:none !important; }
  .shell{ max-width:1520px; margin:0 auto; padding-inline:1.6rem; width:100%; }
  button{ font-family:inherit; }

  nav.top{ flex:none; z-index:20; background:var(--bg); border-bottom:1px solid var(--line); }
  nav.top .shell{ display:flex; align-items:center; justify-content:space-between; padding-block:.7rem; gap:1rem; flex-wrap:wrap; }
  .brand-block{ display:flex; align-items:center; gap:.6rem; }
  .brand-icon{
    width:38px; height:38px; border-radius:50%; background:var(--olive); color:#fff;
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .brand-icon svg{ width:19px; height:19px; }
  .brand-name{ font-family:var(--f-display); font-weight:700; font-size:1.1rem; line-height:1.15; }
  .brand-sub{ font-size:.66rem; font-weight:700; letter-spacing:.08em; color:var(--muted); text-transform:uppercase; }

  .nav-right{ display:flex; align-items:center; gap:1.3rem; flex-wrap:wrap; }
  .meta-block{ text-align:right; line-height:1.2; }
  .meta-label{ font-size:.62rem; font-weight:700; letter-spacing:.08em; color:var(--muted); text-transform:uppercase; }
  .meta-value{ font-family:ui-monospace,monospace; font-size:.78rem; color:var(--ink); }
  .meta-value.total{ font-family:var(--f-display); font-weight:700; font-size:1.15rem; }

  .btn-outline, .btn-solid{
    font-family:var(--f-body); font-size:.72rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    padding:.6rem 1.1rem; border-radius:999px; cursor:pointer; white-space:nowrap;
    display:inline-flex; align-items:center; gap:.4rem;
  }
  .btn-outline{ border:1px solid var(--line); background:transparent; color:var(--ink); }
  .btn-outline:hover{ border-color:var(--accent); color:var(--accent); }
  .btn-solid{ border:1px solid var(--olive); background:var(--olive); color:#fff; }
  .btn-solid:hover{ background:#73815f; }

  main{ flex:1; min-height:0; display:flex; flex-direction:column; }

  /* ---- Frame Studio configurator: fills the remaining viewport, no page scroll ---- */
  .studio{ flex:1; min-height:0; display:flex; flex-direction:column; gap:.7rem; padding-block:.8rem; }

  /* -- option rows: Montuur / Pootjes / Materiaal always visible, stacked -- */
  .option-rows{ flex:none; display:flex; flex-direction:column; gap:.5rem; }
  .option-row{
    display:flex; align-items:center; gap:1rem; background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:.55rem .8rem;
  }
  .option-row-label{
    flex:none; width:70px; font-size:.68rem; font-weight:700; letter-spacing:.07em; color:var(--muted); text-transform:uppercase;
  }
  .wheel-row{ flex:1; min-width:0; display:flex; align-items:center; gap:.6rem; overflow-x:auto; scroll-snap-type:x proximity; padding:.15rem; }
  .wheel-chip{
    flex:none; scroll-snap-align:start; display:flex; align-items:center; gap:.55rem; cursor:pointer;
    padding:.4rem .8rem .4rem .4rem; border-radius:999px; border:1px solid var(--line); background:var(--bg);
    transition:border-color .15s, background .15s;
  }
  .wheel-chip:hover{ border-color:var(--accent); }
  .wheel-chip.selected{ border-color:var(--olive); background:color-mix(in srgb, var(--olive) 10%, var(--bg)); }
  .wheel-chip .wheel-thumb{
    width:34px; height:34px; border-radius:50%; background:#fff; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; overflow:hidden; flex:none;
  }
  .wheel-chip .wheel-thumb img{ width:100%; height:100%; object-fit:contain; }
  .wheel-chip .wheel-thumb.swatch-dot{ border-radius:50%; }
  .wheel-chip .wheel-label{ font-size:.78rem; font-weight:600; color:var(--ink); white-space:nowrap; }
  .wheel-chip .wheel-price{ font-size:.68rem; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }

  /* -- preview stage -- */
  .stage-card{
    position:relative; background:linear-gradient(180deg, var(--stage-studio), color-mix(in srgb, var(--stage-studio) 70%, var(--olive)));
    border:1px solid var(--line); border-radius:20px; overflow:hidden; flex:1; min-height:0;
    transition:background .25s;
  }
  .stage-mountains{ position:absolute; left:0; right:0; bottom:0; height:38%; opacity:.5; pointer-events:none; }
  .stage-pair{ position:absolute; inset:0; display:flex; padding:0 3%; }
  .stage-single{ position:relative; flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; }
  .stage-single canvas{ flex:1 1 auto; min-height:0; width:100%; margin-top:auto; cursor:zoom-in; }
  .stage-single .angle-label{
    flex:none; margin:.4rem 0 auto; font-size:.72rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted);
  }
  .stage-single canvas.loupe{
    position:absolute; flex:none; width:160px; height:160px; min-height:160px; margin-top:0;
    border-radius:50%; border:3px solid var(--surface); box-shadow:0 8px 24px rgba(0,0,0,.28);
    pointer-events:none; display:none; z-index:5; background:var(--surface);
  }

  .stage-controls{
    position:absolute; left:50%; bottom:1.1rem; transform:translateX(-50%); z-index:3;
    display:flex; align-items:center; gap:.9rem; background:color-mix(in srgb, var(--surface) 88%, transparent);
    border:1px solid var(--line); border-radius:999px; padding:.4rem .6rem .4rem 1rem; backdrop-filter:blur(6px);
  }
  .zoom-group{ display:flex; align-items:center; gap:.55rem; color:var(--muted); }
  .zoom-group svg{ flex:none; width:16px; height:16px; stroke:var(--muted); }
  .zoom-group input[type=range]{ width:110px; accent-color:var(--olive); cursor:pointer; }
  .pill-group{ display:inline-flex; background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:.2rem; gap:.15rem; }
  .pill-group button{ border:none; background:transparent; padding:.4rem .85rem; border-radius:999px; font-size:.72rem; font-weight:700; letter-spacing:.03em; text-transform:uppercase; cursor:pointer; color:var(--muted); }
  .pill-group button.active{ background:var(--olive); color:#fff; }

  /* ---- live try-on modal ---- */
  .tryon-modal{
    position:fixed; inset:0; z-index:40; background:color-mix(in srgb, var(--ink) 45%, transparent);
    display:flex; align-items:center; justify-content:center; padding:1.2rem;
  }
  .tryon-panel{ background:var(--surface); border-radius:18px; padding:1.3rem; width:100%; max-width:560px; max-height:92vh; overflow-y:auto; }
  .tryon-panel-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:.9rem; }
  .tryon-panel-head h2{ font-family:var(--f-display); font-weight:700; font-size:1.2rem; margin:0; }
  .close-btn{ border:none; background:var(--bg); width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:.9rem; color:var(--ink); }
  .live-stage{ position:relative; width:100%; background:#000; border:1px solid var(--line); border-radius:16px; overflow:hidden; aspect-ratio:4/3; }
  video, canvas#liveCanvas{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  video{ transform:scaleX(-1); }
  .overlay-msg{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; color:#fff; background:rgba(0,0,0,.55); font-size:.9rem; padding:1.5rem; line-height:1.5; }
  .overlay-msg button{ margin-top:.8rem; padding:.6rem 1.2rem; border-radius:999px; border:none; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; font-size:.85rem; }
  .controls-row{ display:flex; gap:.7rem; flex-wrap:wrap; margin-top:.9rem; }
  .controls-row button{ flex:1; min-width:130px; padding:.65rem 1rem; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-weight:700; font-size:.85rem; cursor:pointer; }
  .controls-row button.primary{ background:var(--accent); color:#fff; border-color:transparent; }
  a#snapLink{ display:none; }

  .toast{
    position:fixed; left:50%; bottom:1.4rem; transform:translateX(-50%) translateY(120%);
    background:var(--ink); color:var(--bg); padding:.75rem 1.2rem; border-radius:999px; font-size:.85rem; font-weight:600;
    transition:transform .25s ease; z-index:50; white-space:nowrap;
  }
  .toast.show{ transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<nav class="top">
  <div class="shell">
    <div class="brand-block">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20l6-11 4 7 3-5 5 9z"/></svg>
      </div>
      <div>
        <div class="brand-name">EveryWear</div>
        <div class="brand-sub">Frame Studio · Natuur &amp; Avontuur</div>
      </div>
    </div>
    <div class="nav-right">
      <div class="meta-block">

    <div class="stage-card" id="previewStage">

        </div>

      <div class="stage-controls">
        <div class="zoom-group">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="range" id="zoomRange" min="80" max="160" value="100" aria-label="Zoom">

<div class="tryon-modal" id="tryonModal" hidden>
  <div class="tryon-panel">
    <div class="tryon-panel-head">
      <h2>Probeer je ontwerp op</h2>
      <button class="close-btn" id="closeTryOn" aria-label="Sluiten">✕</button>

    <div class="live-stage" id="stage">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="liveCanvas"></canvas>
      <div class="overlay-msg" id="startMsg">

          <div>Geef toegang tot je camera om de bril te passen.</div>

      <button class="primary" id="snapBtn">Maak foto</button>

    <a id="snapLink" download="everywear-pasfoto.png"></a>

</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
<script>
/* ---------- configuration data (from the real Frame Studio) ---------- */
const MONTUREN = [
  { id:1, label:'Dodoma', price:45, voor:'assets/green-voor.jpg', zij:'assets/green-zij-montuur.jpg', hingeFrac:0.440 },
  { id:2, label:'Wellington', price:45, voor:'assets/champagne-voor.jpg', zij:'assets/champagne-zij-montuur.jpg', hingeFrac:0.112 },
  { id:3, label:'Kuala Lumpur', price:45, voor:'assets/tortoise-voor.jpg', zij:'assets/tortoise-zij-montuur.jpg', hingeFrac:0.280 },
];
function getMontuur(id){ return MONTUREN.find(m=>m.id===id); }
const montuurImgCache = {};
function loadMontuurImage(src){
  if(montuurImgCache[src]) return montuurImgCache[src];
  const img = new Image();
  img.src = src;
  montuurImgCache[src] = img;
  return img;
}
const POOTJES = [
  { id:'A', label:'Dodoma', price:0, voor:'assets/green-pootje.jpg', img:'assets/green-pootje.jpg', hingeFrac:0.204 },
  { id:'B', label:'Wellington', price:0, voor:'assets/champagne-pootje.jpg', img:'assets/champagne-pootje.jpg', hingeFrac:0.686 },
  { id:'C', label:'Kuala Lumpur', price:0, voor:'assets/tortoise-pootje.jpg', img:'assets/tortoise-pootje.jpg', hingeFrac:0.268 },
];
const MATERIALEN = [
  { id:'parelwit',   label:'Parelwit',   price:10, hex:'#F2EEE6' },
  { id:'transparant',label:'Transparant',price:10, hex:'#E4E2D9' },
  { id:'perzik',     label:'Perzik',     price:10, hex:'#F0B18A' },
  { id:'luchtblauw', label:'Luchtblauw', price:10, hex:'#A9CBDF' },
  { id:'schildpad',  label:'Schildpad',  price:10, hex:'#8B5A34' },
  { id:'antraciet',  label:'Antraciet',  price:10, hex:'#3A3A3A' },
  { id:'bosgroen',   label:'Bosgroen',   price:10, hex:'#33503A' },
  { id:'nachtblauw', label:'Nachtblauw', price:10, hex:'#16283D' },
];

let state = {
  montuur: 1,
  pootje: 'A',
  materiaal: 'nachtblauw',
  view: 'voor',
  light: 'studio',
};

function getMateriaal(id){ return MATERIALEN.find(m=>m.id===id); }

/* ---------- glasses drawing (shared front/side) ---------- */
function drawGlassesFront(ctx, cx, cy, unitScale, color){
  ctx.save(); ctx.translate(cx, cy); ctx.scale(unitScale, unitScale);
  const lensW=58, lensH=40, rimW=9, gap=20, r=8;
  ctx.lineJoin='round'; ctx.fillStyle=color; ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.lineWidth=1;
  function rr(x,y,w,h,rad){
    ctx.beginPath(); ctx.moveTo(x+rad,y); ctx.arcTo(x+w,y,x+w,y+h,rad); ctx.arcTo(x+w,y+h,x,y+h,rad);
    ctx.arcTo(x,y+h,x,y,rad); ctx.arcTo(x,y,x+w,y,rad); ctx.closePath();
  }
  [-1,1].forEach(side=>{
    const x = side===-1 ? -(gap/2+lensW) : gap/2, y = -lensH/2;
    rr(x-rimW/2, y-rimW/2, lensW+rimW, lensH+rimW, r+rimW/2); ctx.fill(); ctx.stroke();
    ctx.save(); rr(x,y,lensW,lensH,r); ctx.clip();
    ctx.fillStyle='rgba(255,255,255,0.08)'; ctx.fillRect(x,y,lensW,lensH); ctx.restore();
    const armX = side===-1 ? x-rimW/2 : x+lensW+rimW/2;
    ctx.beginPath(); ctx.moveTo(armX,0); ctx.lineTo(armX+side*26,-4);
    ctx.lineWidth=rimW*0.7; ctx.strokeStyle=color; ctx.lineCap='round'; ctx.stroke();
  });
  ctx.fillStyle=color; rr(-gap/2, -lensH/2+6, gap, 9, 4); ctx.fill();
  ctx.restore();
}
function drawGlassesSide(ctx, cx, cy, unitScale, color){
  // simplified side-profile: one lens rim + a long temple arm receding to the right
  ctx.save(); ctx.translate(cx, cy); ctx.scale(unitScale, unitScale);
  ctx.fillStyle=color; ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.ellipse(0,0,26,20,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.beginPath(); ctx.ellipse(0,0,26-9,20-9,0,0,Math.PI*2); ctx.clip();
  ctx.fillStyle='rgba(255,255,255,0.08)'; ctx.fillRect(-30,-30,60,60); ctx.restore();
  ctx.beginPath(); ctx.moveTo(24,-6); ctx.quadraticCurveTo(70,-14,96,-2);
  ctx.lineWidth=9; ctx.strokeStyle=color; ctx.lineCap='round'; ctx.stroke();
  ctx.restore();
}

/* ---- tint a real frame photo toward the selected material color ----
   Keeps near-white background untouched, preserves luminance/texture (grain,
   reflections) on the frame itself, and shifts its hue toward the target color.
   This is an approximate live preview, not a photoreal material render. */
function hexToRgb(hex){
  const v = hex.replace('#','');
  return [parseInt(v.slice(0,2),16), parseInt(v.slice(2,4),16), parseInt(v.slice(4,6),16)];
}
function drawTintedPhoto(ctx, img, w, h, color){
  ctx.clearRect(0,0,w,h);
  if(!img.complete || img.naturalWidth===0) return false;
  // draw image centered, contained within the canvas with a little breathing
  // room (a fraction smaller than edge-to-edge reads less cramped)
  const scale = Math.min(w*0.9/img.naturalWidth, h*0.9/img.naturalHeight);
  const dw = img.naturalWidth*scale, dh = img.naturalHeight*scale;
  const dx = (w-dw)/2, dy = (h-dh)/2;
  ctx.drawImage(img, dx, dy, dw, dh);
  tintRect(ctx, dx, dy, dw, dh, color);
  return true;
}

/* ---- pootje (temple arm) styles, drawn attached to the hinge point of the cropped photo ----
   x,y = hinge point (right edge of the cropped frame photo, vertical mid), scale = px per unit */
function drawPootjeArm(ctx, x, y, scale, color, style){
  ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
  ctx.fillStyle = color; ctx.strokeStyle = 'rgba(0,0,0,.22)'; ctx.lineWidth = 0.6;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  if(style === 'A'){ // classic taper, gentle downward curve
    ctx.beginPath(); ctx.moveTo(0,-3.2);
    ctx.quadraticCurveTo(24,-6, 46,2);
    ctx.quadraticCurveTo(50,4, 50,8);
    ctx.quadraticCurveTo(50,4, 46,6);
    ctx.quadraticCurveTo(24,-1, 0,3.2);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  } else if(style === 'B'){ // thicker, straight, blunt tip
    ctx.beginPath(); ctx.moveTo(0,-4.5);
    ctx.lineTo(44,-3.5); ctx.lineTo(46,3.5); ctx.lineTo(0,4.5);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  } else if(style === 'C'){ // pronounced curl / comfort hook at the end
    ctx.beginPath(); ctx.moveTo(0,-3.2);
    ctx.quadraticCurveTo(22,-5, 38,0);
    ctx.quadraticCurveTo(46,3, 44,9);
    ctx.quadraticCurveTo(42,13, 37,11);
    ctx.quadraticCurveTo(41,7, 34,4);
    ctx.quadraticCurveTo(20,0, 0,3.2);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  } else { // D — thin wire, longer, minimal taper
    ctx.beginPath(); ctx.moveTo(0,-1.6);
    ctx.lineTo(52,-1.1); ctx.lineTo(54,1.1); ctx.lineTo(0,1.6);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

/* tints the frame pixels toward the selected material color and makes the
   photo's near-white background transparent (with a soft feather at the
   boundary) so the stage's own gradient shows through instead of a white
   box sitting on top of it */
function tintRect(ctx, dx, dy, dw, dh, color){
  const [tr,tg,tb] = hexToRgb(color);
  const frame = ctx.getImageData(dx, dy, Math.max(1,Math.round(dw)), Math.max(1,Math.round(dh)));
  const d = frame.data;
  for(let i=0;i<d.length;i+=4){
    const r=d[i], g=d[i+1], b=d[i+2];
    const whiteness = Math.min(r,g,b); // high = near-white background
    if(whiteness > 250){ d[i+3] = 0; continue; }
    if(whiteness > 225){ d[i+3] = Math.round(255 * (250-whiteness)/25); continue; }
    const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
    d[i]   = tr*lum + r*0.18;
    d[i+1] = tg*lum + g*0.18;
    d[i+2] = tb*lum + b*0.18;
  }
  ctx.putImageData(frame, dx, dy);
}

/* ---- side view: draw the montuur's own real rim/hinge photo, tinted, then attach
   the independently-selected pootje (a real cropped temple photo, also tinted) at the
   hinge point, aligned using each photo's own measured hinge height — so montuur and
   pootje read as one connected piece even though they come from different photos.
   Falls back to a hand-drawn vector arm only for Pootje D, which has no photo. ---- */
function drawSideComposite(ctx, img, w, h, color, montuur, pootje){
  ctx.clearRect(0,0,w,h);
  if(!img.complete || img.naturalWidth===0) return false;

  // rim gets a fixed share of the canvas width; the arm gets the rest, each
  // scaled to its own available space (the arm photo is much wider/shorter
  // than the rim crop, so one shared scale would either overflow or shrink
  // the rim to nothing) — kept a fraction under 100% of its budget so the
  // result doesn't look edge-to-edge cropped
  const sw = img.naturalWidth, sh = img.naturalHeight;
  const rimBudget = w * 0.36;
  const scale = Math.min(rimBudget/sw, h*0.60/sh);
  const dw = sw*scale, dh = sh*scale;
  const dx = rimBudget - dw, dy = (h-dh)/2;

  ctx.drawImage(img, 0, 0, sw, sh, dx, dy, dw, dh);
  tintRect(ctx, dx, dy, dw, dh, color);

  const hingeX = dx + dw;
  const hingeY = dy + dh * (montuur.hingeFrac != null ? montuur.hingeFrac : 0.3);
  const armBudget = w - hingeX - w*0.05;

  if(pootje.img){
    const pImg = loadMontuurImage(pootje.img);
    if(pImg.complete && pImg.naturalWidth > 0){
      const pScale = Math.min(armBudget/pImg.naturalWidth, h*0.35/pImg.naturalHeight);
      const pdw = pImg.naturalWidth * pScale, pdh = pImg.naturalHeight * pScale;
      const pFrac = pootje.hingeFrac != null ? pootje.hingeFrac : 0.25;
      const pdx = hingeX, pdy = hingeY - pdh * pFrac;
      ctx.drawImage(pImg, 0, 0, pImg.naturalWidth, pImg.naturalHeight, pdx, pdy, pdw, pdh);
      tintRect(ctx, pdx, pdy, pdw, pdh, color);
    } else {
      // vector fallback (Pootje D has no photo) — scaled to fill the same
      // available width as a real pootje photo would, so it doesn't read
      // as "missing" next to the photographed options
      drawPootjeArm(ctx, hingeX, hingeY, Math.min(armBudget/56, h*0.28/14), color, pootje.id);
      pImg.onload = ()=>{ if(state.pootje===pootje.id) drawPreview(); };
    }
  } else {
    drawPootjeArm(ctx, hingeX, hingeY, Math.min(armBudget/56, h*0.28/14), color, pootje.id);
  }
  return true;
}

/* ---------- configurator preview: front + side canvases, drawn together ---------- */
const previewCanvasVoor = document.getElementById('previewCanvasVoor');
const previewCanvasZij = document.getElementById('previewCanvasZij');
const pvctxVoor = previewCanvasVoor.getContext('2d');
const pvctxZij = previewCanvasZij.getContext('2d');
const stageVoor = document.getElementById('stageVoor');
const stageZij = document.getElementById('stageZij');

/* ---- match the canvas's internal pixel buffer to its real on-screen size
   (times devicePixelRatio) instead of the fixed 360x360 the HTML attributes
   give it — otherwise the browser stretches a small bitmap up to fill the
   much larger CSS box and everything looks soft/blurry. Drawing code keeps
   working in CSS-pixel coordinates because we scale the context to match. */
function fitCanvasToDisplay(canvas, ctx){
  // Draw in actual device pixels (not a transformed CSS-pixel space) so
  // getImageData/putImageData — which always read/write the real backing
  // buffer and ignore ctx transforms — line up with what drawImage drew.
  // The CSS width:100%/height:100% on the element then downscales this
  // higher-res buffer for display, which is what makes it look sharp.
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(rect.width * dpr));
  const h = Math.max(1, Math.round(rect.height * dpr));
  if(canvas.width !== w || canvas.height !== h){
    canvas.width = w; canvas.height = h;
  }
  return { w, h };
}

function drawOneAngle(canvas, ctx, montuur, src, color, fallbackDraw){
  const img = loadMontuurImage(src);
  const { w, h } = fitCanvasToDisplay(canvas, ctx);
  const ok = drawTintedPhoto(ctx, img, w, h, color);
  if(!ok){
    ctx.clearRect(0,0,w,h);
    fallbackDraw(ctx, w/2, h/2, h/138.5, color);
    img.onload = ()=>{ if(getMontuur(state.montuur)===montuur) drawPreview(); };
  }
}

function drawZijAngle(canvas, ctx, montuur, color, pootje){
  const img = loadMontuurImage(montuur.zij);
  const { w, h } = fitCanvasToDisplay(canvas, ctx);
  const ok = drawSideComposite(ctx, img, w, h, color, montuur, pootje);
  if(!ok){
    ctx.clearRect(0,0,w,h);
    drawGlassesSide(ctx, w/2, h/2, h/138.5, color);
    img.onload = ()=>{ if(getMontuur(state.montuur)===montuur) drawPreview(); };
  }
}

function drawPreview(){
  const color = getMateriaal(state.materiaal).hex;
  const montuur = getMontuur(state.montuur);
  const pootje = POOTJES.find(p=>p.id===state.pootje);
  drawOneAngle(previewCanvasVoor, pvctxVoor, montuur, montuur.voor, color, drawGlassesFront);
  drawZijAngle(previewCanvasZij, pvctxZij, montuur, color, pootje);

  const bgVar = state.light === 'studio' ? '--stage-studio' : state.light === 'daylight' ? '--stage-daylight' : '--stage-pearl';
  const bg = getComputedStyle(document.documentElement).getPropertyValue(bgVar);
  document.getElementById('previewStage').style.background =
    `linear-gradient(180deg, ${bg}, color-mix(in srgb, ${bg} 70%, var(--olive)))`;
}

/* ---------- price + ref code ---------- */
function refresh(){
  const total = MONTUREN.find(m=>m.id===state.montuur).price
              + POOTJES.find(p=>p.id===state.pootje).price
              + getMateriaal(state.materiaal).price;
  document.getElementById('totalPrice').textContent = '€' + total;

  const matCode = state.materiaal.slice(0,2).toUpperCase();
  document.getElementById('refCode').textContent = `Ref EW-${state.montuur}${state.pootje}-${matCode}VR00`;

  drawPreview();
  renderOptions();
  syncLiveColor();
}

/* ---------- option rows: Montuur / Pootjes / Materiaal, all visible at once ---------- */
function renderRow(listId, items, selectedId, isColor, onPick){
  const list = document.getElementById(listId);
  list.innerHTML = '';
  items.forEach(item=>{
    const chip = document.createElement('div');
    chip.className = 'wheel-chip' + (item.id===selectedId ? ' selected' : '');

    const thumb = document.createElement('div');
    thumb.className = 'wheel-thumb' + (isColor ? ' swatch-dot' : '');
    if(isColor){
      thumb.style.background = item.hex;
    } else if(item.voor){
      const img = document.createElement('img');
      img.src = item.voor; img.alt = item.label;
      thumb.appendChild(img);
    }
    chip.appendChild(thumb);

    const label = document.createElement('div'); label.className='wheel-label'; label.textContent = item.label;
    const price = document.createElement('div'); price.className='wheel-price';
    price.textContent = item.price > 0 ? `+€${item.price}` : 'incl.';
    chip.appendChild(label); chip.appendChild(price);

    chip.onclick = ()=>{ onPick(item.id); refresh(); };
    list.appendChild(chip);
  });
}

function renderOptions(){
  renderRow('montuurRow', MONTUREN, state.montuur, false, id=>{ state.montuur = id; });
  renderRow('pootjesRow', POOTJES, state.pootje, false, id=>{ state.pootje = id; });
  renderRow('materiaalRow', MATERIALEN, state.materiaal, true, id=>{ state.materiaal = id; });
}

/* ---------- zoom: slider sets a base zoom level, hovering over either
   preview on top of that magnifies further around the cursor position ---- */
const zoomRangeEl = document.getElementById('zoomRange');
function applyZoom(canvas){
  const base = Number(zoomRangeEl.value) / 100;
  canvas.style.transform = `scale(${base})`;
}
zoomRangeEl.addEventListener('input', ()=>{
  applyZoom(previewCanvasVoor);
  applyZoom(previewCanvasZij);
});

/* ---- magnifier: a small round loupe that follows the cursor and shows a
   zoomed-in crop of the image right under it, like a physical magnifying
   glass, instead of scaling the whole preview ---- */
function setupLoupe(panel, sourceCanvas, loupeCanvas){
  const lctx = loupeCanvas.getContext('2d');
  const MAG = 2.4; // how much bigger the loupe shows things vs. normal size
  const loupeCss = 160; // matches the .loupe CSS width/height

  function draw(e){
    const srcRect = sourceCanvas.getBoundingClientRect();
    const mx = e.clientX - srcRect.left, my = e.clientY - srcRect.top;
    if(mx < 0 || my < 0 || mx > srcRect.width || my > srcRect.height){
      loupeCanvas.style.display = 'none';
      return;
    }
    const panelRect = panel.getBoundingClientRect();
    loupeCanvas.style.display = 'block';
    loupeCanvas.style.left = (e.clientX - panelRect.left - loupeCss/2) + 'px';
    loupeCanvas.style.top = (e.clientY - panelRect.top - loupeCss/2) + 'px';

    const pxPerCss = sourceCanvas.width / srcRect.width; // device px per CSS px
    const deviceX = mx * pxPerCss, deviceY = my * pxPerCss;
    const regionDevice = (loupeCss / MAG) * pxPerCss;
    const sx = Math.max(0, Math.min(sourceCanvas.width - regionDevice, deviceX - regionDevice/2));
    const sy = Math.max(0, Math.min(sourceCanvas.height - regionDevice, deviceY - regionDevice/2));

    lctx.clearRect(0, 0, loupeCanvas.width, loupeCanvas.height);
    lctx.drawImage(sourceCanvas, sx, sy, regionDevice, regionDevice, 0, 0, loupeCanvas.width, loupeCanvas.height);
  }
  panel.addEventListener('mousemove', draw);
  panel.addEventListener('mouseleave', ()=>{ loupeCanvas.style.display = 'none'; });
}
setupLoupe(document.getElementById('stageVoor'), previewCanvasVoor, document.getElementById('loupeVoor'));
setupLoupe(document.getElementById('stageZij'), previewCanvasZij, document.getElementById('loupeZij'));

/* ---------- light toggle ---------- */
document.getElementById('lightToggle').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-light]'); if(!btn) return;
  state.light = btn.dataset.light;
  document.querySelectorAll('#lightToggle button').forEach(b=>b.classList.toggle('active', b===btn));
  refresh();
});

/* ---------- action buttons ---------- */
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> t.classList.remove('show'), 2200);
}
document.getElementById('resetBtn').addEventListener('click', ()=>{
  state = { montuur:1, pootje:'A', materiaal:'nachtblauw', view:'voor', light:'studio' };
  document.querySelectorAll('#lightToggle button').forEach(b=>b.classList.toggle('active', b.dataset.light==='studio'));
  document.getElementById('zoomRange').value = 100;
  previewCanvasVoor.style.transform = 'scale(1)';
  previewCanvasZij.style.transform = 'scale(1)';
  refresh();
  showToast('Ontwerp gereset');
});
document.getElementById('finishBtn').addEventListener('click', ()=>{
  const m = MONTUREN.find(x=>x.id===state.montuur), p = POOTJES.find(x=>x.id===state.pootje), mat = getMateriaal(state.materiaal);
  showToast(`${m.label} · ${p.label} · ${mat.label} — ${document.getElementById('totalPrice').textContent} bewaard`);
});
const tryonModal = document.getElementById('tryonModal');
function openTryOn(){
  tryonModal.hidden = false;
  if(!running) document.getElementById('startBtn').click();
}
function closeTryOn(){
  tryonModal.hidden = true;
  if(currentStream){ currentStream.getTracks().forEach(t=>t.stop()); currentStream = null; }
  running = false;
  startMsg.style.display = 'flex';
  startMsg.innerHTML = '<div><div>Geef toegang tot je camera om de bril te passen.</div><button id="startBtn">Camera starten</button></div>';
  document.getElementById('startBtn').addEventListener('click', startCamera);
}
document.getElementById('tryOnBtn').addEventListener('click', openTryOn);
document.getElementById('closeTryOn').addEventListener('click', closeTryOn);
tryonModal.addEventListener('click', (e)=>{ if(e.target===tryonModal) closeTryOn(); });

/* ---------- live camera AR (uses configurator's material color) ---------- */
const video = document.getElementById('video');
const liveCanvas = document.getElementById('liveCanvas');
const lctx = liveCanvas.getContext('2d');
const startMsg = document.getElementById('startMsg');
const startBtn = document.getElementById('startBtn');
const snapBtn = document.getElementById('snapBtn');
const snapLink = document.getElementById('snapLink');
const switchCamBtn = document.getElementById('switchCamBtn');

let currentStream = null, facingMode = 'user', faceMesh = null, running = false, lastLandmarks = null, busy = false;

function syncLiveColor(){ /* color read live from state.materiaal at draw time, nothing to precompute */ }

function resizeLiveCanvas(){
  const rect = video.getBoundingClientRect();
  liveCanvas.width = rect.width; liveCanvas.height = rect.height;
}
window.addEventListener('resize', resizeLiveCanvas);
let previewResizeTimer = null;
window.addEventListener('resize', ()=>{
  clearTimeout(previewResizeTimer);
  previewResizeTimer = setTimeout(drawPreview, 120);
});

async function startCamera(){
  try{
    if(currentStream){ currentStream.getTracks().forEach(t=>t.stop()); }
    currentStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode, width:{ideal:640}, height:{ideal:480} }, audio:false });
    video.srcObject = currentStream;
    await video.play();
    resizeLiveCanvas();
    startMsg.style.display = 'none';
    if(!faceMesh) initFaceMesh();
    if(!running){ running = true; requestAnimationFrame(loop); }
  }catch(err){
    startMsg.innerHTML = '<div>Kon geen toegang krijgen tot de camera.<br><span style="opacity:.8;font-size:.8em;">'+ (err.message||err) +'</span></div>';
    startMsg.style.display = 'flex';
  }
}
startBtn.addEventListener('click', startCamera);
switchCamBtn.addEventListener('click', ()=>{
  facingMode = facingMode==='user' ? 'environment' : 'user';
  video.style.transform = facingMode==='user' ? 'scaleX(-1)' : 'none';
  startCamera();
});

function initFaceMesh(){
  faceMesh = new FaceMesh({ locateFile:(f)=> `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}` });
  faceMesh.setOptions({ maxNumFaces:1, refineLandmarks:true, minDetectionConfidence:0.6, minTrackingConfidence:0.6 });
  faceMesh.onResults(res=>{ lastLandmarks = (res.multiFaceLandmarks && res.multiFaceLandmarks[0]) || null; });
}

async function loop(){
  if(!running) return;
  if(video.readyState >= 2 && faceMesh && !busy){
    busy = true;
    try{ await faceMesh.send({ image: video }); } catch(e){}
    busy = false;
  }
  drawLive();
  requestAnimationFrame(loop);
}

function drawLive(){
  const w = liveCanvas.width, h = liveCanvas.height;
  lctx.clearRect(0,0,w,h);
  if(!lastLandmarks) return;
  const toXY = (idx)=>{ const p = lastLandmarks[idx]; return { x: p.x*w, y: p.y*h }; };
  const leftOuter = toXY(33), rightOuter = toXY(263);
  const mirrored = facingMode === 'user';
  const mx = (x)=> mirrored ? (w-x) : x;
  const p1 = { x: mx(leftOuter.x), y: leftOuter.y };
  const p2 = { x: mx(rightOuter.x), y: rightOuter.y };
  const dx = p2.x-p1.x, dy = p2.y-p1.y;
  const eyeDist = Math.hypot(dx,dy);
  const angle = Math.atan2(dy,dx);
  const cx = (p1.x+p2.x)/2, cy = (p1.y+p2.y)/2 + eyeDist*0.03;
  lctx.save(); lctx.translate(cx,cy); lctx.rotate(angle); lctx.translate(-cx,-cy);
  drawGlassesFront(lctx, cx, cy, eyeDist/100, getMateriaal(state.materiaal).hex);
  lctx.restore();
}

snapBtn.addEventListener('click', ()=>{
  const out = document.createElement('canvas');
  out.width = liveCanvas.width; out.height = liveCanvas.height;
  const octx = out.getContext('2d');
  octx.save();
  if(facingMode==='user'){ octx.translate(out.width,0); octx.scale(-1,1); }
  octx.drawImage(video, 0, 0, out.width, out.height);
  octx.restore();
  octx.drawImage(liveCanvas, 0, 0);
  snapLink.href = out.toDataURL('image/png');
  snapLink.click();
});

refresh();
</script>
